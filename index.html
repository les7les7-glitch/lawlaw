/* LAW / 175 — Swipe Study. No external UI frameworks or fonts. */
:root {
  color-scheme: dark;
  --bg:#0a1019; --paper:#121d2a; --paper-elevated:#172432; --paper-soft:#182634;
  --edge:#2a3b48; --edge-faint:#1c2b37; --ink:#ebf0ef; --ink-muted:#9aacb3;
  --ink-faint:#718994; --accent:#b3e1cc; --accent-deep:#173b3a;
  --gold:#d6bd92; --red:#e3a7a1; --amber:#ecc69a; --green:#9eddbf;
  --shadow:0 24px 80px rgba(0,0,0,.28); --rail-width:278px;
  --nav-height:70px; --safe-bottom:env(safe-area-inset-bottom, 0px); --safe-top:env(safe-area-inset-top, 0px);
}
* {box-sizing:border-box}
html{min-width:320px;background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:14px;line-height:1.5;letter-spacing:-.025em;overflow-x:hidden;overscroll-behavior-x:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(ellipse 65% 45% at 94% 4%,rgba(89,134,122,.10),transparent 85%),radial-gradient(ellipse 55% 40% at 1% 88%,rgba(55,101,110,.07),transparent 85%)}
svg.ico {width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.svg-icons{position:absolute;width:0;height:0;overflow:hidden}
button,input,textarea{font:inherit;letter-spacing:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.36;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,.study-flashcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent)}
[hidden]{display:none!important}
.tiny-overline{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--accent)}
.app-frame{min-height:100vh;min-height:100dvh;display:flex}
.desktop-rail{width:var(--rail-width);flex:0 0 var(--rail-width);height:100vh;height:100dvh;position:sticky;top:0;display:flex;flex-direction:column;background:linear-gradient(150deg,#101c28,#0c161f);border-right:1px solid #243542;z-index:5}
.rail-brand{padding:28px 25px 26px;display:flex;align-items:center;gap:13px;border-bottom:1px solid rgba(148,181,176,.10)}

.rail-tools{padding:0 17px 10px}.search-field{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:1px solid #30404d;border-radius:12px;padding:0 13px;background:#152430;color:var(--ink-faint)}.search-field .ico{width:17px;height:17px}

.grade-dot{width:7px;height:7px;border-radius:50%;background:#3d5260;flex:none}.grade-dot.g0{background:var(--red)}.grade-dot.g1{background:var(--amber)}.grade-dot.g2{background:var(--green)}

.header-buttons{display:flex;align-items:center;gap:8px}.icon-button{width:40px;height:40px;display:grid;place-items:center;background:#162430;border:1px solid #2d3d49;border-radius:13px;color:#9fb5b7;transition:background .2s,border-color .2s}.icon-button:hover{background:#20333e}.icon-button.saved{color:#dfc995;background:#2e2a26;border-color:#64553f}.icon-button.saved .ico{fill:currentColor}.icon-button .ico{width:18px;height:18px}
.clock-button{display:flex;align-items:center;gap:8px;min-width:88px;height:40px;padding:0 12px;background:#162430;border:1px solid #2d3d49;border-radius:13px;color:#a8bac1;font-size:12px;font-weight:760;font-variant-numeric:tabular-nums}.clock-button .ico{width:15px;height:15px}.clock-dot{height:6px;width:6px;border-radius:50%;background:#425767}.clock-button.running .clock-dot{background:var(--accent);box-shadow:0 0 0 4px rgba(151,215,186,.13)}.clock-button.finished{color:var(--amber)}
.main-content{max-width:960px;margin:0 auto;padding:29px clamp(18px,4.5vw,66px) 125px}
.deck-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px}.deck-location{display:flex;align-items:center;gap:10px;min-width:0}.volume-badge{flex:none;border-radius:7px;color:#102b28;background:#a6deca;padding:6px 9px;font-weight:900;font-size:10px;letter-spacing:.05em}.chapter-label{font-size:12px;color:#9fb5b5;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck-count{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;flex:none}.deck-count strong{font-size:22px;font-weight:780;color:#e5f3ec;letter-spacing:-.06em}.deck-count span{font-size:11px;color:var(--ink-faint)}

.gesture-shell.enter-right{transform:translate3d(30%,0,0);opacity:0}.gesture-shell.enter-left{transform:translate3d(-30%,0,0);opacity:0}.gesture-shell.entering{transition:transform .25s cubic-bezier(.22,1,.36,1),opacity .22s ease-out;transform:translate3d(0,0,0);opacity:1}

.flash-title{font-size:14px;font-weight:820;color:#a9d3c4;margin:22px 0 8px}.flash-question{font-size:clamp(28px,3.4vw,39px);line-height:1.43;letter-spacing:-.057em;font-weight:770;margin:0 0 27px;word-break:keep-all;max-width:710px}
.front-space{flex:1;min-height:16px}.front-divider{height:1px;width:100%;background:linear-gradient(90deg,rgba(189,232,209,.25),transparent);margin:10px 0 20px}

.back-topic{margin:0 0 7px;color:#9bbab6;font-size:13px;font-weight:750}.back-title{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.045em;margin:0 0 22px;word-break:keep-all}
.focus-box{border:1px solid #41695e;border-radius:15px;background:linear-gradient(125deg,rgba(94,154,134,.14),rgba(31,58,59,.22));padding:19px 19px 20px;margin-bottom:15px}
.focus-label{font-size:10px;letter-spacing:.09em;font-weight:880;color:#a7dfc6;display:flex;align-items:center;gap:6px;margin-bottom:9px}.focus-label .ico{height:15px;width:15px}.focus-value{font-size:17px;line-height:1.62;font-weight:790;color:#ebf6eb;word-break:keep-all;margin:0}

.extra-area{display:flex;flex-direction:column;gap:11px;margin:11px 0 12px}.accordion-card{background:#12202c;border:1px solid #2d414d;border-radius:15px;overflow:hidden}.accordion-trigger{display:flex;align-items:center;justify-content:space-between;gap:15px;width:100%;text-align:left;padding:17px 19px;border:0;background:transparent;color:var(--ink)}.accordion-trigger:hover{background:#1b2c37}
.accordion-left{display:flex;align-items:center;gap:13px}.accordion-glyph{height:41px;width:41px;border-radius:12px;background:#253e40;display:grid;place-items:center;color:#b0dec9;flex:none}.accordion-glyph.gold{color:#dfc79f;background:#3a352d}.accordion-trigger strong{display:block;font-size:13px;letter-spacing:-.02em}.accordion-trigger small{display:block;color:var(--ink-faint);font-size:11px;margin-top:4px}.accordion-chevron{color:#90b7ab;transition:transform .18s}.accordion-trigger[aria-expanded=true] .accordion-chevron{transform:rotate(180deg)}

window.LAW_TOPICS=[{"id":1,"title":"사실과 당위","page":67,"vol":1,"chapter":"법의 철학적 기초","question":"많은 사람이 하는 행동이라면 법적으로 허용해야 할까?","focus":"사실의 기술과 규범적 정당화는 다르다.","viewA":"관행은 사회적 수용성과 집행 가능성을 보여준다.","viewB":"관행이 널리 퍼졌어도 부당할 수 있다.","followup":"관행의 지속성만으로 정당성을 확보할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사실 명제는 관찰·통계로 검증하고, 당위 명제는 권리·정의·공익 같은 규범으로 정당화한다.","무단횡단이 잦다는 자료는 단속의 현실이나 도로 설계 문제를 보여줄 뿐, 허용해야 한다는 결론을 직접 주지 않는다.","현실을 완전히 무시한 규범은 집행하기 어렵지만, 집행이 어렵다는 이유만으로 규범을 폐기할 수도 없다.","따라서 ‘현재 무엇이 일어나는가’와 ‘무엇이 바람직한가’를 별개의 질문으로 놓고 그 사이의 근거를 찾아야 한다.","면접에서는 실태를 인정한 다음 피해·기본권·대안의 관점에서 법 개정의 타당성을 독립적으로 판단하면 된다."],"followupAnswer":"그 자체로는 부족하다. 오래 지속된 관행은 사회적 수용성의 자료일 뿐이며, 피해의 규모와 권리 침해, 다른 제도적 선택지를 검토한 후에야 정당성을 평가할 수 있다."},{"id":2,"title":"인간본성론","page":73,"vol":1,"chapter":"법의 철학적 기초","question":"인간은 본래 이기적인가, 협력적인가?","focus":"성선·성악·환경의 영향 중 무엇을 전제로 제도를 만들지.","viewA":"신뢰와 자율을 전제하면 과도한 통제를 줄인다.","viewB":"유인과 제재가 없으면 제도가 악용될 수 있다.","followup":"인간 본성에 대한 가정이 틀리면 제도도 바꿔야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["인간본성론은 사람을 본래 선하거나 악하다고 단정하기보다 어떤 조건에서 협력·기회주의가 나타나는지를 묻는 틀이다.","선한 동기를 가정하면 자율과 신뢰를 살린 제도를 만들 수 있지만 남용을 감시할 장치는 여전히 필요하다.","반대로 불신만을 전제하면 감독 비용이 커지고 선의의 행동까지 위축시키는 역효과가 생길 수 있다.","제도 설계에서는 투명한 정보, 반복 거래, 적절한 보상과 제재가 행동을 어떻게 바꾸는지 살핀다.","일률적 인간관보다 ‘악용 가능성을 막되 정상적인 참여를 어렵게 하지 않는 장치’라는 균형이 유용하다."],"followupAnswer":"그렇다. 제도는 특정한 인간관을 절대적 진리로 삼지 말고 실제 행태와 부작용을 통해 수정해야 한다. 다만 단기적 일탈이 보였다는 이유만으로 기본적인 신뢰와 자유를 모두 철회해서는 안 된다."},{"id":3,"title":"의무론적 윤리설, 목적론적 윤리설","page":80,"vol":1,"chapter":"법의 철학적 기초","question":"좋은 결과를 위해 원칙을 어겨도 될까?","focus":"의무론은 행위의 원칙, 목적론은 결과에 무게를 둔다.","viewA":"결과 중심 판단은 사회적 편익을 높일 수 있다.","viewB":"권리를 수단화하면 소수자가 희생될 수 있다.","followup":"한 사람의 희생으로 다수를 구한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["의무론은 행위가 지켜야 할 의무·권리를 기준으로, 결과 중심 윤리설은 행위가 낳는 효용이나 선을 기준으로 평가한다.","좋은 결과를 얻었다고 해서 타인을 속이거나 무고한 사람을 수단으로 쓰는 행위까지 당연히 정당화되지는 않는다.","그렇다고 원칙을 기계적으로 적용해 큰 피해를 피할 가능성까지 외면하면 판단의 설득력이 떨어진다.","먼저 침해되는 권리가 무엇인지, 그 권리가 절대적인지와 예외를 인정할 수 있는지 구분해 논증한다.","실전에서는 원칙을 기본선으로 두고, 불가피성·피해 최소화·대체 수단의 존재 여부를 단계적으로 따지는 답이 안정적이다."],"followupAnswer":"다수를 구하는 결과는 매우 중요하지만, 무고한 사람을 의도적으로 희생시키는 방법은 신중히 제한해야 한다. 대안이 전혀 없고 긴급한 상황인지 확인하되 결과가 좋다는 이유만으로 타인의 생명을 도구화할 수는 없다."},{"id":4,"title":"절대주의, 상대주의","page":86,"vol":1,"chapter":"법의 철학적 기초","question":"누구에게나 적용되는 보편적 도덕이 있을까?","focus":"절대적 기준과 맥락에 따른 해석의 긴장.","viewA":"보편 기준은 기본권 보호의 공통선을 만든다.","viewB":"문화·상황을 무시한 일률 기준은 부당할 수 있다.","followup":"문화의 이름으로 심각한 인권침해를 허용할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["도덕적 절대주의는 상황과 무관한 기준을, 상대주의는 문화·역사·맥락에 따른 평가 차이를 강조한다.","상대주의는 다양한 삶의 양식을 존중하게 하지만 ‘그 사회가 허용한다’는 이유만으로 모든 관행을 면책하지는 못한다.","보편 기준은 최소한의 인권을 보호하지만, 그 내용을 누가 정하고 어떻게 적용하는지 역시 검증이 필요하다.","쟁점은 모든 차이를 없애는 것이 아니라 인간 존엄을 훼손하지 않는 범위에서 차이를 인정하는 데 있다.","먼저 기본적 생명·자유에 대한 침해인지 살피고, 그렇지 않다면 문화적 맥락과 당사자 의사를 폭넓게 고려한다."],"followupAnswer":"허용하기 어렵다. 문화는 관행을 이해하는 근거일 수 있어도 심각한 폭력이나 강제적 박탈을 정당화하는 면허는 아니다. 다만 판단 과정에서는 외부의 편견을 경계하고 피해 당사자의 목소리도 확인해야 한다."},{"id":5,"title":"법의 형식과 내용","page":94,"vol":1,"chapter":"법의 철학적 기초","question":"절차만 지킨 법이라면 내용도 정당한가?","focus":"법적 형식적 적법성 대 실질적 정의.","viewA":"예측 가능하고 안정적인 절차는 필수다.","viewB":"절차가 적법해도 내용이 차별적일 수 있다.","followup":"내용이 정의롭지만 절차에 하자가 있는 법은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법의 ‘형식’은 제정권한·절차·공포·명확성 같은 요건이고, ‘내용’은 평등·자유·정의 등 실질적 정당성에 해당한다.","절차가 정당하면 누구나 규칙을 예측할 수 있지만, 그 규칙이 소수자를 차별하면 별개의 문제가 남는다.","반대로 좋은 목적을 내세워 절차를 건너뛰면 다음번에는 나쁜 목적에도 같은 예외가 이용될 수 있다.","법적 효력의 문제와 법을 비판·개정해야 한다는 문제를 구별하는 것이 논리의 출발점이다.","면접 답변은 ‘형식적 정당성 인정 → 실질적 문제 제기 → 적법한 수정 절차 제안’ 순서로 정리할 수 있다."],"followupAnswer":"목적이 선하다는 이유만으로 절차 위반이 자동 정당화되지는 않는다. 하자의 정도와 권리침해를 따져 시정하거나 재의결하고, 긴급한 경우에도 사후 통제 가능성을 남겨야 한다."},{"id":6,"title":"롤스의 절차적 정의","page":102,"vol":1,"chapter":"법의 철학적 기초","question":"공정한 규칙은 어떤 절차에서 탄생할까?","focus":"무지의 베일·원초적 입장·최소수혜자 관점.","viewA":"자기 지위를 모를 때 편향을 줄일 수 있다.","viewB":"가상적 합의가 현실의 복잡한 선호를 담기 어렵다.","followup":"미래에 취약계층이 될 확률을 알고 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["롤스의 원초적 입장은 구성원이 자신의 계층·능력·지위를 모르는 무지의 베일 아래에서 정의 원칙을 선택하는 가상 장치다.","자신이 약자가 될 수도 있다고 생각하면 누구에게나 중요한 기본적 자유와 안전망을 중시할 유인이 생긴다.","이 사고실험은 현실의 만장일치를 뜻하지 않으며, 실제 정책의 비용·성과가 검증됐다는 뜻도 아니다.","기본적 자유의 우선성과 불평등의 정당화 조건을 구별하고, 어느 집단이 불리해지는지도 살핀다.","제도를 논할 때 자기 집단의 이익을 잠시 지우고 가장 불리한 입장에서 수용할 수 있는 규칙인지 물으면 좋다."],"followupAnswer":"확률에 대한 구체적 정보를 얻으면 선택은 달라질 수 있다. 하지만 공정성을 확보하려는 실험의 목적상 우연한 사회적 위치가 원칙 선택을 지배하지 않도록 해야 한다."},{"id":7,"title":"형식중심주의","page":107,"vol":1,"chapter":"법의 철학적 기초","question":"내용의 옳고 그름보다 규칙의 형식을 중시해야 할까?","focus":"형식 중심 접근이 자유·다원주의와 만나는 지점.","viewA":"공통 절차는 가치 충돌 속 공존을 가능하게 한다.","viewB":"형식만 공정해도 결과의 불평등은 남는다.","followup":"절차의 공정성을 이유로 극단적 결과를 수용할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["형식중심주의는 무엇이 ‘옳은가’에 대한 논쟁보다 정당한 절차와 공통의 규칙이 어떻게 유지되는지를 중시한다.","가치관이 다른 시민도 동일한 절차에 참여할 수 있다는 점에서 다원적 사회의 공존 조건을 마련한다.","그러나 절차적 평등만 보장하고 결과의 극단적 불평등을 외면한다면 규칙에 대한 신뢰가 약해질 수 있다.","여기서 말하는 형식은 단순한 서류 작업이 아니라 공개성·일반성·예측 가능성 등을 포함한다.","실전에서는 형식의 장점을 인정하면서도 기본권 침해나 참여 기회 불균형에 대한 실질 통제를 덧붙인다."],"followupAnswer":"극단적으로 차별적인 결과라면 절차만을 근거로 수용하기 어렵다. 공정한 절차에도 기본권 보호라는 한계가 있어야 하며, 절차가 실질적 배제 구조를 재생산하는지도 살펴야 한다."},{"id":8,"title":"사적 처벌","page":112,"vol":1,"chapter":"법의 철학적 기초","question":"국가가 충분히 처벌하지 않을 때 개인이 직접 응징해도 될까?","focus":"형벌권의 국가 독점과 피해자의 정의감.","viewA":"피해자 회복과 억울함 해소 요구가 존재한다.","viewB":"오판·보복의 연쇄·자의적 폭력 위험이 크다.","followup":"국가가 사실상 기능하지 못한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사적 처벌은 피해자 또는 제3자가 국가의 적법한 절차를 거치지 않고 제재를 가하는 것을 뜻한다.","국가 형벌권의 독점은 피해자의 감정을 무시하려는 것이 아니라 사실인정·비례성·오판 가능성을 공개적으로 통제하기 위해서다.","응징 욕구가 생기는 배경에는 수사의 부실, 피해 회복의 지연, 형벌의 불충분함이 있을 수 있다.","그 해결책은 사적 폭력을 허용하기보다 수사 통제·피해자 지원·민사적 회복 절차를 개선하는 데 있다.","즉시 위험을 막는 정당방위와 과거 행위에 대한 사후 보복을 구별하는 것이 핵심이다."],"followupAnswer":"국가 기능이 마비된 상황에서도 사후 보복을 일반적으로 허용하기는 어렵다. 생명·신체에 대한 즉각적 방어는 별도로 검토하되, 최소한의 공정한 심사와 피해회복 절차를 회복하는 쪽이 우선이다."},{"id":9,"title":"자유주의: 안락사","page":117,"vol":1,"chapter":"법의 철학적 기초","question":"회복 가능성이 없는 환자의 자기결정은 어디까지 인정할까?","focus":"자기결정권·생명보호·동의의 진정성.","viewA":"존엄과 고통 경감을 존중할 수 있다.","viewB":"압박·판단능력·오진 위험을 통제해야 한다.","followup":"경제적 부담 때문에 동의했다면 자유로운 선택인가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["안락사 논쟁에서는 치료중단, 연명의료 유보, 직접적 생명 단축 행위를 개념적으로 구분할 필요가 있다.","자기결정이 실질적이려면 충분한 의학적 설명, 의사결정 능력, 반복적이고 자발적인 의사표시가 필요하다.","존엄과 고통의 관점은 중요하지만, 가족의 부담·경제적 압박이 환자 의사를 왜곡할 가능성도 있다.","회복 가능성의 평가와 완화의료 등 다른 선택지가 충분히 제공되는지 역시 중요한 조건이다.","법정책을 설계한다면 의사 확인, 독립적 검토, 기록·사후심사를 통해 오남용을 줄여야 한다."],"followupAnswer":"경제적 부담이 핵심 동기였다면 자유로운 선택인지 강하게 의심해야 한다. 먼저 치료·돌봄·경제 지원을 확보한 뒤에도 지속되는 환자 본인의 의사인지 재확인해야 한다."},{"id":10,"title":"자유주의: 성인 간 성매매","page":130,"vol":1,"chapter":"법의 철학적 기초","question":"성인의 자발적 성매매를 국가가 금지할 수 있을까?","focus":"자기결정권과 착취·사회적 해악의 대립.","viewA":"자발적 거래에 대한 과도한 국가 개입을 경계한다.","viewB":"구조적 빈곤과 착취로 진정한 자발성이 약화될 수 있다.","followup":"당사자 보호를 위해 어떤 규제가 비례적인가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성매매 규제는 성인의 계약 자유만이 아니라 성착취·알선 구조·시장 불평등까지 동시에 다룬다.","자발성과 강제성을 구별하되 계약에 동의했다는 사실 하나로 착취 가능성이 사라지는 것은 아니다.","전면 금지는 거래를 음성화해 안전과 신고를 더 어렵게 할 수 있다는 주장이 있다.","반대로 규제 완화가 수요를 늘려 취약한 사람들의 유입을 촉진한다는 우려도 검토해야 한다.","처벌의 대상을 누구로 정할지, 피해 지원과 탈성매매 지원을 어떻게 설계할지가 실질적 쟁점이다."],"followupAnswer":"당사자의 안전·건강·신고 가능성을 보장하는 규제가 우선되어야 한다. 직접적 폭력·강요·착취에는 강한 제재를 두되, 자발적 행위에 대한 규제는 보호 효과와 부작용을 비교해야 한다."},{"id":11,"title":"공동체주의: 공원 음주 금지","page":141,"vol":1,"chapter":"법의 철학적 기초","question":"공원에서 음주를 금지하면 공동체가 더 나아질까?","focus":"공동 공간의 질서와 개인의 자유.","viewA":"갈등·안전 문제를 사전에 줄일 수 있다.","viewB":"일괄 금지는 조용한 이용자까지 제한한다.","followup":"시간·장소 제한으로 목적을 달성할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["공원 음주는 주거지와 달리 누구나 이용하는 공동 공간에서 발생하는 외부효과를 수반한다.","음주 자체보다 소음·쓰레기·폭행 같은 구체적 위해가 규제 근거로 적절한지 따진다.","특정 시간·구역에서 문제가 집중된다면 일률적 금지보다 표적 규제가 덜 침해적일 수 있다.","실효성을 높이려면 금지구역을 명확히 알리고 시민 의견과 집행 자료를 반영해야 한다.","정책 효과는 민원 감소뿐 아니라 풍선효과·취약계층 단속 편중까지 포함해 평가해야 한다."],"followupAnswer":"가능하다. 시간·장소 제한, 소음·쓰레기 집중 단속으로 위해를 줄일 수 있다면 전면 금지보다 비례적이다. 다만 실제 위험이 지속되면 범위를 조정할 수 있다."},{"id":12,"title":"공동체주의: 존속대상범죄 가중처벌","page":149,"vol":1,"chapter":"법의 철학적 기초","question":"부모를 대상으로 한 범죄를 일반 범죄보다 무겁게 처벌해야 할까?","focus":"가족 보호와 행위책임·평등 원칙.","viewA":"가족 내 신뢰관계 침해의 특수성을 반영한다.","viewB":"가족관계를 이유로 동일한 결과의 형량이 달라진다.","followup":"지속적 학대가 있었던 가족관계에도 같은 기준을 적용할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["존속대상 범죄 가중처벌은 친족 간 신뢰관계의 특별한 보호와 모든 피해자의 동등한 가치가 충돌하는 문제다.","가족관계가 사건의 위험성이나 피해 정도를 높이는 실제 사유인지, 단지 신분만을 이유로 가중하는지 구별한다.","노부모에 대한 경제적·신체적 의존, 반복 학대 같은 사정은 별도의 양형 요소가 될 수 있다.","피해가 같은데 관계만 달라 법정형이 과도하게 달라지면 평등·비례 문제를 제기할 수 있다.","가족의 보호를 중시하더라도 피해자의 방어행위와 장기간 학대 맥락을 무시해서는 안 된다."],"followupAnswer":"같은 기준을 기계적으로 적용해서는 안 된다. 장기간의 학대·폭력이 있었다면 행위 경위, 책임 정도, 정당방위 가능성까지 개별적으로 심사해야 한다."},{"id":13,"title":"공동체주의: 사마리아인의 법","page":156,"vol":1,"chapter":"법의 철학적 기초","question":"위험에 빠진 낯선 사람을 구하지 않으면 처벌해야 할까?","focus":"도덕적 도움 의무를 법적 의무로 바꿀 범위.","viewA":"큰 위험 없이 생명을 구할 수 있다면 법적 의무가 설득력 있다.","viewB":"개인 자유를 침해하고 의무 범위가 불명확해질 수 있다.","followup":"구조 중 본인에게 조금이라도 위험이 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사마리아인의 법은 위급한 타인을 돕는 도덕적 의무를 일정 범위에서 법적 의무로 전환하는 문제다.","법적 의무는 ‘누가’, ‘언제’, ‘어떤 구조를’, ‘얼마나 위험을 감수하며’ 해야 하는지 예측 가능해야 한다.","직접 구조가 위험하면 신고나 구조요청도 의미 있는 도움으로 인정할 수 있는지 검토한다.","의무가 너무 넓으면 일반 시민이 구조를 두려워하거나 책임을 회피할 수 있다.","생명에 대한 급박한 위험, 쉽게 가능한 구조, 과도한 자기위험이 없는 상황으로 좁히는 접근이 설득력 있다."],"followupAnswer":"위험의 크기와 구조 수단을 구분해야 한다. 구조자에게 중대한 위험이 있다면 직접 구조를 요구하기 어렵지만, 안전하게 신고하거나 전문가를 부를 의무는 검토할 수 있다."},{"id":14,"title":"공리주의: 핀토 리콜","page":163,"vol":1,"chapter":"법의 철학적 기초","question":"기업이 제품 결함으로 사망 위험을 예상해도 비용상 리콜을 미뤄도 될까?","focus":"비용편익 분석의 효용과 인간 생명의 비계량 가치.","viewA":"사고 가능성과 규모를 비교해 자원을 배분할 수 있다.","viewB":"예상 비용으로 생명·존엄을 단순 환산할 수 없다.","followup":"안전 개선 비용이 사실상 기업을 도산시킨다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["핀토 리콜 논쟁의 핵심은 소비자의 생명·안전에 대한 위험을 손해배상 기대액으로만 계산할 수 있는가이다.","비용편익 분석은 제한된 자원의 배분에 도움이 되지만 무엇을 비용으로 산정하는지에 따라 결론이 크게 달라진다.","사망·중상 위험의 확률이 낮아도 예견 가능한 중대한 피해라면 특별한 안전의무가 요구될 수 있다.","기업이 결함 정보를 독점하면 소비자는 위험을 알고 선택할 기회를 잃는다.","대안에는 사전 위험평가, 결함 공개, 단계적 개선, 감독기관 보고와 리콜이 있다."],"followupAnswer":"회사의 존립도 고려할 요소이지만 인명 위험의 은폐를 정당화하지 못한다. 중대한 결함이라면 판매중단·수리·정보공개 등 피해 최소화 방안을 우선하고 공적 지원 등 다른 수단도 검토해야 한다."},{"id":15,"title":"공리주의: 죄와 벌","page":167,"vol":1,"chapter":"법의 철학적 기초","question":"범죄를 줄이기 위해 무고한 사람을 처벌할 수 있을까?","focus":"사회 총효용과 개인 권리의 충돌.","viewA":"일반예방·사회적 편익을 고려한다.","viewB":"무고한 사람 처벌은 정의와 법 신뢰를 파괴한다.","followup":"극단적 공공위기 상황에도 원칙은 유지될까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["형벌은 범죄예방뿐 아니라 행위자에게 책임 있는 행위만큼의 제재를 부과한다는 정의 원칙을 포함한다.","무고한 사람의 처벌은 단기적 공포 억제효과를 기대하더라도 오판의 정상화와 국가 신뢰 파괴를 초래한다.","공리주의적 효율 논증도 장기적으로는 국가권력 남용·시민 불신의 비용을 포함해야 한다.","죄형법정주의·적법절차·무죄추정은 결과가 좋을 때만 지키는 선택사항이 아니다.","정책의 목적과 처벌수단의 정당성을 분리해 판단해야 실무적인 논증이 된다."],"followupAnswer":"공공위기일수록 정당한 절차와 사실인정이 중요해진다. 예외적 비상조치는 검토할 수 있어도 무고한 사람을 고의로 범죄자로 만드는 행위는 허용하기 어렵다."},{"id":16,"title":"자유지상주의: 장기매매","page":172,"vol":1,"chapter":"법의 철학적 기초","question":"자발적 장기매매를 허용해야 할까?","focus":"신체 자기결정·효율성과 취약계층 착취의 충돌.","viewA":"장기 공급 확대와 자발적 거래를 기대한다.","viewB":"빈곤층에게 과도한 선택 압박이 가해질 수 있다.","followup":"비금전 보상·공적 배분 방식은 대안이 될까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["장기매매는 신체에 대한 처분의 자유와 의료자원의 분배 원칙을 함께 묻는 주제다.","장기 수요가 높다는 현실은 공급 확대의 필요성을 보여주지만 거래시장 도입의 정당성을 자동으로 입증하지 않는다.","빈곤층이 사실상 선택의 여지가 없는 상태에서 장기를 판매한다면 형식적 동의만으로 충분하지 않다.","매매 허용 시에는 장기적 건강 피해, 중개인의 착취, 이식 대상자 간 경제력 격차가 발생할 수 있다.","공적 배분·기증 활성화·의료 지원·피해 보상을 먼저 평가하는 접근이 가능하다."],"followupAnswer":"가능하다. 다만 금전적 가격에 따른 배분이 아니라 기증자의 손실·의료비 보전을 중심으로 하고, 수혜자 선정에는 의료적 필요·공정한 대기 원칙을 유지해야 한다."},{"id":17,"title":"롤스의 자유주의: 가산점 제도","page":178,"vol":1,"chapter":"법의 철학적 기초","question":"사회적 약자에 대한 가산점은 평등한가?","focus":"기회 형식의 평등과 실질적 평등.","viewA":"과거·구조적 불리함을 일부 보정한다.","viewB":"다른 지원자에게 역차별 논란을 낳는다.","followup":"가산점 크기와 적용 기간의 적정 기준은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["가산점 제도는 동일한 점수를 기계적으로 비교할 것인지, 불평등한 출발선을 실질적으로 보정할 것인지의 문제다.","목적이 과거의 불이익 시정인지 사회적 대표성 확대인지 먼저 명확히 해야 한다.","가산점 비율이 작아도 경합이 치열한 영역에서는 합격·탈락에 결정적 영향을 줄 수 있다.","일률적 점수 가산 외에 교육기회 확대·별도 모집·지원서비스 같은 덜 침해적인 수단도 있다.","정당화에는 대상 집단의 불리함, 수단의 관련성, 다른 집단의 불이익, 종료 기준이 모두 중요하다."],"followupAnswer":"목적에 필요한 최소 범위에서 조정해야 한다. 실제 불리함의 정도를 자료로 확인하고 효과를 정기 재평가하며 영구적 특혜가 되지 않도록 기간·한도를 둬야 한다."},{"id":18,"title":"롤스의 자유주의: 정의원칙","page":186,"vol":1,"chapter":"법의 철학적 기초","question":"불평등을 언제 정당화할 수 있을까?","focus":"동등한 기본적 자유와 차등원칙의 관계.","viewA":"약자 개선에 기여하는 불평등은 허용 여지가 있다.","viewB":"유인과 성장 효과를 객관적으로 측정하기 어렵다.","followup":"최상위 계층이 더 부유해져도 최하위 계층이 나아지면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["롤스의 정의원칙은 동등한 기본적 자유와 기회균등, 최소수혜자의 처지 개선을 함께 보는 틀이다.","누군가가 더 많이 갖는다는 사실만으로 불평등을 부정하거나 정당화하는 것은 부족하다.","차등원칙의 관건은 불평등이 실제로 가장 불리한 사람의 전망을 나아지게 하는지다.","경제 성장의 총량이 늘었더라도 취약층의 실질적 기회·소득·권리가 악화되면 평가가 달라진다.","효과를 입증하는 자료와 다른 분배 방식의 가능성을 비교해야 한다."],"followupAnswer":"최하위 계층이 실제로 개선되고 기본적 자유·공정한 기회가 침해되지 않는다면 차등원칙상 허용 여지가 있다. 다만 더 평등하면서 취약층에 유리한 대안이 없는지도 검토해야 한다."},{"id":19,"title":"롤스의 자유주의: 저축원칙","page":191,"vol":1,"chapter":"법의 철학적 기초","question":"현재 세대가 미래 세대를 위해 얼마나 저축해야 할까?","focus":"세대 간 정의·저축 원칙·현재의 희생.","viewA":"장기적 제도·환경 자산의 유지가 필요하다.","viewB":"현재의 빈곤층에 과도한 부담이 갈 수 있다.","followup":"미래 세대가 지금보다 훨씬 부유할 것으로 예상되면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["세대 간 저축원칙은 지금 소비할 자원을 미래 사회의 제도·환경·기반시설을 위해 얼마나 남길지 묻는다.","현재 세대의 희생만을 강조하면 지금의 취약계층에 부당한 부담을 지울 수 있다.","미래 세대는 자원 축적의 혜택을 받지만 기후위험·국가부채 같은 비용도 물려받을 수 있다.","따라서 단순한 금전 저축뿐 아니라 인적 자본, 환경 보전, 민주적 제도의 유지가 함께 중요하다.","세대 간 부담은 각 세대의 역량과 수혜, 위험의 돌이킬 수 없는 정도를 기준으로 조절해야 한다."],"followupAnswer":"미래 세대가 더 부유할 것으로 예상된다면 현재의 저소득층에게 요구할 저축 수준을 낮출 근거가 생긴다. 그래도 돌이킬 수 없는 환경파괴나 제도 붕괴를 막을 최소한의 의무는 남는다."},{"id":20,"title":"샌델의 공동체주의: 가족폭력 규제","page":198,"vol":1,"chapter":"법의 철학적 기초","question":"가족 내 폭력에 국가가 어디까지 개입해야 할까?","focus":"사적 영역의 자율과 약자 보호.","viewA":"권력 불균형과 반복 피해를 차단해야 한다.","viewB":"과잉 개입은 가족의 사생활을 침해할 수 있다.","followup":"피해자가 개입을 명시적으로 거부하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["가족 내 폭력은 겉으로는 사적인 관계이지만 피해자의 안전과 자유에 직접 영향을 미친다.","가해자와 피해자 사이 경제적·심리적 의존관계가 있으면 외부 신고와 자발적 이탈이 어렵다.","사생활 존중은 국가 개입을 막는 절대적 장벽이 아니라 침해의 정도를 판단하는 중요한 고려 요소다.","개입 수준은 위험의 구체성에 맞춰 상담·분리보호·접근금지·형사적 절차 등으로 달리 정할 수 있다.","피해자 의사를 존중하면서도 보복위험과 반복피해 가능성을 독립적으로 확인하는 절차가 필요하다."],"followupAnswer":"거부 의사만으로 항상 개입을 중단해서는 안 된다. 의사가 자유롭게 형성됐는지와 급박한 위해가 있는지 확인하고, 위험이 높을 때는 최소한의 보호 조치를 검토해야 한다."},{"id":21,"title":"샌델의 공동체주의: 과거사 문제","page":204,"vol":1,"chapter":"법의 철학적 기초","question":"현재 세대가 과거 국가의 잘못을 배상해야 할까?","focus":"역사적 책임·연속성·사회적 연대.","viewA":"현재까지 이어지는 피해를 회복할 책임이 있다.","viewB":"직접 가담하지 않은 개인에게 비용을 지우는 문제.","followup":"가해·피해 집단의 구분이 섞여 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["과거사 청산은 개인의 직접 가해 책임과 국가·기관의 지속적 법적 책임을 구별하는 것에서 시작한다.","현재의 시민이 과거 잘못을 직접 저지르지 않았더라도 국가가 피해를 인정하고 기록을 공개할 이유가 있다.","보상은 단순 금전 지급뿐 아니라 진실규명·명예회복·제도 개선·재발 방지를 포함한다.","시간이 흐르며 증거가 부족해지므로 증명 부담과 피해 인정 기준을 공정하게 설계해야 한다.","책임과 비용을 분배할 때 피해의 현존 여부와 국가기관의 연속성을 중심으로 논증하면 좋다."],"followupAnswer":"가해자 후손과 피해자 후손이 뒤섞여 있어도 국가·제도의 책임은 별도로 검토할 수 있다. 개인에게 혈통만으로 죄책을 지우지 않고 피해 확인과 공적 회복에 초점을 맞춰야 한다."},{"id":22,"title":"철학적 딜레마: 능력주의","page":210,"vol":1,"chapter":"법의 철학적 기초","question":"능력대로 보상받는 사회가 정의로운가?","focus":"노력·능력·환경적 우연을 구별한다.","viewA":"성과 보상은 동기를 높이고 효율을 만든다.","viewB":"능력 형성에는 가정·행운 등 통제 불가능한 요소가 있다.","followup":"기회의 불평등을 상당 부분 해소했다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["능력주의는 개인의 성과를 보상하는 유인체계로 이해할 수 있지만 능력 형성의 조건까지 개인이 선택한 것은 아니다.","가정·교육·건강·사회적 인맥은 노력의 결과와 얽혀 있어 순수한 개인 공로만 분리하기 어렵다.","그렇다고 성과 차이를 모두 부정하면 전문성 축적과 사회적 분업의 동기를 저하시킬 수 있다.","정책 설계에서는 출발선 보정과 성과 보상을 조합하고 최소한의 존엄을 보장할 수 있다.","면접에서는 성과 보상 자체와 실패한 사람을 도덕적으로 열등하게 취급하는 태도를 구분한다."],"followupAnswer":"실질적 기회균등이 상당히 보장됐다면 능력에 따른 보상의 정당성은 커진다. 다만 능력 자체의 우연성과 공동체가 제공한 기반을 고려해 최소한의 사회적 안전망은 유지해야 한다."},{"id":23,"title":"철학적 딜레마: 선거제도","page":214,"vol":1,"chapter":"법의 철학적 기초","question":"선거제도를 설계할 때 대표성과 안정성 중 무엇이 우선인가?","focus":"비례성·책임정치·소수 의견 반영.","viewA":"다양한 목소리의 대표성을 보장한다.","viewB":"분열·책임 소재 불명확으로 정책 결정이 지연될 수 있다.","followup":"정당 수가 지나치게 늘어나면 제도를 바꿔야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["선거제도는 유권자 선호를 의석으로 바꾸는 규칙이므로 수학적 계산 방식 자체가 대표성에 영향을 미친다.","비례성은 소수 의견의 사표를 줄일 수 있지만 연립정부 구성과 책임 소재를 복잡하게 할 수 있다.","다수대표 방식은 지역 대표성과 정부 구성을 단순하게 하지만 득표율과 의석률이 크게 달라질 수 있다.","어느 제도도 완전하지 않아 정당 체계와 지역 갈등, 정책 결정의 안정성을 함께 보아야 한다.","개혁을 논할 때 ‘누가 이익을 보느냐’뿐 아니라 유권자가 결과를 이해하고 책임을 물을 수 있는지도 중요하다."],"followupAnswer":"정당 수 증가로 정책결정이 지속적으로 마비된다면 봉쇄조항이나 연립 절차를 검토할 수 있다. 다만 소수 의견을 과도하게 배제하지 않도록 기준을 정해야 한다."},{"id":24,"title":"자연법과 실정법","page":221,"vol":1,"chapter":"법의 철학적 기초","question":"실정법이 인간의 기본적 정의관에 정면으로 반하면 따라야 할까?","focus":"자연법적 정당성과 실정법의 효력.","viewA":"공통 정의·인권 기준을 법 평가에 반영한다.","viewB":"개인의 도덕관이 법질서를 불안정하게 만들 수 있다.","followup":"누가 자연법의 내용을 확정할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["자연법론은 실정법을 평가할 상위의 도덕적 기준을 강조하고, 실정법론은 법질서 안의 효력 기준을 중시한다.","‘법으로 존재한다’는 명제와 ‘도덕적으로 따라야 한다’는 명제는 서로 다를 수 있다.","법이 심각하게 부당할 때 법적 불복종의 정당성이 문제되지만 개인의 도덕관을 무제한 법 위에 둘 수도 없다.","기본권·헌법·국제적 인권 원칙은 주관적 양심을 넘어서 논증을 공개적으로 검토할 공통 언어가 된다.","구체적 사안에서는 적법한 구제 절차와 위법 명령에 대한 거부 범위를 나누어 답변한다."],"followupAnswer":"자연법의 내용을 한 개인이 독점적으로 확정할 수는 없다. 인간 존엄·평등 등 공적 원칙을 토대로 토론하고 법적 심사·입법 과정을 거쳐 구체화해야 한다."},{"id":25,"title":"도덕과 법: 인치와 법치","page":229,"vol":1,"chapter":"법의 철학적 기초","question":"유능한 통치자의 판단과 공개된 법 규칙 중 무엇이 우선인가?","focus":"인치와 법치·자의성 통제.","viewA":"전문가의 신속한 재량이 문제 해결에 유리할 수 있다.","viewB":"개인에게 의존하면 예측가능성과 통제가 약하다.","followup":"긴급 상황에서 규칙의 예외는 허용해야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법치는 규칙이 공개되고 일관되게 적용되며 국가의 결정을 심사할 수 있다는 의미를 포함한다.","인치는 유능하고 선의인 통치자의 빠른 해결을 기대하지만 그 사람의 교체·오판에 취약하다.","예측 가능한 규칙이 있으면 시민은 장기 계획을 세우고 국가행위에 이의를 제기할 수 있다.","법치도 예외·재량을 완전히 금지하지 않으며 그 범위와 사후 통제 기준을 정한다.","긴급 권한을 준다면 기간 제한, 이유 제시, 독립적 심사와 책임을 결합해야 한다."],"followupAnswer":"긴급상황에는 탄력적 재량을 인정할 여지가 있다. 다만 근거 법률, 필요 최소한의 조치, 기간 제한, 사후 심사와 손해구제까지 보장해야 법치의 예외가 법치의 파괴로 변하지 않는다."},{"id":26,"title":"법치주의: 명확성의 원칙","page":237,"vol":1,"chapter":"법의 철학적 기초","question":"국민이 이해하기 어려운 모호한 법으로 처벌할 수 있을까?","focus":"명확성 원칙·예측 가능성·일반조항의 한계.","viewA":"유연한 문구가 새 유형의 위법행위를 포괄한다.","viewB":"불명확하면 자의적 집행과 위축 효과가 생긴다.","followup":"너무 구체적인 법이 새로운 기술을 못 따라간다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["명확성 원칙은 규범을 읽는 사람이 금지되거나 요구되는 행동을 대체로 예측할 수 있어야 한다는 요청이다.","형벌이나 권리 제한이 강할수록 법문이 지나치게 포괄적이면 자의적 집행 위험이 커진다.","새 기술을 빠르게 규율하려면 추상적 개념이 필요할 수 있으므로 모든 불확정 개념이 부당한 것은 아니다.","용어의 통상적 뜻, 법체계, 판례·해석 기준을 통해 예측 가능성을 확보할 수 있는지 따진다.","면접에서는 표현의 포괄성과 기본권 침해 강도, 사전 안내·심사장치의 유무를 함께 비교한다."],"followupAnswer":"신기술을 규율하기 어렵다면 법의 목적과 금지의 핵심 요소를 명확히 제시하고 세부 기준은 공개된 하위 규범으로 보완할 수 있다. 넓은 재량에는 통제 절차가 따라야 한다."},{"id":27,"title":"정의와 법적 안정성: 불고지죄","page":246,"vol":1,"chapter":"법의 철학적 기초","question":"불의한 과거 행위를 나중에 만든 법으로 처벌할 수 있을까?","focus":"실체적 정의와 법적 안정성·소급금지.","viewA":"중대한 인권침해에 대한 책임을 물어야 한다.","viewB":"예측 불가능한 소급처벌은 법치를 흔든다.","followup":"당시 법이 본질적으로 부당했다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["소급처벌은 행위 당시의 법적 예측 가능성을 사후에 뒤집는 것이어서 법적 안정성에 큰 손상을 준다.","한편 역사적 중대범죄는 형식적 법질서를 이용해 책임을 회피했을 수 있다는 정의 문제가 있다.","당시 이미 존재하던 법규범의 위반인지, 새로운 범죄를 나중에 만드는 것인지 구별해야 한다.","처벌 외에 진실규명·명예회복·배상·공적 기록 같은 대안적 책임 추궁이 가능하다.","원칙을 지키면서 피해 회복을 최대화하는 절차를 찾는 것이 설득력 있는 접근이다."],"followupAnswer":"당시 법 자체가 극단적으로 부당했어도 사후 형벌 창설은 신중해야 한다. 그 시대에도 적용되던 규범과 국제적 인권 원칙을 검토하고, 형벌이 어려운 부분은 회복적 수단으로 보완해야 한다."},{"id":28,"title":"상관의 부당한 명령에 대한 거부","page":253,"vol":1,"chapter":"법의 철학적 기초","question":"상관의 불법적 명령을 받은 사람은 어디까지 거부해야 할까?","focus":"명령 복종의무·위법성 인식·개인 책임.","viewA":"명령체계가 흔들리면 조직의 기능이 약화된다.","viewB":"명백한 위법명령에의 복종은 책임 면제의 근거가 되기 어렵다.","followup":"위법성이 분명하지 않은 긴급 상황이면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["명령체계가 필요한 조직에서도 개인은 모든 명령의 정당성을 무조건 상관에게 전가할 수 없다.","명백한 위법명령과 법률적 평가가 어려운 지시를 구별하는 것이 책임 판단의 첫 단계다.","시간적 여유가 있다면 지시의 근거 확인, 이의 제기, 상급자 보고 등 제도적 절차가 가능하다.","긴급한 상황에서는 의무 이행의 필요성과 명령으로 발생할 중대한 인권침해를 함께 고려한다.","‘명령을 받았다’는 사실은 상황 설명이 될 수 있지만 중대한 위법행위의 면책을 자동으로 만들지 않는다."],"followupAnswer":"위법성이 분명하지 않다면 가능한 범위에서 사실과 법적 근거를 확인하고 기록해야 한다. 그러나 민간인 살상처럼 명백히 위법한 결과가 예상된다면 긴급성을 이유로 무조건 복종할 수는 없다."},{"id":29,"title":"통치행위: 긴급조치 제9호","page":260,"vol":1,"chapter":"법의 철학적 기초","question":"긴급상황이라는 이유로 행정부의 결정을 사법심사에서 제외할 수 있을까?","focus":"통치행위와 기본권 구제·사법심사.","viewA":"정치적 결단의 성격을 일정 부분 존중한다.","viewB":"권력남용을 심사 불가능하게 만들 위험이 있다.","followup":"전시 긴급조치도 사후 심사를 받아야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["통치행위 개념은 정치적 판단 요소가 큰 국가행위를 사법부가 어느 정도 심사할 것인지에 관한 논쟁이다.","행정부의 전문성·신속성이 필요한 영역이라도 국민의 기본권이 침해되면 구제 수단이 필요하다.","어떤 행위가 정치적 성격을 가진다는 것과 법률상 아무 제한도 받지 않는다는 것은 다른 말이다.","특히 권한의 근거, 절차 준수, 과도한 침해 여부는 독립적 검증의 대상이 될 수 있다.","면접에서는 정치적 재량의 범위를 존중하되 사법심사를 전면적으로 포기하지 않는 구조를 제시한다."],"followupAnswer":"전시에도 사후 심사는 필요하다. 다만 당시 이용 가능한 정보와 긴급성은 판단 시 고려하고, 법적 근거와 기본권 침해의 정도는 독립적으로 심사해야 한다."},{"id":30,"title":"시민불복종","page":267,"vol":1,"chapter":"법의 철학적 기초","question":"법에 반하는 평화적 시위는 정당화될 수 있을까?","focus":"법질서 존중과 양심에 따른 시민불복종.","viewA":"불공정한 법을 공론화하는 수단이다.","viewB":"법의 일반적 준수 원칙이 약화될 수 있다.","followup":"폭력성이 없고 최후 수단이면 허용 범위가 달라질까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["시민불복종은 공개적·비폭력적으로 법에 저항하며 부당함을 사회에 알리는 행위로 논의된다.","단순한 사익 추구나 형사책임 회피와 달리 공공적 이유와 제도개혁 의지가 중요하다.","법의 안정성은 유지되어야 하지만 민주사회에서는 부당한 규칙을 교정하는 통로도 필요하다.","긴급성, 합법적 구제수단의 실효성, 저항 방식의 비례성에 따라 정당화 강도가 달라진다.","정당성 판단과 현행법상 처벌 가능성은 별개여서 면접에서 혼동하지 않도록 한다."],"followupAnswer":"폭력성이 없고 정당한 요구의 최후 수단이라면 도덕적 정당성이 강해질 수 있다. 그래도 모든 위법이 면책되는 것은 아니므로 피해와 위험을 최소화하는 방식을 선택해야 한다."},{"id":31,"title":"저항권","page":276,"vol":1,"chapter":"법의 철학적 기초","question":"국민은 언제 국가권력에 저항할 권리가 있는가?","focus":"헌정질서 수호·저항권의 요건.","viewA":"극단적 억압에 맞설 최후의 안전장치다.","viewB":"개인적 정치 불만을 저항권으로 포장할 위험이 있다.","followup":"평화적 제도개선 수단이 남아 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["저항권은 헌정질서를 파괴하는 권력에 맞서 시민이 마지막 수단으로 대응할 수 있는가의 문제다.","일상의 정책 불만과 기본권·민주질서의 근본적 붕괴를 명확히 구별해야 한다.","선거·재판·입법 등 정상적인 교정 수단이 작동하는지 확인하는 것이 중요하다.","폭력 사용이 언급될 때는 과잉 피해와 사회질서 붕괴의 위험을 훨씬 엄격히 심사한다.","권력의 정당성 상실을 판단하는 객관적 징표와 집단적 통제가 없으면 자의적 저항 위험이 있다."],"followupAnswer":"작동하는 평화적 교정 수단이 있다면 저항권의 최후 수단성은 충족되기 어렵다. 먼저 선거·사법 절차와 시민적 참여를 활용해야 한다."},{"id":32,"title":"권력의 속성과 통제","page":283,"vol":1,"chapter":"민주주의","question":"권력이 집중되면 반드시 남용되는가?","focus":"견제·분립·책임성·효율성.","viewA":"집중은 위기 대응과 결단을 빠르게 한다.","viewB":"견제 부재는 자의적 통치를 초래할 수 있다.","followup":"심각한 위기라면 권한을 일시적으로 집중해도 될까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["정치권력은 법을 집행할 수 있는 힘이지만 집행 수단을 독점하기 때문에 별도의 통제가 필요하다.","수평적 통제는 입법·행정·사법의 견제이고, 수직적 통제는 선거·언론·시민의 감시를 포함한다.","권력 집중은 일부 위기에서 속도를 높이지만 잘못된 결정의 교정 비용도 키운다.","실효적인 견제에는 정보 접근, 책임 추궁, 독립적 감사와 임기 제한이 중요하다.","제도 설계의 질문은 ‘누가 선한가’가 아니라 ‘권력이 남용되어도 바로잡을 수 있는가’이다."],"followupAnswer":"심각한 위기에는 한시적 권한 집중을 검토할 수 있다. 하지만 명확한 목적·기한·권한 범위와 독립적 사후통제가 있어야 하며 자동적인 권한 연장은 피해야 한다."},{"id":33,"title":"소극적 자유와 적극적 자유","page":289,"vol":1,"chapter":"민주주의","question":"자유는 간섭이 없는 상태인가, 행동할 역량이 있는 상태인가?","focus":"소극적 자유와 적극적 자유.","viewA":"간섭 최소화는 선택의 독립성을 지킨다.","viewB":"자원·역량이 없으면 형식적 자유가 공허할 수 있다.","followup":"자유 보장을 위해 다른 사람의 자유를 제한할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["소극적 자유는 타인의 간섭이 없는 상태에, 적극적 자유는 자신의 삶을 주도할 실질 역량에 초점을 둔다.","형식적으로 교육을 선택할 자유가 있어도 비용과 정보가 없으면 선택의 실질이 제한될 수 있다.","적극적 자유를 넓히는 공적 개입이 다른 개인의 재산권·선택권에 비용을 부과할 수도 있다.","따라서 어느 자유를 말하는지 먼저 특정하고 제한을 정당화할 독립적 이유를 제시해야 한다.","현금 지원, 접근성 개선, 규제 완화 중 어떤 수단이 가장 덜 침해적인지 비교할 수 있다."],"followupAnswer":"가능하지만 무제한은 아니다. 다른 사람에게 중대한 권리 침해를 주지 않는 범위에서 실질적 선택의 기회를 넓히고, 제한 수단이 최소 침해인지 따져야 한다."},{"id":34,"title":"유교민주주의: 온정적 후견주의","page":295,"vol":1,"chapter":"민주주의","question":"국가가 시민의 이익을 위해 시민의 선택을 대신할 수 있을까?","focus":"온정적 후견주의·자율과 보호.","viewA":"정보 부족과 비합리적 선택의 위험을 줄인다.","viewB":"국가가 좋은 삶을 강요할 수 있다.","followup":"위험을 충분히 고지받은 성인도 보호 대상인가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["온정적 후견주의는 개인의 이익을 이유로 본인의 선택을 대신 제한하거나 유도하는 국가 개입이다.","판단능력이 부족한 아동과 충분한 정보를 가진 성인을 동일하게 대우할 필요는 없다.","안전벨트 의무처럼 위험 예방 효과가 큰 정책도 자유의 침해 정도와 구체적 위험을 비교해야 한다.","금지·제재 외에 정보 제공, 기본값 설계, 위험 알림 등 선택을 보존하는 방법이 있다.","무엇이 좋은 삶인지 국가가 독점할 수 없다는 점을 기억해야 논증의 균형이 생긴다."],"followupAnswer":"위험을 충분히 이해하고 타인에게 피해를 주지 않는 성인이라면 제한 정당성이 약해진다. 대신 정확한 정보 제공과 안전한 선택 환경 조성이 우선될 수 있다."},{"id":35,"title":"대의제 민주주의와 직접 민주주의","page":301,"vol":1,"chapter":"민주주의","question":"중요 정책은 국민투표로 직접 결정해야 할까?","focus":"대표성·숙의·전문성·책임소재.","viewA":"직접 참여는 민주적 정당성을 높인다.","viewB":"복잡한 정책을 단순 찬반으로 환원할 수 있다.","followup":"참여율이 낮은 국민투표의 결정은 충분히 정당한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["대의제는 선출된 대표가 정책을 심의하고 책임지는 방식이고 직접민주제는 시민이 결정을 직접 내리는 방식이다.","국민투표는 특정 정책의 정당성을 높일 수 있지만 복잡한 문제를 단순한 양자택일로 만들 수 있다.","대표제에서는 전문성과 지속적 감시가 가능하지만 유권자 의사와 정치권의 거리가 벌어질 수 있다.","정책 사안별로 충분한 정보 제공, 숙의의 기회, 사후 책임성을 결합하는 방식이 가능하다.","‘중요하다’는 이유만으로 모든 정책을 투표에 부치기보다 적합한 의사결정 구조를 설계해야 한다."],"followupAnswer":"참여율이 낮으면 결정의 대표성에 대한 문제가 커진다. 사전에 합의된 정족수와 절차를 적용하되 참여를 높이는 정보·접근성 보완책을 마련해야 한다."},{"id":36,"title":"대의제: 지식인의 정치 참여","page":312,"vol":1,"chapter":"민주주의","question":"정치에 전문지식을 가진 사람의 영향력을 확대해야 할까?","focus":"전문성 정치와 보통선거·평등.","viewA":"복잡한 정책에 전문적 판단이 유리하다.","viewB":"전문가의 가치판단이 보통시민의 선호를 대체할 수 없다.","followup":"전문가가 서로 의견이 갈리면 누가 정할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["정책 전문성은 복잡한 기술·경제적 사실 판단에 필요하지만 정책의 목적 자체를 정하는 권한과는 구별된다.","전문가는 위험이나 비용을 추정할 수 있으나 그 비용을 누가 부담해야 할지는 민주적 가치판단의 영역이다.","전문지식이 권력으로 고착되면 시민의 평등한 정치참여와 책임정치가 약화된다.","전문 자문기구의 투명성, 이해충돌 공개, 이견 보고를 통해 정치와 전문가 판단을 연결할 수 있다.","좋은 답변은 ‘전문가에게 사실 판단을 맡기되 최종 가치판단의 책임은 대표기관이 진다’는 역할 분담을 설명한다."],"followupAnswer":"전문가 의견이 갈린다면 증거 수준·불확실성을 공개하고 독립적으로 검토해야 한다. 최종 결정은 위험을 감수하는 시민과 민주적 대표기관의 책임 아래 이루어져야 한다."},{"id":37,"title":"국민 참여 확대: 포퓰리즘","page":319,"vol":1,"chapter":"민주주의","question":"시민 요구를 즉시 정책으로 반영하는 것이 민주주의인가?","focus":"포퓰리즘과 민의 반영의 경계.","viewA":"소외된 시민 요구가 정치에 반영된다.","viewB":"장기 비용·소수권리가 선동에 의해 침해될 수 있다.","followup":"대중의 요구가 옳지만 재정 여력이 부족하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["포퓰리즘 논쟁에서는 대중의 정당한 불만을 반영하는 것과 단기적 지지를 위해 비용을 은폐하는 것을 구별한다.","인기 있는 정책도 장기 재정과 소수자의 기본권을 고려하면 합리적일 수 있고, 반대로 인기 없는 정책도 부당할 수 있다.","공약의 편익이 당장 특정 집단에 집중되고 비용이 미래 세대로 이전되는지 살핀다.","재정 추계, 성과 평가, 반대 집단의 의견 듣기는 선동과 숙의를 구별하는 도구다.","‘대중이 원한다’는 단독 근거 대신 목적·비용·공정한 부담배분을 함께 제시한다."],"followupAnswer":"요구가 정당해도 재정이 부족하면 우선순위·단계적 시행·재원 조달을 논의해야 한다. 정의로운 목표가 곧 무제한의 지출을 뜻하지는 않는다."},{"id":38,"title":"국민 참여 확대: 공론화위원회","page":330,"vol":1,"chapter":"민주주의","question":"무작위 추출 시민이 숙의한 의견을 정책에 반영해야 할까?","focus":"공론화위원회 대표성·숙의의 질.","viewA":"정보를 학습한 시민의 판단을 반영한다.","viewB":"참여자의 대표성·의제 설계에 편향이 개입할 수 있다.","followup":"공론조사 결과가 여론조사와 정반대면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["공론화위원회는 무작위에 가까운 시민 구성과 정보 제공·토론을 결합해 숙의된 의견을 확인하려는 제도다.","표본이 실제 인구 구성을 반영하는지, 의제와 전문가 자료가 한쪽에 치우치지 않았는지가 중요하다.","숙의 후 판단이 바뀐다고 해서 기존 여론을 무지한 것으로 단정할 수는 없다.","결정 권한을 위원회에 위임할지 참고 의견으로 사용할지도 미리 정해야 한다.","결과뿐 아니라 모집 방식·자료·토론 절차를 공개해야 민주적 정당성을 높일 수 있다."],"followupAnswer":"결과가 다르다면 두 조사에서 제공한 정보와 숙의의 차이를 설명해야 한다. 공론 결과를 유력한 참고자료로 보되 직접 선출된 기관의 최종 책임까지 없애지는 않는다."},{"id":39,"title":"독재, 다수결, 만장일치","page":337,"vol":1,"chapter":"민주주의","question":"만장일치가 항상 다수결보다 더 정당한가?","focus":"의사결정 정당성·의사결정 비용.","viewA":"만장일치는 소수자의 거부권을 보호한다.","viewB":"한 사람의 거부로 모든 결정을 막을 수 있다.","followup":"국민 기본권에 관한 결정은 다른 기준이 필요할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["다수결은 결정을 신속하게 만들지만 소수자에게 불리한 결과가 반복될 수 있다.","만장일치는 폭넓은 동의를 확보할 수 있으나 이해관계자 한 명이 결정을 무기한 막는 문제가 있다.","결정의 사안과 권리 침해 정도에 따라 일반과반·가중다수·만장일치 요건을 달리 설계할 수 있다.","의사결정 규칙은 결과의 유불리만이 아니라 사전에 공정하게 합의된 절차인지가 중요하다.","면접에서는 민주주의의 가치가 투표 숫자 하나로 환원되지 않는다는 점을 강조한다."],"followupAnswer":"기본권 침해 가능성이 큰 결정은 일반 정책보다 엄격한 절차와 헌법적 통제가 필요할 수 있다. 그렇다고 모든 사항에 만장일치를 요구하면 민주적 결정이 불가능해질 수 있다."},{"id":40,"title":"다수결의 전제와 한계","page":342,"vol":1,"chapter":"민주주의","question":"과반수의 찬성은 어떤 결정을 정당화할 수 있나?","focus":"다수결의 전제·소수자 기본권·숙의.","viewA":"의사결정을 가능하게 하는 실용적 규칙이다.","viewB":"다수의 횡포를 막는 헌법적 한계가 필요하다.","followup":"99%가 찬성한 차별 정책을 허용할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["다수결이 정당하게 작동하려면 평등한 참여와 표현의 자유, 공개된 정보, 반대 의견의 보호가 필요하다.","다수결은 가치의 우열이 아니라 공동체가 결정을 내리는 절차라는 점을 먼저 확인한다.","다수의 결정도 소수자의 기본적 권리를 침해하거나 향후 다수 형성 가능성을 봉쇄하면 문제가 된다.","헌법적 권리 보장과 독립적 재판은 다수결의 한계를 보완하는 장치다.","결론을 말할 때 ‘다수가 선택했으므로 옳다’가 아니라 제한할 수 없는 권리의 범위를 제시한다."],"followupAnswer":"아니다. 99%의 찬성도 차별의 내용과 기본권 침해를 정당화하지 못한다. 소수자의 동등한 법적 지위를 보장하는 것은 다수결에 앞서는 민주주의의 조건이다."},{"id":41,"title":"선거제와 추첨제","page":347,"vol":1,"chapter":"민주주의","question":"정치 대표자를 투표가 아닌 추첨으로 선발할 수 있을까?","focus":"대표성·평등·능력·책임정치.","viewA":"추첨은 금권·조직 동원 편향을 줄일 수 있다.","viewB":"전문성·책임·유권자의 선택권이 약해진다.","followup":"일부 시민위원만 추첨으로 구성하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["추첨제는 재력·인맥 없이 시민 누구나 대표로 선발될 가능성이 있다는 장점을 갖는다.","선거는 유권자가 대표를 평가·교체할 수 있지만 선거비용과 정당 조직의 편향을 피하기 어렵다.","추첨된 사람에게 복잡한 의제를 맡길 경우 교육·전문가 자문·충분한 숙의시간이 필요하다.","책임정치는 선발 방식뿐 아니라 회의 공개·이해충돌 통제·임기 중 평가로 보완할 수 있다.","제도 전면 대체보다 숙의 시민의회나 자문위원 일부 추첨이 현실적인 시험 방안이 될 수 있다."],"followupAnswer":"일부 시민위원 추첨은 참여 다양성을 높이는 타협이 될 수 있다. 단 대표기관의 책임과 권한을 침해하지 않도록 추첨위원의 역할과 의사결정 범위를 정해야 한다."},{"id":42,"title":"선거권 연령 하향","page":354,"vol":1,"chapter":"민주주의","question":"선거권 연령을 더 낮춰야 할까?","focus":"이해관계·판단능력·일률적 연령 기준.","viewA":"정책 영향을 받는 청소년의 목소리를 반영한다.","viewB":"충분한 정보와 독립적 판단이 어렵다는 우려.","followup":"납세·교육 수준에 따라 연령을 달리해야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["선거권은 정책결정에 영향을 받는 시민이 정치적 의사형성에 참여할 기회라는 성격을 가진다.","일률적 나이 기준은 행정상 명확하지만 개인별 성숙도 차이를 완전히 반영하지 못한다.","청소년의 정치적 이해관계와 판단능력을 어떻게 인정할지 교육·정보 접근성을 함께 고려해야 한다.","반대 근거로 지목되는 정치적 영향이나 정보 부족은 성인 유권자에게도 정도의 차이로 나타난다.","선거권 확대의 효과와 함께 정치교육, 선거정보의 공정한 제공을 설계할 수 있다."],"followupAnswer":"납세·학력별로 정치적 권리를 차등화하면 평등선거의 취지에 반할 수 있다. 연령 기준을 조정하더라도 일반적·명확한 기준과 충분한 정치교육을 결합하는 편이 낫다."},{"id":43,"title":"대통령 4년 중임제 개헌","page":360,"vol":1,"chapter":"민주주의","question":"대통령의 연임을 허용하는 개헌이 바람직할까?","focus":"책임정치·정책 연속성·권력 집중.","viewA":"성과를 평가해 재신임할 수 있다.","viewB":"재선 유인이 선심 정책·권력 남용을 부를 수 있다.","followup":"연임 허용과 함께 어떤 견제가 필요할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["대통령 4년 중임제 논쟁은 국민의 재평가 기회와 장기 집권의 위험을 함께 본다.","중임 허용은 책임정치를 강화할 수 있지만 재선을 위한 단기 정책과 권력 집중을 촉진할 우려도 있다.","단임제의 장점은 장기집권 방지이고 단점은 장기 정책의 책임 연계가 약해질 수 있다는 점이다.","선거 시점, 임기 수, 의회 선거와의 관계, 권한 분산을 같이 설계해야 제도 효과를 판단할 수 있다.","개헌의 평가 기준은 단순한 임기 길이가 아니라 책임성·안정성·권력 남용의 통제다."],"followupAnswer":"대통령 권한이 강한 상태라면 임기 조정보다 국회·사법의 견제 강화가 선행되어야 할 수 있다. 재선의 혜택과 집중 위험을 함께 줄이는 장치가 필요하다."},{"id":44,"title":"입법부: 면책특권","page":364,"vol":1,"chapter":"민주주의","question":"국회의원의 발언 면책은 어느 범위까지 인정해야 할까?","focus":"의회 자율·표현 자유와 책임.","viewA":"권력을 감시하는 자유로운 토론을 보장한다.","viewB":"허위 주장이나 인격권 침해에 대한 구제가 부족할 수 있다.","followup":"의회 밖 SNS에 같은 말을 반복했다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["국회의원 면책특권은 의정활동 중 발언과 표결에 대한 외부 압력을 줄여 대표 기능을 보호하려는 장치다.","부당한 비판 발언도 어느 범위까지 보호해야 하는지와 명백한 사적 행위를 면책할 수 있는지는 구분한다.","표현의 자유 보장과 피해자의 명예·권리 구제는 충돌할 수 있다.","의회 내부의 윤리절차·공개적 해명·징계 같은 대체 책임 수단을 검토할 수 있다.","특권을 폐지할지보다 직무 관련성·보호 범위·대체 통제를 정교하게 논의하는 편이 설득력 있다."],"followupAnswer":"의회 내 발언을 밖에서 SNS로 그대로 반복한 행위는 별도의 표현행위이므로 국회의원 면책특권이 자동으로 확장된다고 보기 어렵다. 발언의 공적 가치와 별개로 명예훼손 등 책임은 일반 원칙에 따라 검토하되, 위축효과도 고려해야 한다."},{"id":45,"title":"입법부: 위헌정당 해산","page":370,"vol":1,"chapter":"민주주의","question":"반헌법적 정당을 해산할 수 있어야 할까?","focus":"민주주의 자기방어와 정치적 다양성.","viewA":"헌정질서를 파괴하려는 활동을 방지한다.","viewB":"다수 권력이 반대 정치세력을 억압하는 수단이 될 수 있다.","followup":"단순 급진적 주장과 실질적 위협을 어떻게 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["위헌정당 해산은 헌법 질서를 파괴하려는 정치세력을 제한하는 극단적 민주주의 방어수단이다.","정당은 민주적 의사 형성의 주체이므로 해산은 결사의 자유와 유권자의 선택권을 크게 제한한다.","단순히 급진적·비인기 정책을 주장한다는 이유로 위헌성을 인정해서는 안 된다.","실질적 위험, 조직의 목적·행동, 덜 침해적인 대응 수단의 가능성을 엄격히 검토해야 한다.","정당 해산의 대상·절차·효과와 개별 정치인의 권리 제한을 별도로 판단할 수 있다."],"followupAnswer":"정당의 의견이 불편하거나 반대된다는 이유만으로 해산을 정당화할 수는 없다. 민주질서에 대한 구체적 위험과 긴급성이 확인될 때 최후의 수단으로만 검토해야 한다."},{"id":46,"title":"행정부: 행정입법","page":375,"vol":1,"chapter":"민주주의","question":"행정부가 세부적인 법 규칙을 만들도록 맡겨도 될까?","focus":"위임입법·전문성·법률유보.","viewA":"빠른 정책 수정과 전문적 규율이 가능하다.","viewB":"선출되지 않은 행정기관의 재량이 커질 수 있다.","followup":"국회가 위임 범위를 매우 넓게 정하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["행정입법은 국회가 정한 법률을 실제 집행할 세부 기준으로 구체화하는 기능이 있다.","전문적·기술적 사안은 유연한 규율이 필요하지만 법률상 근거 없이 본질적 권리를 제한하면 문제가 된다.","국회가 결정해야 하는 핵심 사항과 행정부가 정할 세부 사항의 경계를 묻는 것이 중요하다.","하위 규범에 대한 공고·의견수렴·심사와 사후 통제가 있어야 절차적 정당성이 높아진다.","문제 풀이에서 법률의 목적·위임 범위와 규칙이 실제로 부과하는 의무를 대조하면 된다."],"followupAnswer":"기술 변화가 빠르더라도 기본권 제한의 핵심은 법률에서 정해야 한다. 세부 기술기준은 행정입법에 위임하되 내용·절차에 대한 통제를 두는 방식이 가능하다."},{"id":47,"title":"행정부: 사면권","page":380,"vol":1,"chapter":"민주주의","question":"대통령의 사면권은 유지해야 할까?","focus":"권력분립·정의 회복·정치적 중립.","viewA":"경직된 처벌의 예외적 교정 가능성이 있다.","viewB":"정치적 거래·법의 평등을 훼손할 우려가 있다.","followup":"사면 대상과 이유 공개를 의무화하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사면권은 확정된 형사제재의 효과를 예외적으로 조정하는 권한이어서 법원 판단과 충돌할 수 있다.","사회적 화해나 특별한 인도적 사정은 사면을 검토할 이유가 되지만 정치적 거래는 신뢰를 해친다.","수형자의 개선·피해 회복 정도와 사면의 공익을 개별적으로 검토할 필요가 있다.","권한의 존재만으로 남용이 정당화되지는 않으며 공개적 이유 제시와 견제 절차가 중요하다.","면접에서는 권력분립의 긴장과 사법 확정판결의 안정성을 함께 언급한다."],"followupAnswer":"사면은 제한적이고 예외적으로 행사해야 한다. 특히 정치적 이해관계가 관련된 경우에는 사유 공개·독립적 의견 청취·사후 정치적 책임을 강화할 필요가 있다."},{"id":48,"title":"사법부: 배심제","page":385,"vol":1,"chapter":"민주주의","question":"형사재판에 일반 시민을 참여시켜야 할까?","focus":"배심제·민주적 통제·법적 전문성.","viewA":"사법에 시민 상식을 반영할 수 있다.","viewB":"복잡한 증거와 법률 적용에서 오류 위험이 있다.","followup":"배심 평결과 판사의 판단이 충돌하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["배심제는 일반 시민의 상식과 민주적 참여를 재판 과정에 도입하는 제도다.","법률 전문가의 기술적 판단과 시민의 사실 평가 사이 역할 분담을 어떻게 할지가 쟁점이다.","시민참여는 사법 신뢰를 높일 수 있지만 복잡한 증거와 편견의 영향을 줄 장치가 필요하다.","무작위 배심원 선정, 충분한 설명, 제척·기피, 공개적 절차가 재판의 공정성에 기여할 수 있다.","판단의 구속력과 판사의 설명 의무를 어떻게 설계하는지에 따라 효과가 달라진다."],"followupAnswer":"배심원의 판단을 존중하되 명백한 절차 위반이나 법률적 오류를 바로잡을 통제가 필요하다. 실질적 참여가 되도록 이해 가능한 증거설명과 숙의 절차를 보장해야 한다."},{"id":49,"title":"헌법재판소: 탄핵","page":393,"vol":1,"chapter":"민주주의","question":"고위 공직자의 탄핵은 정치적 판단인가 법적 판단인가?","focus":"탄핵의 법적 요건과 민주적 책임.","viewA":"중대한 위헌·위법행위를 제재할 수 있다.","viewB":"정치적 갈등을 재판에 떠넘길 수 있다.","followup":"국정 운영 실패만으로 탄핵할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["탄핵은 고위 공직자의 중대한 위법행위에 대해 민주적·법적 책임을 묻는 헌법적 통제 방식이다.","정치적 무능이나 인기가 낮다는 이유만으로 법적 파면 요건이 충족되는 것은 아니다.","반대로 선거로 선출됐다는 사실이 임기 중 모든 위헌·위법행위를 면책하지는 않는다.","위반의 내용, 직무 관련성, 헌정질서에 미친 영향, 파면의 비례성을 구분해 평가한다.","탄핵을 정치적 책임론과 법적 파면 판단으로 나누면 답변이 명료해진다."],"followupAnswer":"탄핵 요건은 단순한 정치적 비난보다 엄격해야 한다. 그러나 국민이 직접 선출했다는 이유만으로 중대한 법 위반에 대한 파면 가능성을 봉쇄해서도 안 된다."},{"id":50,"title":"인권과 주권","page":400,"vol":1,"chapter":"민주주의","question":"국가 주권과 국제적 인권 보장 중 무엇이 우선인가?","focus":"국가의 자기결정권과 보편적 인권.","viewA":"주권 존중은 국제질서 안정에 기여한다.","viewB":"중대한 인권침해를 방치할 수 없다.","followup":"국제기구의 개입에 민주적 정당성이 부족하다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["인권은 사람으로서 갖는 기본적 권리를, 주권은 국가가 정치 공동체를 유지·통치할 권능을 뜻한다.","국가의 국경·입국·안보 결정은 중요한 권한이지만 개인의 생명·안전 문제와 별도로 평가할 수 없다.","외국인과 난민처럼 국민이 아닌 사람의 권리도 인간의 존엄이라는 관점에서 고려해야 한다.","국제적 협력과 국내 민주적 의사결정이 충돌할 때 책임과 절차를 공개적으로 따져야 한다.","‘주권이므로 무제한’도 ‘인권이므로 모든 통제 불가’도 아닌 구체적 비례성 평가가 필요하다."],"followupAnswer":"개입 기관의 민주적 대표성이 약하다면 일방적인 강제가 아니라 명확한 국제법적 권한, 투명한 절차, 당사국·주민의 참여, 독립적 사후 평가를 통해 정당성을 보완해야 한다. 기본권 보호 목적도 민주적 통제의 필요성을 없애지는 못한다."},{"id":51,"title":"전쟁과 테러","page":411,"vol":1,"chapter":"민주주의","question":"테러에 대응하기 위해 시민의 자유를 제한할 수 있을까?","focus":"국가안보·필요성·비례성·사후 통제.","viewA":"예방적 정보 수집이 대규모 피해를 막는다.","viewB":"비상권한이 일상적 감시로 굳어질 수 있다.","followup":"일시적 제한이라면 어떤 종료 요건이 필요할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["전쟁과 테러 논쟁에서는 무력 사용의 정당성, 민간인 보호, 국가의 안전보장의무를 구별한다.","무력 충돌에 대응할 때 합법적 목표라도 수단이 과도하면 별도의 비판 대상이 될 수 있다.","테러 위협의 위험성만으로 집단 전체에 대한 감시나 처벌을 정당화할 수는 없다.","예방 조치의 필요성, 실제 위협의 근거, 기본권 제한의 범위, 통제 가능성을 따진다.","강한 안보 조치와 시민적 자유가 충돌하면 위험에 대한 구체적 자료와 덜 침해적인 수단부터 확인해야 한다."],"followupAnswer":"테러 위험이 높아도 모든 시민을 무차별 감시하는 것은 신중해야 한다. 개별 위험을 특정하고 사법적 통제·기간 제한·정보 폐기 등을 갖추는 것이 필요하다."},{"id":52,"title":"인도적 무력개입","page":417,"vol":1,"chapter":"민주주의","question":"타국에서 대량학살이 발생하면 군사개입이 정당한가?","focus":"주권 존중·인도적 보호책임·개입의 실효성.","viewA":"심각한 인권침해를 중단시킬 수 있다.","viewB":"개입의 명분이 정치적 목적에 악용될 수 있다.","followup":"군사개입 외 대안이 존재한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["인도적 무력개입은 다른 국가의 심각한 인권침해를 막기 위한 외부 무력 사용을 뜻한다.","생명 보호의 긴급성은 강력한 근거이지만 개입 과정에서 새로운 민간인 피해와 장기 불안정이 발생할 수 있다.","다른 나라의 주권 존중과 보편적 인권 보호를 어떻게 조화시킬지가 핵심 충돌이다.","확인된 피해 규모, 외교·제재의 가능성, 개입 후 질서 회복 계획을 함께 검토해야 한다.","인도적 목적을 주장할수록 권한의 정당한 출처와 사후 책임, 개입 범위 제한을 더 엄격하게 요구할 수 있다."],"followupAnswer":"실효적인 외교·경제적 제재, 감시단, 인도적 통로 등 덜 폭력적인 대안이 남아 있다면 우선 검토해야 한다. 군사개입은 극단적 인명 피해가 임박하고 다른 수단으로 보호하기 어렵다는 근거가 있을 때만 최후 수단으로 논의할 수 있다."},{"id":53,"title":"불법체류 노동자의 인권","page":423,"vol":1,"chapter":"민주주의","question":"체류 자격이 없는 노동자에게도 노동권을 보장해야 할까?","focus":"인간의 기본권과 체류질서의 구분.","viewA":"취약한 노동자 착취와 산업재해를 막는다.","viewB":"체류 규범 집행의 실효성을 약화시킬 수 있다.","followup":"체류 위반 제재와 임금청구권은 분리할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["불법체류 노동자의 체류 지위와 노동 과정에서 누릴 기본적 인권은 동일한 문제가 아니다.","위법한 체류를 규율하는 국가의 이익과 임금·산업안전을 보호할 의무가 충돌할 수 있다.","노동권을 부정하면 착취와 신고 회피가 커져 오히려 위법 고용 구조가 굳어질 수 있다.","반대로 체류 관리의 실효성을 완전히 포기한 정책은 제도 준수 유인을 약화시킬 수 있다.","고용주에 대한 책임, 피해 신고를 통한 보호, 출입국 절차를 기능별로 나눠 접근한다."],"followupAnswer":"체류 규정 위반만으로 노동의 대가나 기본적인 안전 보장을 박탈해서는 안 된다. 피해 신고를 가능하게 하면서 체류 문제는 별도 적법 절차에서 다루는 방안이 설득력 있다."},{"id":54,"title":"난민 수용","page":427,"vol":1,"chapter":"민주주의","question":"국가는 난민을 어디까지 수용해야 할까?","focus":"인도주의·국가 역량·안전·사회통합.","viewA":"박해로부터 보호할 국제적 책임이 있다.","viewB":"심사·정착 역량이 부족하면 갈등이 커질 수 있다.","followup":"긴급보호와 영구 정착을 구분할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["난민 수용은 박해로부터 보호받아야 할 사람에 대한 의무와 수용국의 행정·사회적 역량을 함께 고려한다.","난민 인정은 단순한 경제적 이주와 구별해 위험과 요건을 심사하는 절차를 전제로 한다.","수용 규모뿐 아니라 초기 정착, 언어·교육·취업 지원, 지역사회 협력이 정책 성패에 영향을 준다.","안보 우려를 이유로 모든 신청자를 잠재적 위협으로 간주하는 것은 근거 없는 일반화일 수 있다.","반면 심사 역량과 지원 예산의 한계를 숨기면 주민과 난민 모두의 권리 보호가 어려워질 수 있다."],"followupAnswer":"구분할 수 있다. 즉각적인 생명·안전 위험에 대한 일시적 보호는 신속히 제공하되, 장기 체류나 영구 정착은 개별 심사와 사회통합 계획을 통해 결정할 수 있다. 다만 잠정 보호 중에도 박해 위험 지역으로의 강제송환을 피하는 원칙은 중요하다."},{"id":55,"title":"이민자 문호 확대","page":432,"vol":1,"chapter":"민주주의","question":"인구 감소에 대응해 이민 문호를 확대해야 할까?","focus":"노동력·다문화 통합·공공서비스 부담.","viewA":"노동 공급과 문화적 다양성을 확대한다.","viewB":"언어·지역사회·주거 등 사회통합 비용이 있다.","followup":"특정 기술 인력만 우선 수용하면 정당한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["이민 확대 논쟁은 인구·노동시장 효과 외에 시민권, 사회통합, 문화적 다양성까지 연결된다.","노동력 부족을 해결할 수 있어도 특정 직업의 임금·주거·복지에 미치는 분배 효과를 살펴야 한다.","이민자를 단순한 노동자원으로 취급하면 장기적으로 가족과 공동체 형성에 필요한 권리가 소홀해질 수 있다.","사회통합 정책은 언어교육과 권리보호, 고용주 규율, 지역사회의 수용 능력을 함께 포함한다.","정책을 평가할 때 이민자의 기여와 지원 비용을 모두 공개하고 국적별 고정관념은 경계한다."],"followupAnswer":"인력이 실제 부족한 분야를 일정 기준에 따라 우선 수용하는 정책 자체는 가능하다. 다만 학력·소득만을 유일한 인간 가치의 기준으로 삼지 말고, 기준을 투명하게 공개하며 가족결합·인도적 보호 등 다른 이민 경로도 유지해야 한다."},{"id":56,"title":"구치소 과밀수용","page":443,"vol":1,"chapter":"헌법·기본권론","question":"구치소 수용공간이 부족할 때 무엇을 우선해야 할까?","focus":"미결수 인권·시설 수용능력·안전.","viewA":"수용 관리에 필요한 공적 자원은 한정되어 있다.","viewB":"과밀 수용은 인간의 존엄·방어권을 해칠 수 있다.","followup":"구속 대체수단을 확대하는 것이 적절한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["구치소 과밀수용은 공공안전과 국가가 구금한 사람에게 보장해야 할 최소한의 처우 사이의 문제다.","미결구금 중인 피의자·피고인은 유죄가 확정되지 않았다는 점에서 자유 제한의 필요성을 엄격히 설명해야 한다.","과밀은 위생·질병·폭력 위험을 높일 수 있고 수용자의 건강만 아니라 교정 공무원의 안전에도 영향을 준다.","불필요한 구금을 줄이기 위한 보석·전자적 관리·시설 개선 등의 수단을 비교할 수 있다.","인력과 예산이 부족하다는 사정만으로 인간적 처우의 최소한까지 면제되지 않는다."],"followupAnswer":"적절하다. 구치소 과밀이 지속되면 도주·증거인멸 위험이 낮은 사람에게 보석이나 조건부 석방 등 대체수단을 확대할 수 있다. 다만 사건별 위험을 평가하고 피해자 보호와 출석 확보를 위한 조건을 함께 설계해야 한다."},{"id":57,"title":"기호용 대마 금지","page":447,"vol":1,"chapter":"헌법·기본권론","question":"기호용 대마를 금지하는 것이 정당한가?","focus":"자율적 선택·공중보건·제3자 피해.","viewA":"중독·건강 위해의 예방이라는 보호 목적이 있다.","viewB":"형사 규제가 과도하고 음성시장을 키울 수 있다.","followup":"담배·주류와 다른 취급을 정당화할 근거는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["기호용 대마 규제는 개인의 건강상 위험, 타인에게 미치는 영향, 형사처벌의 비용을 구분해 봐야 한다.","금지가 중독·사고를 예방할 수 있다는 논거와 암시장이 확대될 수 있다는 반론이 충돌한다.","술·담배 등 유사한 위해를 지닌 물질과 비교해 규제 수준의 일관성을 검토할 수 있다.","위해 수준은 사용 빈도, 연령, 운전·작업 중 사용 여부와 주변인 노출에 따라 달라진다.","전면 금지와 완전 자유화 외에 연령 제한·품질 관리·공공장소 규제·치료 지원이 중간 수단이 될 수 있다."],"followupAnswer":"담배·주류와 차등 규제하려면 위해의 크기, 의존성, 판단능력·운전 등 제3자 위험에 관한 일관된 증거가 필요하다. 단지 다른 물질은 이미 합법이라는 사정만으로 대마를 허용하거나 금지할 수는 없으며 규제의 형평성도 검토해야 한다."},{"id":58,"title":"성적 자기결정권","page":452,"vol":1,"chapter":"헌법·기본권론","question":"개인의 성적 선택을 국가가 어디까지 규제할 수 있을까?","focus":"자기결정권·동의·타인에 대한 피해.","viewA":"충분한 동의가 있는 사적 선택은 보호되어야 한다.","viewB":"착취·권력 불균형 때문에 동의만으로 충분하지 않다.","followup":"동의가 존재해도 금지해야 할 행위가 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성적 자기결정권은 타인과 관계를 맺을지, 어떤 행위를 할지 스스로 결정할 자유와 동의의 존중을 포함한다.","동의는 단순한 침묵이 아니라 상황·관계·압박·철회 가능성까지 고려해 판단해야 한다.","사생활의 자율성은 중요하지만 위력·협박·정보 비대칭이 있으면 형식적 동의의 의미가 약해진다.","국가는 개인의 도덕관을 이유로 친밀한 선택을 과도하게 제한해서는 안 된다.","반대로 성폭력 피해 예방을 위해 명확한 금지 기준과 피해자 지원을 마련할 필요가 있다."],"followupAnswer":"있다. 미성년자 대상 착취, 강제적 폭력, 심각한 신체 위해 등에서는 겉으로 드러난 동의만으로 금지가 해제되지 않을 수 있다. 다만 성인의 유효한 자기결정에 대한 제한은 구체적인 보호 목적과 비례성으로 설명해야 한다."},{"id":59,"title":"강간죄","page":457,"vol":1,"chapter":"헌법·기본권론","question":"성폭력 범죄의 요건을 어떻게 정의해야 할까?","focus":"자유로운 동의·강제성·증명책임·무죄추정.","viewA":"동의 침해에 초점을 두면 보호의 사각지대를 줄인다.","viewB":"규정의 명확성·증거 판단의 어려움을 고려해야 한다.","followup":"명시적 거부가 없는 상황의 동의를 어떻게 판단할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["강간죄 관련 논쟁에서 중심이 되는 것은 성적 자기결정의 침해를 어떤 요건과 증거로 판단할 것인가이다.","폭행·협박의 증거에만 주목하면 명시적 거절을 무시한 행위를 충분히 포착하지 못할 수 있다.","반대로 구성요건이 지나치게 불명확하면 형벌의 예측가능성과 무죄추정 원칙이 흔들릴 수 있다.","신고 지연, 권력관계, 당사자 간 의사소통의 맥락을 선입견 없이 살펴야 한다.","피해자 보호와 피고인의 방어권은 어느 한쪽이 자동으로 다른 쪽을 배제하는 관계가 아니다."],"followupAnswer":"명시적 거부가 없다는 사정만으로 동의를 추정해서는 안 된다. 이전 관계, 말과 행동, 위협·위축 여부 등 전체 맥락에서 자유로운 동의가 있었는지 판단해야 하며, 형사재판에서는 합리적 의심을 배제할 증명이 요구된다는 점도 유지해야 한다."},{"id":60,"title":"혼인과 시민연대계약","page":464,"vol":1,"chapter":"헌법·기본권론","question":"혼인 외에도 법적 동반자 관계를 인정해야 할까?","focus":"가족의 다양성·평등·제도의 목적.","viewA":"다양한 생활 공동체를 법적으로 보호한다.","viewB":"혼인제도 고유의 보호 목적과 구별이 필요할 수 있다.","followup":"동거 기간이나 부양 의무를 요건으로 삼을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["혼인과 시민연대계약을 비교할 때는 가족 형성의 자유와 법률이 제공하는 보호 범위를 분리해 봐야 한다.","상속·의료결정·주거·부양 같은 권리를 혼인 여부에 따라 어떻게 부여할지가 실제 쟁점이다.","혼인 제도의 특수성을 보호할 이유가 있어도 다양한 공동생활 관계가 법적 사각지대에 놓일 수 있다.","전통적 가족의 보호와 다른 관계의 최소한의 생활보장은 반드시 양자택일일 필요가 없다.","계약 당사자의 의사, 제3자의 권리, 공적 급여와 세제에 미치는 영향을 구분해 판단한다."],"followupAnswer":"안정적인 권리·의무 관계를 확인하기 위한 요건은 둘 수 있다. 다만 동거기간만 획일적으로 요구하면 불합리한 배제가 생길 수 있으므로 등록 의사, 상호 부양·책임의 확인, 제3자 보호를 중심으로 설계하는 것이 적절하다."},{"id":61,"title":"이혼과 간통","page":471,"vol":1,"chapter":"헌법·기본권론","question":"간통에 국가 형벌을 부과하는 것이 적절한가?","focus":"혼인 질서와 개인의 사생활·형벌의 보충성.","viewA":"혼인의 신뢰를 보호할 필요가 있다.","viewB":"민사적 해결 가능한 사적 영역에 형벌은 과도할 수 있다.","followup":"혼인 파탄에 따른 손해배상과 형사제재를 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["이혼·간통 논쟁은 혼인 관계에서의 충실 의무와 개인의 사생활·자기결정권을 어디까지 법으로 강제할지 묻는다.","민사적 책임을 물을 수 있다는 것과 국가가 형벌로 개입해야 한다는 것은 서로 다른 문제다.","혼인의 신뢰 훼손은 실제 피해를 낳을 수 있지만 형사처벌이 관계의 회복을 보장하지는 않는다.","유책행위·재산분할·양육 책임 등 실질적 결과를 따로 평가해야 한다.","개인의 도덕적 비난 가능성과 법적 제재의 적절성을 구별하는 것이 중요한 논증 기술이다."],"followupAnswer":"혼인 파탄으로 인한 손해의 회복이나 부양·양육 문제는 민사적으로 논의할 수 있다. 그러나 친밀한 관계를 형벌로 강제할 필요성은 별도로 엄격히 증명해야 한다."},{"id":62,"title":"평등과 형평","page":476,"vol":1,"chapter":"헌법·기본권론","question":"동일한 대우와 상황에 따른 차등 대우 중 무엇이 공정한가?","focus":"평등(equality)과 형평(equity)의 구별.","viewA":"같은 규칙은 자의적 차별을 막는다.","viewB":"출발선이 다르면 같은 규칙이 불평등을 고착한다.","followup":"필요에 따른 차등 지원의 한계는 어디인가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["평등은 동일한 것을 동일하게 대우하고 합리적 사유가 있는 차이는 달리 취급할 수 있다는 원칙이다.","형식적 평등은 규칙의 일관성을, 실질적 형평은 출발선과 기회 격차를 조정하는 데 초점을 둔다.","차등 대우가 허용되려면 비교집단의 차이가 정책 목적과 실제로 관련되어야 한다.","개별적 사정까지 모두 반영하면 행정적 복잡성과 자의성이 커질 수 있다.","면접에서는 ‘왜 이 차이를 고려해야 하는가’와 ‘그 차등의 정도는 적정한가’를 차례로 묻는다."],"followupAnswer":"다르게 취급해야 공정해지는 경우도 있지만 기준은 객관적이고 목적과 연결되어야 한다. 차등 지원으로 새로운 낙인이나 과도한 불이익이 생기지 않는지도 확인해야 한다."},{"id":63,"title":"차별금지법","page":482,"vol":1,"chapter":"헌법·기본권론","question":"포괄적 차별금지 규제가 필요한가?","focus":"차별시정·평등권·표현·종교의 자유.","viewA":"개별 법률의 보호 공백을 줄인다.","viewB":"정당한 구별과 부당한 차별을 구분하는 기준이 중요하다.","followup":"고용상 합리적 직무 요건도 차별로 볼까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["차별금지법의 핵심은 정당한 차등 대우와 근거 없는 불이익을 어떻게 구별하고 구제할지다.","차별 의도를 입증하기 어려운 간접차별처럼 겉으로 중립적인 규칙의 효과를 검토할 필요가 있다.","반면 포괄적인 금지규정이 표현의 자유·종교의 자유·직업 활동과 부딪힐 수 있다.","금지되는 행위, 합리적 예외, 구제 절차를 분명히 해야 예측 가능성을 확보할 수 있다.","법적 제재 외에도 교육·조정·접근성 개선 같은 수단을 함께 설계할 수 있다."],"followupAnswer":"정당한 차등 대우까지 일률적으로 금지해서는 안 된다. 목적의 정당성과 수단의 비례성을 따져 합리적 예외를 정하되 피해자에게는 실효적 구제 절차를 제공해야 한다."},{"id":64,"title":"사형제","page":491,"vol":1,"chapter":"헌법·기본권론","question":"사형제는 유지되어야 할까?","focus":"생명권·응보·범죄예방·오판의 비가역성.","viewA":"중대한 범죄에 대한 사회적 응보를 주장한다.","viewB":"오판을 되돌릴 수 없고 생명권 침해 우려가 크다.","followup":"종신형으로 같은 목적을 달성할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사형제의 쟁점은 응보·범죄예방·피해자 보호와 오판의 회복 불가능성 사이의 충돌이다.","형벌이 매우 무거울수록 증명과 절차의 오류를 완전히 제거할 수 있는지 문제가 된다.","강한 응보감정은 이해할 수 있지만 억제효과가 실제로 입증되는지는 독립적 사실 문제다.","장기 구금 등 대체 형벌이 사회 방어와 책임 추궁에 충분한지도 검토해야 한다.","사형제 존폐는 범죄자의 악행을 비난하는 문제와 국가가 생명을 박탈할 정당성을 나누어 판단해야 한다."],"followupAnswer":"종신형 등 대체 형벌이 범죄 예방과 사회보호를 실질적으로 달성할 수 있다면 사형의 필요성은 약해진다. 특히 사형은 집행 이후 오판을 회복할 수 없다는 점에서 대체 가능성을 엄격하게 검토해야 한다."},{"id":65,"title":"태아 성감별","page":494,"vol":1,"chapter":"헌법·기본권론","question":"태아 성별 정보를 부모에게 알리지 못하게 해야 할까?","focus":"정보 자기결정권·성별 선택과 차별 예방.","viewA":"성별 선호에 따른 차별과 선택적 출산을 우려한다.","viewB":"일률적 정보 제한은 부모의 알 권리를 침해한다.","followup":"사회적 성비가 균형을 이루면 규제 근거가 달라질까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["태아 성감별 논쟁은 임신부의 정보 접근과 자기결정권, 성별 선택에 따른 사회적 해악을 함께 다룬다.","정보 제공을 막는 방식이 실제 성별 선택을 억제하는지, 오히려 적법한 의료 정보를 제한하는지 확인해야 한다.","성비 불균형의 문제는 성별 선호를 만드는 구조적 차별과 연결될 수 있다.","정보 자체에 대한 금지 외에 선택적 중절 규제와 성평등 교육 등의 대안을 비교할 수 있다.","주어진 과제가 ‘정보를 알 권리’인지 ‘행동을 허용할 권리’인지 구분하는 것이 출발점이다."],"followupAnswer":"태아의 성별 정보를 알려주는 행위와 그 정보를 이용한 부당한 차별적 선택을 구분해 규율할 수 있다. 정보 제한의 필요성과 실효성이 입증되지 않으면 덜 침해적인 방법을 검토해야 한다."},{"id":66,"title":"비혼단독출산","page":499,"vol":1,"chapter":"헌법·기본권론","question":"비혼인 개인의 출산·양육을 법적으로 지원해야 할까?","focus":"가족 구성의 자유·아동 복리·사회적 낙인.","viewA":"가족 형태와 무관하게 출생·양육을 보호한다.","viewB":"지원 범위·절차에서 아동 복리를 최우선해야 한다.","followup":"양육 환경의 안정성을 어떻게 평가할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["비혼단독출산 논쟁은 생식 선택의 자유와 아동의 복리, 의료 접근성, 부모의 법적 책임을 함께 살펴야 한다.","혼인 여부만으로 양육 능력을 단정하는 것은 경험적 근거가 약할 수 있다.","새로운 생식기술의 활용에서는 기증자 정보, 출생자의 알 권리, 가족관계 설정이 중요한 쟁점이다.","아동의 복리를 명분으로 성인의 생식 선택을 제한할 때에는 구체적인 위해를 제시해야 한다.","부모의 혼인 지위보다 실제 돌봄·경제·정서적 지원체계가 존재하는지 판단하는 접근이 가능하다."],"followupAnswer":"혼인 여부보다 아동의 실제 양육 안전과 지속적 돌봄 능력을 평가해야 한다. 소득, 돌봄 지원망, 법적 친자관계와 양육 책임을 살피되 비혼·한부모라는 신분 자체를 부정적 지표로 삼아서는 안 된다."},{"id":67,"title":"낙태","page":503,"vol":1,"chapter":"헌법·기본권론","question":"임신중단 결정에 국가가 어느 정도 개입할 수 있을까?","focus":"자기결정·태아 보호·임신 주수·의료 안전.","viewA":"임신한 사람의 신체적 자기결정을 중시한다.","viewB":"태아의 생명 보호 이익도 고려해야 한다.","followup":"초기와 후기의 판단기준이 같아야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["낙태 논쟁은 임신부의 신체 자기결정, 태아 보호의 이익, 의료 현실과 사회적 지원이 중첩되는 문제다.","임신 초기와 후기처럼 상황에 따라 보호 이익의 무게와 의료 위험이 달라질 수 있다.","전면 처벌은 안전하지 않은 의료로 이어질 수 있고 전면적인 무제한 허용도 별도 논의가 필요하다.","임신 사유를 심사할 때 여성에게 과도한 증명 부담과 낙인이 생기지 않는지 살펴야 한다.","실질적 선택을 위해 피임·상담·출산 및 양육 지원, 의료 접근성을 함께 제공하는 방안을 검토한다."],"followupAnswer":"임신 단계와 건강상 위험, 강제·폭력 등 상황을 구분해 법적 기준을 논의할 수 있다. 어떠한 제도든 임신부의 건강과 자기결정을 실질적으로 보호하는 절차가 필요하다."},{"id":68,"title":"유전자 편집기술","page":511,"vol":1,"chapter":"헌법·기본권론","question":"유전자 편집기술을 치료 목적 외에도 허용해야 할까?","focus":"치료와 향상 구별·안전·세대 간 영향.","viewA":"희귀질환 예방 등 의학적 이익이 있다.","viewB":"돌이킬 수 없는 위험과 새로운 불평등이 우려된다.","followup":"체세포와 생식세포 편집을 같은 규칙으로 다룰까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["유전자 편집은 질병 치료를 위한 체세포 편집과 후손에게 유전되는 생식세포·배아 편집의 위험을 구별한다.","치료 목적과 외모·능력 향상 목적 사이에서 사회적 가치판단과 불평등 문제가 달라질 수 있다.","기술의 예측되지 않은 부작용은 특히 미래 세대에게 직접적인 동의를 구하기 어렵다는 문제를 만든다.","개인의 의료 선택 자유와 사회 전체의 유전적 차별·접근성 격차를 함께 검토해야 한다.","안전성 검증, 독립적 심사, 장기 추적, 치료 접근의 형평성을 단계별 조건으로 세울 수 있다."],"followupAnswer":"중증 질환 치료에 신뢰할 만한 효과와 안전성이 입증되면 허용의 근거가 강해진다. 그러나 후손에게 유전되는 변화에는 더 엄격한 심사와 사회적 숙의가 필요하다."},{"id":69,"title":"인신구속절차","page":516,"vol":1,"chapter":"헌법·기본권론","question":"국가는 용의자를 언제까지 체포·구금할 수 있을까?","focus":"신체의 자유·영장주의·적법절차.","viewA":"증거 보전과 도주 방지를 위한 제한이 필요하다.","viewB":"장기 구금은 무죄추정과 방어권을 침해한다.","followup":"긴급 체포 이후 독립적 심사는 언제 이뤄져야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["인신구속절차는 범죄 수사 중 개인의 신체 자유를 제한할 때 필요한 법적 근거와 심사 과정을 뜻한다.","구금의 목적이 수사 편의에 그치지 않도록 도주·증거인멸의 구체적 위험을 확인해야 한다.","혐의가 중하다는 사실만으로 자동적으로 구금을 정당화하는 것은 적절하지 않다.","변호인 조력·불복 절차·기간 제한·인권적 처우는 절차적 통제의 핵심 장치다.","구금 필요성을 판단할 때 불구속 수사나 조건부 석방 같은 대안을 먼저 비교한다."],"followupAnswer":"가능한 한 신속하게 법관 등 독립된 기관의 심사를 받아야 하고, 구금의 필요성을 정기적으로 다툴 기회를 보장해야 한다. 긴급체포의 긴박성은 초기 조치의 이유가 될 수 있어도 무기한 독립 심사를 미루는 이유는 아니다."},{"id":70,"title":"신상정보, 위치정보 공개","page":521,"vol":1,"chapter":"헌법·기본권론","question":"성범죄자의 신상·위치정보는 어디까지 공개할까?","focus":"재범 방지·지역사회 안전·사생활.","viewA":"위험 정보 제공은 예방에 도움이 될 수 있다.","viewB":"낙인·가족에 대한 2차 피해·과잉 공개 우려.","followup":"범죄 유형·재범 위험도에 따라 공개 범위를 달리할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["신상·위치정보 공개는 특정인의 자유·사생활과 다른 사람의 안전을 동시에 다루는 제도다.","공개의 목적이 범죄예방인지 사회적 비난인지 먼저 특정해야 필요성을 평가할 수 있다.","정보가 오래 남으면 법적 제재가 끝난 뒤에도 취업·거주·가족의 권리가 침해될 수 있다.","범죄 위험의 정도와 공개 범위, 접근 권한, 기간·정정 절차를 분리해 설계해야 한다.","무차별 공개보다 보호 목적에 필요한 사람에게만 정확한 정보를 제공하는 대안을 검토한다."],"followupAnswer":"재범 위험에 대한 구체적 평가가 있고 보호 필요성이 높다면 제한적 공개가 가능할 수 있다. 하지만 단순한 낙인 목적의 영구 공개는 비례성 문제가 크다."},{"id":71,"title":"CCTV","page":529,"vol":1,"chapter":"헌법·기본권론","question":"공공장소 CCTV 설치는 어디까지 허용할까?","focus":"범죄예방과 사생활·정보 오남용.","viewA":"안전 확보와 사건 수사에 도움을 준다.","viewB":"상시 감시는 행동의 자유를 위축시킨다.","followup":"보관기간과 접근권한을 엄격히 제한하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["CCTV 설치는 범죄예방·사고 확인의 편익과 촬영 대상자의 사생활·행동의 자유가 맞물리는 문제다.","촬영장소가 공공장소인지 사적 공간인지, 기록이 얼마나 보관되고 누구에게 제공되는지에 따라 침해 정도가 달라진다.","범죄예방 효과와 범죄의 다른 장소로의 이동 가능성을 구분해 평가해야 한다.","목적 외 열람과 유출을 막기 위한 접근 기록·암호화·보관기간 제한도 설치 기준의 일부다.","정책결정에는 설치 자체의 효과뿐 아니라 대체 조명·순찰·안전설계의 가능성도 고려한다."],"followupAnswer":"위험이 높은 장소의 제한적 설치는 검토할 수 있지만 사생활 보호 구역의 상시 촬영은 엄격해야 한다. 보관기간·목적 외 이용 제한·독립적 감독이 뒤따라야 한다."},{"id":72,"title":"공익 목적의 사생활 공개","page":535,"vol":1,"chapter":"헌법·기본권론","question":"공익을 이유로 사인의 사생활을 공개할 수 있을까?","focus":"알 권리·공익성·사생활의 본질적 영역.","viewA":"권력·사회적 위험의 감시에 필요할 수 있다.","viewB":"흥미 위주의 폭로가 회복 불가능한 피해를 낳는다.","followup":"공직자와 일반 시민의 공개 기준은 달라야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["공익 목적의 사생활 공개는 시민의 알 권리와 당사자의 인격·사생활 보호 사이의 긴장이다.","공인인지 여부만으로 모든 정보가 공적 관심사가 되는 것은 아니므로 공적 직무와 정보의 관련성을 확인한다.","사실의 정확성과 사회적 필요성, 동일 목적을 달성할 덜 침해적인 방법이 있는지 따져야 한다.","소문이나 미확인 자료는 공익이라는 명목만으로 공개 정당성을 얻지 못한다.","필요한 내용만 공개하고 민감정보·주변인 정보는 가리는 방식이 고려된다."],"followupAnswer":"달라질 수 있다. 공직자의 공적 권한 행사와 직접 관련된 정보는 공개의 이익이 크지만, 일반 시민의 사생활은 보호 필요성이 상대적으로 높다. 공직자라도 직무와 무관한 사적 사항을 무제한 공개할 수 있는 것은 아니다."},{"id":73,"title":"자기정보결정권과 잊혀질 권리","page":542,"vol":1,"chapter":"헌법·기본권론","question":"오래된 온라인 기록을 삭제해달라는 요구를 어디까지 인정해야 할까?","focus":"자기정보 통제와 표현·기록의 자유.","viewA":"오래된 정보가 평생 낙인으로 작용하는 걸 막는다.","viewB":"역사 기록·언론 자유가 위축될 수 있다.","followup":"공공기록과 단순 검색결과 삭제를 구분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["자기정보결정권은 자신의 정보가 수집·이용·제공되는 방식을 알고 통제할 이익에 초점을 둔다.","잊혀질 권리는 과거 정보가 무기한 검색·노출될 때 갱생과 사생활 회복을 도울 수 있다.","한편 공적 기록과 역사적 사실은 삭제가 오히려 언론·학술·타인의 알 권리를 침해할 수 있다.","정보의 민감성, 공적 중요성, 경과한 시간, 당사자 피해를 비교해야 한다.","검색 결과의 접근 제한과 원문 기록의 삭제는 서로 다른 조치로 평가할 수 있다."],"followupAnswer":"과거 범죄 전력이 있다고 해서 모든 정보를 영원히 공개해야 하는 것은 아니다. 기록의 공익성이 큰 경우 보존하되 검색노출·재유포 방식은 제한적으로 조정할 수 있다."},{"id":74,"title":"대체복무제","page":548,"vol":1,"chapter":"헌법·기본권론","question":"병역 의무를 종교·양심적 이유로 대체할 수 있을까?","focus":"국방 의무와 양심의 자유·형평.","viewA":"양심에 반하는 강제를 최소화한다.","viewB":"복무 부담의 불균형을 막아야 한다.","followup":"대체복무의 기간과 강도를 어떻게 정할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["대체복무제는 국가안보를 위한 병역의무와 양심·종교의 자유를 조화시킬 수 있는지에 관한 제도다.","양심의 진정성을 심사하는 절차가 지나치게 사상·종교를 조사하는 방식이 되면 자유를 침해할 수 있다.","대체복무가 지나치게 징벌적이면 형식상 선택권만 제공하고 실질적 자유를 보장하지 못한다.","반대로 다른 복무 형태와 부담이 현저히 다르면 병역 형평성 논란이 발생할 수 있다.","복무의 사회적 기여, 기간·강도, 적격 심사의 객관성을 함께 비교한다."],"followupAnswer":"대체복무의 부담은 병역 형평을 고려할 수 있으나 양심적 선택을 포기하도록 강요하는 수준이어서는 안 된다. 명확한 심사와 합리적 복무 설계가 필요하다."},{"id":75,"title":"종교의 자유","page":553,"vol":1,"chapter":"헌법·기본권론","question":"종교적 신념 때문에 일반적 규칙의 예외를 인정할까?","focus":"종교의 자유와 중립적 일반법.","viewA":"다원주의 사회에서 신념을 존중한다.","viewB":"타인의 권리·공중안전을 해치면 제한이 필요하다.","followup":"종교적 복장과 안전장비 규정이 충돌하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["종교의 자유는 신념을 가질 자유와 그 신념을 밖으로 표현·실천할 자유를 구분한다.","내면의 신앙은 강하게 보호되지만 외부 행위가 타인의 권리나 공공안전에 영향을 주면 조정이 필요하다.","국가는 특정 종교를 우대하거나 종교 활동을 일률적으로 배척하지 않도록 중립성을 지켜야 한다.","종교적 이유에 의한 일반법 적용 예외는 제3자 피해와 평등 문제를 함께 검토한다.","면접에서는 신앙 그 자체와 사회적 행위에 대한 규제를 정확히 구별하는 것이 중요하다."],"followupAnswer":"우선 종교적 복장을 유지하면서도 안전을 확보할 대체 장비·착용 방식을 찾는 것이 적절하다. 실질적 안전 위험을 다른 방법으로 제거할 수 없을 때만 필요한 범위에서 제한하고, 특정 종교만 불리하게 취급하지 않도록 해야 한다."},{"id":76,"title":"가짜뉴스","page":558,"vol":1,"chapter":"헌법·기본권론","question":"허위정보를 법으로 규제하는 것이 바람직할까?","focus":"허위정보의 피해·표현의 자유·진실 판정 주체.","viewA":"사회적 피해가 큰 조직적 조작을 억제한다.","viewB":"정부가 반대 의견을 허위정보로 규정할 수 있다.","followup":"명백히 조작된 콘텐츠만 규제하면 충분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["가짜뉴스 규제는 허위정보로 인한 피해와 정치적 표현·언론의 자유가 충돌하는 대표 사례다.","거짓인 사실 주장과 주관적 의견·풍자·예측을 구별하지 못하면 과잉 검열이 발생한다.","국가가 진실을 독점적으로 판정할 경우 정권 비판을 허위정보로 낙인찍을 위험이 있다.","반면 조직적 허위정보 유포는 선거·안전·명예에 중대한 피해를 일으킬 수 있다.","정정·반론권, 플랫폼의 절차적 투명성, 피해 구제를 먼저 검토하고 강한 제재는 좁게 설계한다."],"followupAnswer":"명백한 조작 콘텐츠에 집중하면 표현의 자유 침해를 줄일 수 있지만 모든 피해를 막기에는 부족할 수 있다. 의도적으로 사실을 왜곡하는 콘텐츠에는 정정·표시·유통 투명성 등 덜 침해적인 수단을 함께 고려하고, 의견·풍자와 구별해야 한다."},{"id":77,"title":"음란한 표현 규제","page":563,"vol":1,"chapter":"헌법·기본권론","question":"성적 표현물의 규제는 어떤 기준이어야 할까?","focus":"표현의 자유·아동보호·강요와 착취 여부.","viewA":"비동의 유포·착취물은 강하게 규제해야 한다.","viewB":"성인의 합의된 표현까지 일률 규제하면 과도하다.","followup":"공개 플랫폼과 사적 보유는 달리 취급할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["음란 표현 규제에서는 성인의 표현·수용 자유와 미성년자 보호, 비동의·착취 피해를 구분해야 한다.","모든 성적 표현을 동일하게 다루면 예술·교육·정치적 표현까지 과도하게 제한할 수 있다.","착취나 비동의 촬영물은 성적 표현이라는 형식만으로 권리침해의 성격이 사라지지 않는다.","연령 확인, 이용자 선택, 유해 콘텐츠 제한과 형사제재는 침해 강도가 다른 수단이다.","규제의 정당화는 도덕적 불쾌감에 그치지 않고 구체적 피해 및 보호 필요성을 보여줘야 한다."],"followupAnswer":"미성년자 접근 제한과 강제·착취물 단속은 강한 근거가 있다. 반면 성인의 합의된 표현을 무차별 금지하는 조치는 보다 엄격한 비례심사가 필요하다."},{"id":78,"title":"집회 금지","page":570,"vol":1,"chapter":"헌법·기본권론","question":"시민의 집회를 공공질서 이유로 금지할 수 있을까?","focus":"집회 자유·위험의 구체성·비례성.","viewA":"심각하고 구체적 폭력 위험은 대비해야 한다.","viewB":"추상적 우려만으로 금지하면 표현 자유가 위축된다.","followup":"소음·교통 피해는 금지 대신 조건 부과로 해결할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["집회의 자유는 의견 표현뿐 아니라 여러 사람이 모여 사회적 의사를 형성할 기회를 보호한다.","소음·교통·안전 문제는 중요한 공익이지만 집회라는 이유만으로 일반 활동보다 과도하게 규제해서는 안 된다.","전면 금지보다 행진 경로 조정, 시간대 제한, 질서 유지 지원 등 대체 수단이 가능하다.","위험의 추상적 예측이 아니라 구체적 정황과 증거가 있는지 살펴야 한다.","집회의 장소가 정치적 메시지의 일부일 수 있으므로 장소 이전이 표현효과에 미치는 영향도 고려한다."],"followupAnswer":"가능한 한 그렇다. 소음 시간대·확성기·행진 경로 등 구체적 조건을 부과해 피해를 줄일 수 있다면 집회 전면 금지는 지나치다. 조건은 내용·정치적 입장에 중립적이고 실제 피해에 비례해야 한다."},{"id":79,"title":"성범죄자 취업 제한","page":577,"vol":1,"chapter":"헌법·기본권론","question":"특정 성범죄 전력자의 직업 선택을 제한해도 될까?","focus":"아동·취약자 보호와 직업의 자유.","viewA":"재범 위험이 높은 접촉 직종에 예방조치가 필요하다.","viewB":"획일·영구 제한은 과도하고 재사회화를 막는다.","followup":"재범 위험 평가와 제한 기간을 연동하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성범죄자 취업 제한은 아동·취약계층 보호와 처벌 이후 직업 자유 및 갱생 기회가 충돌하는 문제다.","범죄의 유형·피해자 특성·재범 위험과 직무의 관련성을 고려하지 않는 일률 제한은 과도할 수 있다.","피해 가능성이 큰 업무에서는 보다 엄격한 검증과 감독이 정당화될 수 있다.","제한 기간·적용 업종·재심사 절차가 없으면 사실상 영구적 사회적 배제가 될 위험이 있다.","적정 보호를 위해 취업 금지 외에 교육·감독·접촉 제한 같은 장치를 비교할 수 있다."],"followupAnswer":"합리적이다. 범죄의 유형, 피해자와의 접촉 가능성, 실제 재범 위험을 정기 평가해 취업 제한의 범위와 기간을 조정할 수 있다. 다만 평가의 정확도와 이의신청·재심사 절차도 마련해야 한다."},{"id":80,"title":"민법의 3대 원칙","page":582,"vol":1,"chapter":"민법","question":"계약 자유는 어떤 경우 법이 제한할 수 있을까?","focus":"사적자치·소유권·과실책임과 공공복리.","viewA":"자유로운 합의는 개인 선택과 경제활동을 보장한다.","viewB":"정보·교섭력의 격차가 있으면 개입이 필요하다.","followup":"사회적 약자 보호를 위해 어디까지 강행규정을 둘까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["민법의 기본원칙은 사적 자치·소유권 보호·책임의 귀속처럼 개인 사이 관계의 출발 규칙을 제공한다.","계약의 자유는 당사자가 충분한 정보와 실질적 선택권을 가진다는 전제를 필요로 한다.","재산권과 계약 자유가 무제한이면 경제적 우월자가 상대방을 착취할 가능성이 있다.","현대적 조정에는 신의성실, 강행규정, 소비자 보호, 불법행위 책임 같은 장치가 있다.","사례에서는 원칙에 따라 권리·의무를 정한 뒤 예외를 인정할 필요와 범위를 검토한다."],"followupAnswer":"정보 격차·강압·협상력 불균형 때문에 자율적 계약이 실제로 작동하지 않는 영역에는 강행규정이 필요할 수 있다. 그러나 약자 보호라는 명분만으로 계약 자유를 전면 부정하지 말고 보호 효과와 부작용을 비례적으로 따져야 한다."},{"id":81,"title":"신의성실의 원칙","page":589,"vol":1,"chapter":"민법","question":"계약서에 없는 약속도 신뢰를 이유로 지켜야 할까?","focus":"신의성실·신뢰보호·예측 가능성.","viewA":"성실한 거래관계를 지키는 보충 원칙이다.","viewB":"너무 넓게 적용하면 약정의 명확성이 약해진다.","followup":"명문 계약과 상대방의 정당한 신뢰가 충돌하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["신의성실 원칙은 권리 행사나 의무 이행에서 상대방의 정당한 신뢰를 부당하게 침해하지 말라는 요청이다.","서면 계약에 권리가 있더라도 상대방의 신뢰를 유발한 뒤 모순된 행동을 하면 문제가 될 수 있다.","다만 신의칙을 지나치게 넓게 적용하면 법률과 계약의 명확성이 약화된다.","적용할 때는 신뢰 형성, 상대방의 의존, 모순행위의 정도, 불이익을 구체적으로 확인한다.","일반조항을 앞세워 모든 불편한 결론을 뒤집는 논증은 피해야 한다."],"followupAnswer":"사정이 변했다고 해서 모든 권리 행사가 신의칙 위반은 아니다. 상대방의 정당한 신뢰를 형성했는지와 그 신뢰를 배반하는 구체적 부당성이 있는지 따져야 한다."},{"id":82,"title":"반사회적 법률행위","page":595,"vol":1,"chapter":"민법","question":"당사자가 동의한 계약도 사회질서에 반하면 무효일까?","focus":"계약 자유와 사회질서·선량한 풍속.","viewA":"당사자 자율은 원칙적으로 존중되어야 한다.","viewB":"타인의 권리·사회적 기본가치를 해치는 약정은 제한된다.","followup":"‘사회질서’의 내용을 누가 정하고 통제할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["반사회적 법률행위 논쟁은 계약 당사자의 합의를 존중하면서도 사회질서의 최소한을 지킬 수 있는지를 묻는다.","자유로운 계약이라도 폭력·중대한 착취·공공질서 침해를 목표로 한다면 별도의 제약이 필요하다.","반대로 관습적으로 낯선 계약을 쉽게 무효화하면 소수자의 자유가 위축될 수 있다.","사회질서 판단에는 규범의 목적, 침해되는 이익, 대체 제재와 법적 안정성을 함께 고려해야 한다.","도덕적 비난과 법적 무효라는 강한 효과의 정당성을 구분해 설명하는 게 중요하다."],"followupAnswer":"입법부가 공공질서의 기본 기준을 구체화하고 법원은 개별 사건에서 이를 해석하되, 헌법의 기본권·평등 원칙과 확립된 판례에 의해 통제받아야 한다. 추상적인 ‘사회질서’를 개인 취향이나 도덕적 불쾌감과 동일시해서는 안 된다."},{"id":83,"title":"미성년자와의 계약","page":597,"vol":1,"chapter":"민법","question":"미성년자가 체결한 계약의 효력은 어떻게 정해야 할까?","focus":"행위능력 보호와 거래 안전.","viewA":"미성년자의 경험 부족을 보호해야 한다.","viewB":"모든 거래를 쉽게 취소하면 거래 상대방이 불안하다.","followup":"일상적 소액 거래와 고액 대출을 구분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["미성년자의 계약에서는 거래 안전과 판단능력이 충분하지 않은 사람의 보호가 충돌한다.","연령만으로 모든 거래를 동일하게 취급하면 일상생활에 필요한 작은 거래까지 어렵게 할 수 있다.","보호자를 통한 동의·취소 제도는 손해를 피할 기회를 제공하지만 상대방의 예측 가능성도 고려해야 한다.","상품 위험, 거래금액, 기망 여부, 사후 추인 가능성을 구별해 살피면 균형 잡힌 답변이 된다.","미성년자가 이익을 얻은 계약과 채무를 지는 계약을 다르게 다루는 접근도 가능하다."],"followupAnswer":"소액의 일상 거래와 고위험·고액 거래는 보호 필요성이 다르다. 다만 예외를 두더라도 제삼자가 이해할 수 있는 명확한 기준이 있어야 한다."},{"id":84,"title":"동물권","page":603,"vol":1,"chapter":"민법","question":"동물에게 인간과 유사한 법적 권리를 인정해야 할까?","focus":"고통을 느끼는 존재의 이익과 인간 중심 법질서.","viewA":"동물의 복지를 직접적인 도덕적 고려 대상으로 본다.","viewB":"권리 주체·의무 이행을 어떻게 설계할지 어렵다.","followup":"동물 종별로 법적 보호 정도를 달리해도 될까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["동물권 논쟁은 동물을 인간의 소유물로만 볼 것인지 고통을 느끼는 존재로서 독자적 보호가 필요한지 묻는다.","인간과 동일한 법적 권리를 부여하지 않더라도 동물의 이익을 실질적으로 보호할 수 있는 제도는 가능하다.","반려동물·축산동물·야생동물의 상황이 달라 일률 기준을 적용할 때 어려움이 있다.","고통 감수성, 인간의 필요성, 대체 가능성, 보호에 드는 비용이 판단 기준이 될 수 있다.","입법에서는 권리의 추상적 선언보다 금지행위·사육 환경·책임주체를 구체화하는 것이 중요하다."],"followupAnswer":"동물을 인간과 완전히 같은 권리주체로 인정할 필요는 없더라도 불필요한 고통을 피하도록 보호할 이유가 있다. 보호 범위는 종과 상황에 따른 피해를 고려해 구체화해야 한다."},{"id":85,"title":"동물실험","page":608,"vol":1,"chapter":"민법","question":"의학 발전을 위해 동물실험을 허용할 수 있을까?","focus":"필요성·대체가능성·고통 최소화.","viewA":"일부 안전성 연구에 필요한 자료를 제공한다.","viewB":"심각한 고통과 종 차이에 따른 한계가 있다.","followup":"대체 실험법이 있다면 동물실험을 금지해야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["동물실험은 과학적·의료적 이익과 실험동물의 고통을 어떻게 정당화하고 줄일지의 문제다.","시험목적이 중요하더라도 같은 효과를 낼 대체 방법이 있다면 고통을 주는 실험을 우선할 근거가 약해진다.","실험의 필요성, 개체 수 최소화, 고통 경감 등 단계별 기준을 설정할 수 있다.","실험성과가 불확실하다면 예상 편익만으로 강한 피해를 정당화하기 어렵다.","외부 심사와 사후 보고를 통해 연구자 개인의 재량에만 판단을 맡기지 않는 방안이 가능하다."],"followupAnswer":"과학적으로 검증된 대체법으로 같은 연구 목적과 안전성을 달성할 수 있다면 동물실험은 중단하거나 축소하는 것이 타당하다. 다만 대체법의 신뢰성과 적용 범위를 평가하고, 아직 대안이 없는 경우도 최소 침해 원칙을 적용해야 한다."},{"id":86,"title":"응보와 교화","page":614,"vol":1,"chapter":"형법","question":"형벌의 목적은 응보인가 교화인가?","focus":"책임에 상응하는 제재와 재범 예방.","viewA":"피해자·공동체의 정의감과 책임을 표현한다.","viewB":"교화·사회복귀를 포기하면 재범을 줄이기 어렵다.","followup":"중대범죄와 경미범죄에 같은 비중을 둘까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["응보는 범죄자가 책임에 비례한 처벌을 받는 정의를, 교화는 재범 방지와 사회 복귀 가능성을 강조한다.","처벌이 지나치게 가볍다면 피해자와 공동체의 정의감이 훼손될 수 있다.","반면 처벌이 과도해 사회 복귀를 막으면 장기적인 범죄예방 효과가 낮아질 수 있다.","형벌의 유형·기간에 따라 응보, 예방, 교화의 상대적 비중을 달리 설계할 수 있다.","‘강한 처벌 대 관대한 처벌’의 단순 구도에서 벗어나 재범률·피해 회복·책임 정도를 함께 따져야 한다."],"followupAnswer":"범죄의 중대성에 따라 비중을 달리할 수 있다. 중대범죄는 피해 회복·응보와 사회안전의 요구가 크지만 교화 가능성을 배제할 이유는 없고, 경미범죄는 재사회화·회복적 조치를 더 적극적으로 활용할 수 있다."},{"id":87,"title":"수형자 처우 개선","page":619,"vol":1,"chapter":"형법","question":"수형자에게 더 나은 생활·교육 환경을 제공해야 할까?","focus":"인간의 존엄·재사회화·형벌 목적.","viewA":"교화와 재범 감소에 도움이 될 수 있다.","viewB":"피해자와 일반 시민의 박탈감을 고려해야 한다.","followup":"기본적 처우와 특혜를 가르는 기준은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["수형자 처우 개선은 국가가 자유를 제한한 사람의 생명·건강·교육 기회를 어디까지 보장해야 할지의 문제다.","수형자도 인간적 처우의 대상이며 기본적 인권 보호와 범죄에 대한 처벌은 구별해야 한다.","처우 개선이 무조건적 특혜가 아니라 재범 방지와 교정시설 안전에 기여할 수 있다.","반면 제한된 자원과 일반 시민과의 형평성을 무시하면 정책 수용성이 떨어질 수 있다.","시설 개선, 직업훈련, 정신건강 관리, 출소 후 연계를 목표별로 설계할 수 있다."],"followupAnswer":"처벌의 본질인 자유 제한을 유지하면서도 기본적인 의료·안전과 재사회화 지원을 제공할 수 있다. 정책 효과는 비용과 재범 방지 성과로 평가해야 한다."},{"id":88,"title":"범죄의 원인","page":625,"vol":1,"chapter":"형법","question":"범죄는 개인의 선택인가 사회 환경의 산물인가?","focus":"개인 책임과 사회구조적 위험 요인.","viewA":"가해자의 선택에 따른 책임 추궁이 필요하다.","viewB":"빈곤·교육·환경이 범죄 발생에 영향을 줄 수 있다.","followup":"사회적 원인을 인정해도 개인 책임은 남는가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["범죄의 원인을 설명할 때 개인의 선택·책임과 빈곤·교육·가정환경 같은 구조적 요소를 분리해야 한다.","환경적 위험요인을 지적한다고 해서 모든 범죄자의 책임이 사라지는 것은 아니다.","범죄율의 집단 간 차이를 개인의 선천적 속성이나 도덕적 열등함으로 단정하면 오류가 생긴다.","형사정책은 처벌만 아니라 예방, 회복, 사회복귀의 경로를 함께 다룰 필요가 있다.","인과관계를 말할 때 단순 상관관계와 정책의 실제 예방효과를 구별해야 한다."],"followupAnswer":"범죄 원인이 복합적일수록 처벌과 예방정책을 결합해야 한다. 개인의 고의·책임을 판단하되 재범 위험을 낮추는 환경 개선을 병행할 수 있다."},{"id":89,"title":"엄벌주의","page":632,"vol":1,"chapter":"형법","question":"형량을 높이면 범죄가 줄어들까?","focus":"일반예방·범죄 억제·형벌 비례.","viewA":"엄정 처벌은 규범 위반의 비용을 높인다.","viewB":"적발 확률·재범 원인과 분리하면 효과가 제한적이다.","followup":"처벌 강도보다 검거 가능성을 높이면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["엄벌주의는 형벌을 강화하면 범죄가 줄어드는지, 처벌의 비례성과 효율성을 어떻게 볼지에 관한 논쟁이다.","형량의 높이와 실제 적발·기소 가능성은 별개의 변수이므로 어느 요소가 범죄 억제에 유효한지 검토해야 한다.","일률적 형량 강화는 범죄의 경중과 책임 정도 차이를 반영하기 어렵게 만들 수 있다.","피해 회복과 재범 예방을 위한 치료·교육·감독 정책은 형벌과 경쟁하는 대안이 될 수 있다.","실제 범죄 유형별 자료와 부작용을 확인하지 않은 상징적 처벌 강화는 신중해야 한다."],"followupAnswer":"중대한 범죄에 상응한 처벌은 필요하지만 단순히 형량만 올리는 정책의 효과는 따로 입증해야 한다. 적발 능력과 피해자 지원, 재범 방지를 함께 개선해야 한다."},{"id":90,"title":"성범죄 강력처벌","page":637,"vol":1,"chapter":"형법","question":"성범죄에 더 강한 형벌을 부과해야 할까?","focus":"피해의 심각성·책임 비례·예방 효과.","viewA":"범죄의 중대성을 분명히 하고 피해자를 보호한다.","viewB":"최저형의 획일화는 개별 사정 반영을 어렵게 한다.","followup":"처벌 강화와 예방·지원 중 어떤 투자가 더 중요한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성범죄 강력처벌 논쟁은 피해의 중대성과 성적 자기결정 보호를 강조하면서도 행위책임에 비례해야 한다.","서로 다른 범죄 유형과 피해·고의의 정도를 구분하지 않으면 처벌의 정당성이 약해질 수 있다.","피해자 보호에는 형벌 외에도 신고 지원, 증거 보존, 사후 안전 조치가 포함된다.","중한 형량만으로 예방 효과가 생긴다고 단정하기보다 적발·재범 방지 체계를 함께 점검한다.","피해자의 경험을 존중하면서 수사·재판에서 무죄추정과 공정한 증거 심사도 보장해야 한다."],"followupAnswer":"예방·피해자 지원과 엄정한 수사는 대개 상호보완적이다. 제한된 예산을 배분할 때에는 사건 발생·재범 감소와 피해 회복에 대한 실증효과를 비교해야 하며, 일률적인 형량 가중만으로 문제를 해결할 수 있다고 보기는 어렵다."},{"id":91,"title":"그루밍 성범죄","page":643,"vol":1,"chapter":"형법","question":"심리적 지배를 이용한 성범죄를 어떻게 규율해야 할까?","focus":"위력·의존관계·동의의 자율성.","viewA":"눈에 보이는 폭력 없이 발생하는 착취를 포착한다.","viewB":"심리적 영향의 범위와 증거 기준을 명확히 해야 한다.","followup":"연령·권력관계에 따라 추정 기준을 달리할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["그루밍 성범죄는 신뢰 관계 형성·의존 유도 등을 통해 피해자의 의사결정을 왜곡할 수 있는 행위를 다룬다.","겉으로 강한 폭력이 없더라도 권력관계와 지속적 통제가 실제 동의를 약화할 수 있다.","그렇지만 신뢰 관계 자체를 범죄의 징표로 취급하면 일상적 관계까지 위축시킬 위험이 있다.","연령, 지위, 기망·압박, 피해자의 선택 가능성, 행위의 단계 등을 구체적으로 구분해야 한다.","입법에서는 모호한 도덕적 낙인보다 예측 가능한 행위 요건과 피해자 보호 절차가 중요하다."],"followupAnswer":"그럴 수 있다. 아동과 보호자·교사 등 권력관계가 뚜렷한 상황에서는 형식적 동의보다 실제 거절 가능성과 심리적 지배를 더 중시해야 한다. 다만 연령별 기준과 금지행위는 명확히 규정해 예측 가능성과 방어권도 보호해야 한다."},{"id":92,"title":"한국형 제시카법","page":647,"vol":1,"chapter":"형법","question":"성범죄자 거주지를 제한하는 제도가 필요한가?","focus":"재범 예방·거주 이전의 자유·효과 검증.","viewA":"아동 이용시설 주변의 안전에 기여할 수 있다.","viewB":"주거 불안과 낙인이 오히려 관리 사각을 낳을 수 있다.","followup":"전자감독·치료가 더 효과적이라면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["한국형 제시카법은 특정 성범죄자의 거주지를 제한해 잠재적 피해자를 보호하려는 정책 구상이다.","거주 제한의 범위가 지나치게 넓으면 사실상 거주 가능한 지역이 사라지는 문제가 생긴다.","거주 불안정은 사회복귀와 감독을 오히려 어렵게 해 안전 효과를 약화할 수도 있다.","재범 위험의 개별 평가, 제한 기간, 치료·관리 체계, 피해자 보호 효과를 함께 검토해야 한다.","학교 주변 일률 제한과 위험도에 따른 조건부 감독은 침해 방식이 서로 다르다."],"followupAnswer":"전자감독·치료가 같은 위험을 더 효과적으로 줄인다는 근거가 있다면 광범위한 거주 제한은 재검토해야 한다. 제한 수단별 재범 예방 효과, 지역사회 안전, 주거권 침해를 비교해 최소 침해적인 조합을 선택할 수 있다."},{"id":93,"title":"심신미약, 주취감경","page":653,"vol":1,"chapter":"형법","question":"음주·정신적 장애가 형량에 어떤 영향을 줘야 할까?","focus":"책임능력의 정도·자기초래 위험·평등.","viewA":"실제 판단·통제능력 저하는 책임평가에 영향을 준다.","viewB":"자의적 음주를 감경 사유로 삼으면 부당하다.","followup":"질환과 자발적 취기를 어떻게 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["심신미약·주취감경 논쟁에서는 범행의 비난 가능성과 실제 자기통제 능력을 나누어 살핀다.","같은 결과라도 행위자의 인지·통제 능력에 큰 차이가 있다면 책임의 정도가 달라질 수 있다.","반대로 스스로 위험을 예상하며 취한 경우까지 쉽게 감경하면 범죄예방과 책임 원칙에 어긋날 수 있다.","의학적 진단과 법적 책임 판단은 동일하지 않으며 사건 당시 능력과 자발적 상태 형성을 평가해야 한다.","일률적 감경·일률적 배제 모두 개별 사정을 놓칠 위험이 있다."],"followupAnswer":"자발적으로 위험한 음주 상태를 만들고 범죄 위험을 예견했다면 감경을 제한할 이유가 있다. 그러나 실제 책임능력이 얼마나 영향을 받았는지는 개별적으로 검토해야 한다."},{"id":94,"title":"위법성 조각사유","page":657,"vol":1,"chapter":"형법","question":"위험을 막기 위한 행위는 언제 위법하지 않은가?","focus":"정당방위·긴급피난의 요건과 비례성.","viewA":"급박한 침해에 대한 방어는 법질서가 허용할 수 있다.","viewB":"방어 범위를 넘는 폭력은 또 다른 피해를 만든다.","followup":"공격자가 도주하는 시점에도 방어가 가능한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["위법성 조각사유는 겉으로 범죄 구성요건에 해당하는 행위라도 특정한 정당화 사유가 있는지 판단하는 틀이다.","정당방위는 부당한 침해에 맞서는 대응과 관련되고 긴급피난은 위험을 피하기 위한 이익 충돌을 다룬다.","피해를 입혔다는 결과만으로 위법성이 확정되는 것은 아니지만 단순한 분노나 보복은 정당화되지 않는다.","침해의 현재성·필요성·상당성, 가능한 다른 수단이 핵심적으로 검토된다.","행위의 목적, 시점, 수단, 방어 이후의 행동을 시간 순서로 분석하면 답변이 명료해진다."],"followupAnswer":"방어행위라 하더라도 위험이 종료된 뒤 보복으로 이어졌다면 정당화 근거가 약해진다. 구체적 상황에서 필요한 최소한의 대응이었는지 평가해야 한다."},{"id":95,"title":"형사미성년자 연령 하향","page":662,"vol":1,"chapter":"형법","question":"형사미성년자 기준을 낮춰야 할까?","focus":"책임능력·소년의 발달·사회적 보호.","viewA":"심각한 범죄에 책임을 묻고 피해를 보호한다.","viewB":"어린 연령에서 형벌 낙인과 재범 위험이 커진다.","followup":"연령 하향 대신 보호처분 강화를 선택하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["형사미성년자 연령 하향은 청소년의 책임능력과 사회적 위험, 교육적 회복 가능성을 함께 따지는 문제다.","사회적 비난 가능성이 커졌다는 인상만으로 모든 연령대의 형사책임능력이 변했다고 단정할 수 없다.","어린 나이에 강한 형벌을 부과하면 낙인과 재범의 악순환이 생길 수 있다.","반대로 중대한 범죄에 대한 피해자 보호와 공공안전의 요구도 무시할 수 없다.","연령 하향 외에 소년 보호처분 개선, 교육·치료, 피해 회복 제도를 비교해 평가한다."],"followupAnswer":"보호처분의 실효성을 높이는 쪽을 우선 검토할 수 있다. 조기 교육·치료·보호관찰·피해 회복이 재범 예방에 효과적이라면 연령 하향의 필요성이 약해진다. 다만 중대 범죄 대응의 공백이 실제 있는지도 따져야 한다."},{"id":96,"title":"국가의 시장 개입: 공매도 규제","page":10,"vol":2,"chapter":"경제·산업정책","question":"공매도 규제는 개인투자자를 보호하는가?","focus":"시장 유동성·가격발견·불공정 거래 방지.","viewA":"급격한 투기·시장교란에 대응할 수 있다.","viewB":"거래 금지가 가격발견·위험헤지를 방해한다.","followup":"불법 공매도 단속과 전면 금지를 구분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["공매도는 보유하지 않은 주식을 빌려 매도하는 거래 방식이며 시장의 가격발견·유동성과 연결된다.","가격이 과도하게 올랐을 때 부정적 정보가 가격에 반영되도록 돕는 기능이 있다고 평가된다.","한편 차입·대차와 주문 정보가 불균형하면 개인투자자에게 불공정하다는 인식이 커질 수 있다.","공매도 금지의 효과는 시장 안정뿐 아니라 가격 왜곡·유동성 저하까지 포함해 비교해야 한다.","불법 거래 적발과 정보 공개를 강화하는 수단이 전면 금지보다 적절한지 검토할 수 있다."],"followupAnswer":"불법 공매도·시장조작은 강하게 규제하되 정상적인 공매도까지 일률 금지할 필요가 있는지는 실증적으로 평가해야 한다. 공정한 접근성과 투명성을 높이는 대안도 비교해야 한다."},{"id":97,"title":"국가의 경제 개입: 재정, 통화정책","page":18,"vol":2,"chapter":"경제·산업정책","question":"경기침체 시 정부와 중앙은행은 어떻게 개입해야 할까?","focus":"재정정책·통화정책·물가·국가채무.","viewA":"경기 급락과 실업 충격을 완충할 수 있다.","viewB":"과도한 개입은 물가·부채·도덕적 해이를 키운다.","followup":"물가 상승과 경기침체가 동시에 나타나면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["재정정책은 지출·조세를 통해, 통화정책은 금리·유동성 등을 통해 경제활동에 영향을 주는 정책이다.","경기 침체에 대응할 때 정책의 단기 부양 효과와 재정 부담·물가 위험을 함께 살펴야 한다.","통화 완화가 투자와 소비를 돕더라도 부채가 많은 경제에서는 자산가격 불균형을 만들 수 있다.","정책이 적용되는 시점과 경제 주체가 예상하는 반응에 따라 효과가 달라진다.","취약계층에 직접 지원할지 전체 수요를 부양할지는 정책 목표와 재
