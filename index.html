정 여력에 따라 구분한다."],"followupAnswer":"물가 상승이 두드러질 때에는 경기부양과 물가안정 사이 선택이 어려워진다. 광범위한 부양 대신 피해가 큰 집단에 선별 지원을 하거나 정책 속도를 조절하는 방안을 검토해야 한다."},{"id":98,"title":"성장정책과 분배정책","page":25,"vol":2,"chapter":"경제·산업정책","question":"경제성장과 소득분배 중 무엇을 먼저 추구할까?","focus":"효율·형평·장기적 성장의 상호작용.","viewA":"성장은 복지 재원을 늘리고 기회를 확대한다.","viewB":"성과 집중이 심하면 사회 통합을 해친다.","followup":"재분배가 성장에 도움이 되는 구간이 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성장정책은 생산능력과 전체 소득을 높이는 데, 분배정책은 결과의 형평과 취약계층 보호에 초점을 둔다.","성장이 분배에 도움이 될 수 있지만 이익이 특정 계층에 집중될 가능성도 있다.","과도한 재분배가 투자·노동 유인을 해칠 수 있다는 주장도 실제 제도에 따라 정도가 달라진다.","일자리·교육기회·공정경쟁을 개선하면 성장과 분배에 동시에 기여하는 정책을 설계할 수 있다.","두 목표를 대립시키기보다 기간·수혜집단·재원에 따른 정책 효과를 비교하는 것이 바람직하다."],"followupAnswer":"있다. 취약계층의 교육·건강·주거에 대한 투자가 노동생산성과 기회균등을 개선하면 재분배가 장기 성장에 기여할 수 있다. 반면 재원이 과도하게 왜곡적이거나 지원 유인이 잘못 설계되면 성장을 약화할 위험도 있다."},{"id":99,"title":"재분배정책: 부자 증세","page":30,"vol":2,"chapter":"경제·산업정책","question":"부자 증세는 공정한가?","focus":"수직적 형평·조세 회피·재분배.","viewA":"담세능력이 큰 집단이 더 부담할 수 있다.","viewB":"투자·노동 유인과 자본 이동에 영향을 줄 수 있다.","followup":"세율보다 세원 포착의 공정성이 중요한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["부자 증세는 조세 부담 능력과 사회적 기회균등, 자본 유출·투자 유인의 영향을 함께 검토하는 문제다.","세율을 높인다고 세수가 같은 비율로 늘어나는 것은 아니므로 과세표준과 행동변화를 구별해야 한다.","조세회피 가능성과 부동산·근로·자본 등 과세 대상에 따른 형평도 중요하다.","세금의 정당성은 징수뿐 아니라 그 재원을 어디에 쓰고 누구에게 편익이 돌아가는지에 달려 있다.","한계세율, 과세 예외, 행정 집행 가능성을 구체화하지 않은 찬반은 설득력이 약하다."],"followupAnswer":"중요하다. 법정세율만 높아도 자산·소득의 누락과 회피가 크면 과세의 형평이 약해진다. 과세 대상과 평가·집행 기준을 공정하게 설계하고 실질 부담을 비교하는 것이 세율 논쟁만큼 중요하다."},{"id":100,"title":"포지티브 규제와 네거티브 규제","page":37,"vol":2,"chapter":"경제·산업정책","question":"국가가 허용할 행동을 열거할까, 금지할 행동만 열거할까?","focus":"포지티브/네거티브 규제와 위험의 성격.","viewA":"선허용 방식은 혁신과 신시장 진입을 촉진한다.","viewB":"위험성이 큰 분야는 사전 허가가 필요할 수 있다.","followup":"의료기기와 일반 앱에 같은 규제 방식을 적용할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["포지티브 규제는 허용된 것 중심의 운영, 네거티브 규제는 금지된 것을 제외한 활동을 허용하는 접근이다.","신산업에서는 허용 목록을 바꾸는 속도가 기술 변화보다 느려 혁신이 지체될 수 있다.","반면 큰 위해가 예상되는 의료·안전 분야에서 사후 제재만 믿으면 피해 회복이 어렵다.","규제 방식을 선택할 때 피해의 중대성·되돌릴 수 있는 정도·감독 역량을 비교해야 한다.","규제샌드박스와 사후 감시, 투명한 기준 공개 등 혼합 설계가 가능하다."],"followupAnswer":"위험이 낮고 쉽게 회복 가능한 분야는 네거티브 규제가 합리적일 수 있다. 반대로 생명·안전에 중대한 위해가 우려되면 사전 심사와 허용 기준을 유지할 수 있다."},{"id":101,"title":"공유경제","page":43,"vol":2,"chapter":"경제·산업정책","question":"공유경제 플랫폼에 기존 사업과 같은 규제를 적용해야 할까?","focus":"자원 활용 효율·노동 보호·시장경쟁.","viewA":"유휴자산 활용과 소비자 편익이 커질 수 있다.","viewB":"플랫폼 책임과 기존 사업자와의 형평이 문제 된다.","followup":"동일한 서비스를 제공하면 동일한 규제가 필요한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["공유경제는 개인이 가진 공간·차량·물건 등을 플랫폼을 통해 다른 사람과 이용하는 거래 방식을 포함한다.","사용되지 않던 자원을 활용할 수 있지만 플랫폼이 커지면 새로운 독점과 노동문제가 생길 수 있다.","개인 간 일시적 공유인지 전문 사업자가 사실상 영업하는 것인지에 따라 규제 필요성이 달라진다.","소비자 사고 책임, 보험, 세금, 지역주민과 기존 사업자의 이해충돌이 실질적 쟁점이다.","명칭이 공유경제라고 해서 기존 안전·조세·노동 의무에서 자동으로 제외되는 것은 아니다."],"followupAnswer":"일시적·소규모 공유는 진입 장벽을 낮출 수 있지만 대규모 상업적 영업에는 유사 서비스와 비슷한 안전·보호 기준을 적용해야 한다. 동일 위험에는 유사한 보호를 주는 방식이 합리적이다."},{"id":102,"title":"플랫폼 규제","page":46,"vol":2,"chapter":"경제·산업정책","question":"거대 플랫폼 기업을 별도로 규제해야 할까?","focus":"네트워크 효과·경쟁·이용자 선택권.","viewA":"독점적 지위 남용과 끼워팔기를 방지한다.","viewB":"과도한 규제가 혁신과 규모의 경제를 위축시킨다.","followup":"사전규제와 사후제재 중 무엇이 적절할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["플랫폼은 판매자·구매자·노동자 등 여러 집단을 연결하며 네트워크 효과로 급속히 성장할 수 있다.","시장의 효율과 소비자 편의를 늘리지만 규모가 커지면 입점 업체·이용자가 이탈하기 어려워질 수 있다.","수수료·검색 노출·자사상품 우대·데이터 접근이 경쟁의 공정성을 좌우할 수 있다.","규제는 플랫폼 자체를 벌주는 것이 아니라 구체적 지배력 남용과 불투명한 거래 조건을 목표로 해야 한다.","스타트업의 혁신을 해치지 않도록 규모·지배력·위험에 비례한 의무 설계가 필요하다."],"followupAnswer":"예방하기 어려운 중대한 피해와 지배력 남용 가능성이 크면 사전 규제가 설득력 있다. 반면 피해가 쉽게 복구되고 혁신 속도가 빠른 분야에서는 사후 제재를 중심으로 설계할 수 있다. 개인정보·기만 방지 같은 기본 의무는 어느 경우에도 필요하다."},{"id":103,"title":"지식재산권","page":51,"vol":2,"chapter":"지식·정보정책","question":"창작·발명을 독점할 권리는 어디까지 보장해야 할까?","focus":"창작 유인과 지식 접근·후속 혁신.","viewA":"권리 보장이 연구개발 비용 회수를 돕는다.","viewB":"긴 독점은 지식 확산과 후속 연구를 막는다.","followup":"필수 의약품 특허에는 별도 기준이 필요한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["지식재산권은 창작·발명의 성과를 일정 기간 보호해 혁신 유인을 제공하는 제도다.","보호 기간과 범위가 너무 좁으면 모방 비용이 낮아지고 연구개발 투자 유인이 약해질 수 있다.","반대로 권리가 지나치게 강하면 후속 창작과 연구, 공공의 지식 접근이 막힌다.","특허와 저작권, 영업비밀은 보호 대상과 공개 요구가 다르므로 각각 구별해 논해야 한다.","권리의 부여 이유와 예외·제한을 함께 설명하면 독점과 공공재 사이 균형을 잡을 수 있다."],"followupAnswer":"필요할 수 있다. 필수 의약품처럼 생명·건강에 직접 영향을 미치는 기술은 혁신 보상과 접근권이 충돌하므로, 심각한 공급 부족 시 강제실시·가격 협상 등 예외를 검토할 수 있다. 권리자에 대한 적절한 보상도 중요하다."},{"id":104,"title":"거래비용","page":57,"vol":2,"chapter":"지식·정보정책","question":"거래비용이 낮아지면 정부 규제가 덜 필요해질까?","focus":"정보탐색·협상·집행 비용과 권리배분.","viewA":"명확한 권리와 협상은 자율 해결을 촉진한다.","viewB":"피해자가 많거나 정보가 편중되면 협상이 실패한다.","followup":"가해자와 피해자가 수만 명씩 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["거래비용은 계약 상대를 찾고 정보를 확인하고 약속을 감시·집행하는 데 드는 비용을 뜻한다.","거래비용이 낮으면 당사자들이 직접 협의해 자원을 효율적으로 배분할 여지가 커진다.","그러나 다수의 피해자, 정보 비대칭, 공공재 문제에서는 개별 협상만으로 해결하기 어렵다.","권리의 최초 배분이 협상력·재산 분배에 영향을 주므로 효율과 정의를 구별해야 한다.","사례에서는 ‘누가 정보와 교섭력을 갖는지’와 ‘법이 거래비용을 줄일 수 있는지’를 따져야 한다."],"followupAnswer":"수만 명이 연관되면 협상 상대를 찾고 합의·이행을 감독하는 비용이 커져 개별 자발적 교섭은 사실상 어렵다. 집단소송, 손해배상 기준, 사전 규제 등 거래비용을 줄이는 법적 장치를 검토해야 한다."},{"id":105,"title":"지식재산과 독점 규제","page":61,"vol":2,"chapter":"지식·정보정책","question":"특허가 시장 독점을 강화할 때 개입해야 할까?","focus":"지식재산 보호·경쟁법·공익.","viewA":"혁신에 대한 보상을 보장한다.","viewB":"시장 지배가 남용되면 소비자와 후속 혁신을 해친다.","followup":"권리행사 자체와 권리남용을 어떻게 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["지식재산권은 일정한 독점을 허용하지만 경쟁법은 부당한 시장지배력 남용을 억제하려는 목적을 가진다.","독점적인 권리의 존재와 실제 시장에서 위법한 배제행위를 했는지는 별도로 판단해야 한다.","필수 기술을 가진 기업이 접근을 부당하게 막으면 후속 혁신과 소비자 선택을 제한할 수 있다.","그러나 지나친 강제 공유는 연구개발 비용을 회수할 유인을 훼손할 수 있다.","권리 범위·시장대체 가능성·라이선스 관행·기술의 중요성을 함께 검토한다."],"followupAnswer":"정당한 독점권의 행사까지 자동으로 금지할 수는 없다. 다만 지배력이 크고 대체 수단이 없으며 경쟁을 부당하게 배제한다면 공정한 접근 조건을 검토할 수 있다."},{"id":106,"title":"강제실시","page":66,"vol":2,"chapter":"지식·정보정책","question":"공중보건 위기에서 특허권자의 동의 없이 의약품을 생산할 수 있을까?","focus":"강제실시·재산권·공익적 필요·보상.","viewA":"필수 치료제의 접근성을 확보할 수 있다.","viewB":"기업의 장기 연구개발 유인을 약화시킬 수 있다.","followup":"적정 보상을 하면 개입을 정당화할 수 있을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["강제실시는 특허권자의 독점적 권리에 예외를 두어 공익적 필요에 따라 발명을 이용하도록 하는 제도다.","필수 의약품 공급이 부족한 위기 상황에서 접근성을 확보하려는 목적이 강하게 제기될 수 있다.","반면 보상이 지나치게 낮거나 예외가 남발되면 미래 연구개발 투자 유인을 저해할 수 있다.","필요성이 얼마나 긴급한지, 자발적 라이선스나 가격 협상이 가능한지, 대체 치료제가 있는지 확인한다.","허용하더라도 사용 범위·기간·공정한 보상·정보 공개·사후 심사를 함께 설계해야 한다."],"followupAnswer":"적정 보상은 개입 정당성을 높이는 중요한 조건이지만 그것만으로 충분하지 않다. 공익적 필요와 대체 수단 부재, 범위·기간의 제한까지 충족해야 한다."},{"id":107,"title":"AI","page":74,"vol":2,"chapter":"지식·정보정책","question":"AI가 내린 결정의 책임은 누구에게 있는가?","focus":"인간 통제·설명 가능성·혁신 촉진.","viewA":"자동화는 효율과 접근성을 높인다.","viewB":"편향·오판·책임 공백이 발생할 수 있다.","followup":"고위험 AI만 별도로 심사해야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["AI의 판단은 개발자·배포자·운영자·이용자의 여러 선택과 데이터가 함께 만들어낸 결과일 수 있다.","정확도가 높아도 학습데이터 편향이나 설명 부족 때문에 특정 집단에 불공평한 결과가 나타날 수 있다.","위험이 낮은 추천시스템과 생명·자유를 좌우하는 고위험 결정은 동일한 사전 규제가 적절하지 않을 수 있다.","책임 귀속은 실질적 통제력, 위험을 예방할 수 있었는지, 정보를 누가 보유했는지를 기준으로 나눌 수 있다.","의미 있는 인간 감독, 이의제기, 결과 기록과 사후 감사는 고위험 분야에서 중요한 안전장치다."],"followupAnswer":"고위험 AI에 더 엄격한 사전 심사를 두는 것이 비례적일 수 있다. 하지만 저위험 AI에도 기본적인 개인정보·기만 방지 등 의무는 남아야 한다."},{"id":108,"title":"전투용 로봇","page":78,"vol":2,"chapter":"지식·정보정책","question":"인간이 개입하지 않는 자율무기를 허용해도 될까?","focus":"군사적 효율·국제인도법·인간 통제.","viewA":"일부 상황에서 군인의 위험을 줄일 수 있다.","viewB":"오인 식별과 책임 귀속 문제가 심각하다.","followup":"공격 승인만 인간에게 남기면 충분한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["자율무기는 표적 식별·추적·공격의 일부 또는 전부를 기계가 수행할 수 있는 무기체계다.","군인의 위험을 줄인다는 목표가 민간인 오인 공격이나 자동화된 확전의 위험을 상쇄하는지는 별도 평가해야 한다.","국제인도법에서 요구되는 민간인 구별, 비례성, 예방조치를 기계가 실제로 이행할 수 있는지 의문이 생긴다.","사고가 발생했을 때 개발자·지휘관·운영자가 각각 어느 수준의 통제권을 보유했는지 확인해야 한다.","군사적 편익과 불가역적 피해를 고려해 무기의 유형별로 인간 승인과 중지 권한을 설계할 수 있다."],"followupAnswer":"공격 버튼을 인간에게 남기는 것만으로 충분하지 않을 수 있다. 결정에 필요한 정보를 인간이 이해하고 수정·취소할 시간과 권한이 실제로 보장돼야 한다."},{"id":109,"title":"AI 창작물의 권리 주체","page":82,"vol":2,"chapter":"지식·정보정책","question":"AI가 독자적으로 만든 작품은 누구의 것인가?","focus":"인간의 창작적 기여·저작권 유인·공유지.","viewA":"권리 보호는 AI 활용 투자 유인을 줄 수 있다.","viewB":"기여 없는 독점이 공공의 지식 이용을 막을 수 있다.","followup":"프롬프트 입력과 결과물의 상당한 수정은 같을까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["AI 창작물 논쟁에서는 작품에 인간의 독창적 표현 선택이 얼마나 반영되었는지가 중요한 분석 기준이다.","AI 도구를 사용하는 모든 사람에게 동일한 권리를 주면 투입된 인간적 기여가 매우 적은 결과까지 독점될 수 있다.","반대로 AI 활용을 이유로 인간의 편집·선택·배열까지 무조건 보호하지 않으면 창작 활동을 위축할 수 있다.","학습데이터의 적법성·기존 저작물과의 유사성·결과물의 권리 귀속은 구분해서 판단해야 한다.","정당화하려는 권리가 누구의 어떤 기여에 대응하는지 먼저 정의해야 결론이 선명해진다."],"followupAnswer":"단순한 프롬프트 지시와 결과물의 실질적인 선택·배열·수정은 같다고 보기 어렵다. 인간의 창작적 기여가 구체적으로 드러나는 부분을 중심으로 권리 보호를 논의할 수 있다."},{"id":110,"title":"자율주행차와 유령정체","page":86,"vol":2,"chapter":"지식·정보정책","question":"완전자율주행 중 사고가 나면 운전자는 누구로 보아야 할까?","focus":"운행 통제력·제조사·소유자·보험의 관계.","viewA":"실제 통제자에게 책임을 배분하면 예방 유인이 선다.","viewB":"피해자는 복잡한 기술적 과실을 입증하기 어렵다.","followup":"제조사 책임을 강화하면 개발 유인이 줄어들까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["자율주행 사고는 소프트웨어·센서·도로환경·차량 관리·운전자 개입 여부 등 여러 원인이 결합할 수 있다.","실제 주행 통제권이 시스템에 있는지, 사람이 인수할 수 있는 상태였는지에 따라 책임 배분이 달라진다.","피해자가 제품 결함과 인과관계에 필요한 기록을 확보하기 어려워 정보 비대칭이 크다.","사고 기록 보존, 기술적 감정, 제조사 자료제출, 보험을 결합해야 피해 구제가 가능해진다.","제조사에 무조건 전부 책임을 지우거나 운전자에게 무조건 책임을 전가하는 답은 모두 위험하다."],"followupAnswer":"제조사 책임 강화가 개발 비용을 높일 수 있지만 안전 투자 유인도 만들 수 있다. 통제력과 사고 원인에 맞춰 책임을 나누고 보험·증거 확보 장치를 갖추는 것이 중요하다."},{"id":111,"title":"4차 산업혁명","page":92,"vol":2,"chapter":"지식·정보정책","question":"4차 산업혁명으로 사라질 일자리는 국가가 보호해야 할까?","focus":"생산성 향상·전환 비용·교육·사회보장.","viewA":"기술 도입은 새로운 산업과 편익을 창출한다.","viewB":"전환기 실업과 격차의 비용이 특정 집단에 집중된다.","followup":"직업 보호보다 재교육·소득보장을 택하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["4차 산업혁명은 자동화·데이터·연결 기술로 생산방식과 노동수요가 변하는 과정으로 논의된다.","기술 도입이 일자리 총량을 반드시 줄이는지보다 직업별 전환 속도와 피해 분포가 중요하다.","일부 노동자에게 발생한 소득 손실이 장기간 지속될 수 있으므로 단순한 성장 기대만으로 대응이 부족하다.","재교육만 제공해도 실제 채용 수요가 없다면 전직이 어렵기 때문에 일자리 연결과 소득보장이 필요하다.","기술 자체를 금지할지보다 전환기에 비용을 누가 부담하고 어떻게 분담할지 질문하는 것이 실질적이다."],"followupAnswer":"기존 직무를 영구적으로 유지하기보다 노동자의 역량 전환과 생활안정을 지원하는 편이 지속가능할 수 있다. 다만 취약계층의 전환 기간과 지역별 격차를 고려해야 한다."},{"id":112,"title":"개인정보 데이터 활용","page":99,"vol":2,"chapter":"지식·정보정책","question":"공익 목적이라면 개인정보를 폭넓게 활용해도 될까?","focus":"데이터 유용성·동의·프라이버시·비식별화.","viewA":"의료·교통 등 연구와 서비스 개선에 기여한다.","viewB":"재식별·목적 외 이용·정보 권력 집중 위험.","followup":"동의 없이 익명화했다고 주장하는 데이터는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["개인정보 데이터 활용은 연구·서비스 혁신의 가치와 정보주체의 통제·프라이버시를 함께 다룬다.","가명처리·익명처리에도 다른 데이터와 결합하면 개인이 재식별될 위험이 남을 수 있다.","동의가 형식적 클릭으로 이뤄지는 경우 정보주체가 활용 범위와 위험을 실제로 이해했는지 의문이다.","정보 최소 수집, 목적 제한, 접근기록, 독립적 감사와 사고 책임은 보호 장치가 될 수 있다.","정책에서는 연구 필요성, 개인을 다시 식별할 가능성, 동의 획득의 현실적 비용을 구분해 판단한다."],"followupAnswer":"익명화를 주장한다는 사실만으로 무제한 이용을 허용해서는 안 된다. 재식별 위험과 목적 변경 가능성을 평가하고 필요한 경우 추가 보호조치와 감독을 요구해야 한다."},{"id":113,"title":"보편복지와 선별복지","page":103,"vol":2,"chapter":"복지정책","question":"복지는 모두에게 주는 것이 공정한가, 필요한 사람에게만 주는 것이 공정한가?","focus":"보편성·선별성·행정비용·낙인.","viewA":"보편복지는 낙인을 줄이고 정치적 지지를 확보한다.","viewB":"선별복지는 한정된 재원을 취약층에 집중한다.","followup":"선별 과정의 누락·행정비용이 크다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["보편복지는 자격요건을 단순하게 해 누구나 혜택을 받고, 선별복지는 자원이 더 필요한 사람에게 집중한다.","보편 지급은 낙인과 행정적 누락을 줄일 수 있지만 재정이 분산될 수 있다.","선별 지급은 대상자 식별이 정확해야 효과적이며 기준 근처의 불공평과 사각지대가 생길 수 있다.","현금·서비스의 종류와 행정비용, 정치적 지속가능성에 따라 적절한 방식이 달라진다.","의료·교육처럼 공통적인 기반을 보편 제공하면서 추가 지원은 선별하는 혼합 접근도 가능하다."],"followupAnswer":"선별의 누락과 심사 비용이 크다면 보편 지급이 더 효과적일 수 있다. 다만 재정 여력을 고려해 보편적 최소 보장과 취약층 추가 지원을 결합할 수 있다."},{"id":114,"title":"기본소득","page":108,"vol":2,"chapter":"복지정책","question":"모든 국민에게 조건 없이 현금을 지급해야 할까?","focus":"노동유인·빈곤 예방·재정 지속 가능성.","viewA":"단순하고 낙인이 없는 최소 소득 안전망이다.","viewB":"재정 부담과 기존 서비스 대체 우려가 있다.","followup":"현금 대신 주거·의료 등 현물 지원이 더 효과적일까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["기본소득은 근로 여부나 소득 조건에 크게 의존하지 않고 일정 금액을 반복 지급하는 제도로 논의된다.","복지 신청 절차와 낙인을 줄일 수 있지만 모두에게 충분한 금액을 주려면 큰 재원이 필요하다.","낮은 금액의 보편 지급이 취약층의 의료·주거 같은 실제 필요를 충족하지 못할 수 있다.","기존 급여를 대체할지 추가할지에 따라 재정 규모와 분배효과가 크게 달라진다.","노동 유인과 소비·빈곤 효과는 추상적 기대가 아닌 구체적 제도 설계에 따라 평가해야 한다."],"followupAnswer":"현금은 수급자의 선택권을 높이지만 의료·돌봄처럼 시장 이용만으로 해결하기 어려운 서비스도 있다. 보편적 현금 지원을 하더라도 핵심 공공서비스는 별도로 유지해야 한다."},{"id":115,"title":"저출산: 출산장려금, 증여세","page":114,"vol":2,"chapter":"복지정책","question":"출산 장려를 위해 현금 지원과 세제 혜택을 확대해야 할까?","focus":"출산 결정 요인·재정 효율·선택의 자유.","viewA":"양육 초기의 경제 부담을 줄일 수 있다.","viewB":"주거·돌봄·노동 여건 개선 없이 효과가 제한적일 수 있다.","followup":"지원이 출산 시점만 바꿀 가능성은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["출산장려정책의 성과는 출생아 수의 단기 증가뿐 아니라 장기적 양육 여건과 개인의 자유를 함께 봐야 한다.","현금·세금 지원은 출산 초기 비용을 줄일 수 있으나 주거·고용·돌봄의 구조적 부담을 모두 해결하지 못한다.","고소득층이 더 큰 공제를 받는 설계라면 정책의 형평 문제가 제기될 수 있다.","출산 장려가 여성의 노동·경력 선택에 불이익을 주지 않도록 직장과 가족 제도를 함께 바꿔야 한다.","결혼·출산을 선택하지 않는 사람의 삶을 열등하게 취급하지 않는 정책 언어도 중요하다."],"followupAnswer":"출산의 시점만 앞당겼다면 총출산의 증가로 평가하기 어렵다. 장기간의 출생 추세와 돌봄·주거 비용 변화를 확인해 정책의 실질 효과를 평가해야 한다."},{"id":116,"title":"고령화와 노인문제","page":121,"vol":2,"chapter":"복지정책","question":"고령화에 대응해 정년과 복지를 어떻게 개편할까?","focus":"노동시장·건강 격차·세대 간 형평.","viewA":"고령자의 참여는 노동력 부족을 완화한다.","viewB":"일률적 연장은 청년 진입·직무 재배치를 어렵게 할 수 있다.","followup":"직무 특성별 탄력적 정년을 허용할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["고령화는 연금·의료 비용뿐 아니라 노동시장과 지역사회 돌봄 구조를 바꾸는 과정이다.","고령자의 건강·직무 능력이 크게 다른데 일률적 정년만을 기준으로 하면 자원 활용이 비효율적일 수 있다.","정년 연장은 숙련 인력 유지에 도움이 될 수 있지만 청년 진입과 임금체계에 영향을 줄 수 있다.","건강 격차를 고려한 직무 조정·재교육·단시간 근무·돌봄 지원 등이 함께 필요하다.","문제 해결을 노인 대 청년의 이익 충돌로만 그리지 말고 세대 간 생산성과 부담 구조를 살펴야 한다."],"followupAnswer":"직무별 능력과 건강에 맞춘 탄력적 고용이 가능하다. 연장 과정에서 불리해지는 집단의 전환 지원과 임금체계 개선을 병행해야 한다."},{"id":117,"title":"국민연금","page":126,"vol":2,"chapter":"복지정책","question":"국민연금의 지속가능성을 위해 누구의 부담을 늘려야 할까?","focus":"세대 간 형평·소득보장·보험료율·기금.","viewA":"노후 빈곤 예방이라는 사회보험 목적이 크다.","viewB":"미래 세대의 납부 부담이 커질 수 있다.","followup":"급여와 보험료를 함께 조정하는 기준은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["국민연금 개혁은 노후 소득보장과 재정 지속가능성을 동시에 만족시키려는 장기적인 제도 변경이다.","보험료 인상·급여 조정·수급연령 변화는 세대와 소득계층별로 다른 영향을 준다.","기금의 단기 수익률만으로 장기적인 부양 구조 문제를 해결할 수 있다고 단정할 수 없다.","현 세대가 높은 급여를 받고 비용을 미래 세대에 넘기는 구조인지 공정성 관점에서 검토해야 한다.","개혁의 예측 가능성을 위해 변경 시점·경과조치·취약계층 보완을 명확히 해야 한다."],"followupAnswer":"보험료와 급여를 함께 조정한다면 소득보장의 최소 수준을 먼저 확보하고 세대별 기대 부담을 공개해야 한다. 급격한 변경으로 특정 연령 집단만 큰 손해를 보지 않도록 단계적으로 시행할 수 있다."},{"id":118,"title":"건강보험: 외국인 의무가입","page":132,"vol":2,"chapter":"복지정책","question":"외국인의 건강보험 가입을 의무화해야 할까?","focus":"위험 분산·재정 건전성·형평.","viewA":"동일한 의료보장·보험료 부담 체계를 만들 수 있다.","viewB":"단기 체류·소득 수준에 따른 부담 문제가 있다.","followup":"체류 기간과 보험료 기준을 어떻게 정할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["건강보험 외국인 의무가입은 사회보험의 위험 분산을 넓히는 한편 체류·소득 차이에 따른 형평을 다룬다.","단기 치료 목적 방문과 장기 거주·근로자의 보험 이용은 동일한 상황이 아닐 수 있다.","동일한 자격 조건을 적용하더라도 해외 소득 파악이나 가입 전 과거 병력 문제 등 행정상 한계가 있다.","일방적인 혜택 논리 대신 보험료 납부와 급여 이용의 구조를 함께 평가해야 한다.","체류 기간, 가족관계, 다른 의료보장 가입 여부에 따른 예외 기준이 쟁점이 된다."],"followupAnswer":"장기 체류자의 보험 가입은 의료 안전망과 위험 분산에 기여할 수 있다. 다만 단기 체류자 등은 실제 이용·납부 구조에 맞춰 분명한 예외와 절차를 마련하는 것이 필요하다."},{"id":119,"title":"ESG 경영","page":136,"vol":2,"chapter":"기업·노동정책","question":"기업의 ESG 공시와 경영을 의무화할 필요가 있나?","focus":"장기 위험 관리·기업 자율·측정의 신뢰성.","viewA":"환경·사회적 비용을 경영 의사결정에 반영한다.","viewB":"형식적 공시·그린워싱과 행정 부담이 증가한다.","followup":"검증되지 않은 ESG 지표에 제재를 부과할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["ESG는 기업의 환경·사회·지배구조 관련 위험과 책임을 경영·공시에서 다루는 접근이다.","지표가 명확하지 않으면 기업이 실질적 개선보다 점수나 홍보를 최적화하는 문제가 생긴다.","규모가 작은 기업에 대기업과 동일한 보고·검증 의무를 부과하면 부담이 불균형할 수 있다.","중요한 위험의 선택, 외부 검증, 비교 가능한 공시 기준, 이해관계자 책임을 구분해야 한다.","법적 의무화와 시장 자율 규율의 적절한 조합을 산업별로 살펴볼 수 있다."],"followupAnswer":"검증되지 않은 지표만으로 강한 제재를 부과하는 것은 신중해야 한다. 보고 기준과 검증 절차를 먼저 명확히 하고 허위·기만적 공시에 대해 책임을 묻는 방향이 바람직하다."},{"id":120,"title":"기업집단법","page":140,"vol":2,"chapter":"기업·노동정책","question":"기업집단에 대한 별도 규제는 필요한가?","focus":"대기업집단의 경제력 집중·지배구조·효율.","viewA":"계열사 간 부당 지원과 소수주주 피해를 줄인다.","viewB":"기업구조에 대한 획일 규제가 효율을 해칠 수 있다.","followup":"실질적 지배력 중심으로 규율하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["기업집단 규제는 계열사를 통한 지배력 행사와 자본·거래의 집중에 대한 통제를 다룬다.","대기업집단 내부거래가 효율적인 협업일 수도 있지만 부당한 지원이나 소수주주 피해로 이어질 수도 있다.","실질 지배력과 관련 거래의 조건을 확인하지 않고 기업 규모만으로 일률 규제하면 과도할 수 있다.","부당한 이익 이전, 경영진 책임, 이해충돌, 주주의 정보 접근이 중요한 판단 요소다.","경쟁·공시·이해충돌 통제를 결합하면 시장 효율을 보존하면서 불공정행위를 겨냥할 수 있다."],"followupAnswer":"형식적인 지분율이 아니라 실제 통제력과 거래의 불공정성을 중심으로 규제하는 것이 합리적이다. 다만 심사의 기준과 증거를 공개해 법적 안정성을 확보해야 한다."},{"id":121,"title":"상속세 폐지","page":144,"vol":2,"chapter":"기업·노동정책","question":"상속세를 폐지하거나 대폭 완화해야 할까?","focus":"부의 세대 이전·이중과세 논란·기회균등.","viewA":"기업승계와 납세 부담을 완화할 수 있다.","viewB":"세습 부의 집중과 기회 불평등이 심화될 수 있다.","followup":"자본이득 과세 등 대체 재원을 마련하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["상속세는 개인의 재산 처분 자유, 세대 간 부의 집중, 납세 능력 사이의 조세정책 문제다.","기업 지분처럼 현금화가 어려운 자산을 상속할 때 세금 납부가 경영과 고용에 미치는 영향을 고려할 수 있다.","반면 높은 자산 보유가 세대를 통해 누적될 때 새로운 세대의 기회 격차가 확대될 수 있다.","소득세와 상속세의 과세 대상 및 시점이 달라 이중과세 논쟁은 세부 구조를 따져야 한다.","세율 조정 외에 분납·공제·자본이득 과세·세원 포착 개선 등 대안을 비교할 수 있다."],"followupAnswer":"다른 방식으로 자본이득을 적정하게 과세하고 기회균등 재원을 확보한다면 상속세 조정의 근거가 커진다. 다만 세제 전환이 실제로 부의 집중을 심화시키지 않는지 평가해야 한다."},{"id":122,"title":"가업상속공제 확대","page":148,"vol":2,"chapter":"기업·노동정책","question":"가업승계에 세금 혜택을 크게 주어야 할까?","focus":"기업 지속성·고용·조세 형평.","viewA":"승계 과정의 급격한 자산 매각을 줄일 수 있다.","viewB":"일부 자산가에게 특혜가 집중될 수 있다.","followup":"고용·사업 유지 조건을 엄격히 두면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["가업상속공제는 기업의 승계 과정에서 세금 부담이 투자·고용에 미치는 영향을 완화하려는 예외다.","승계 기업의 사업 유지와 고용 안정이 실제로 보호돼야 공제의 공익적 이유가 성립한다.","기업 자산을 단순히 개인 부의 이전수단으로 이용하는 경우까지 넓게 허용하면 조세 특혜 문제가 생긴다.","기업 규모·업력·사업 유지 기간·고용 조건·사후 추징 기준을 어떻게 설계할지 살펴야 한다.","특혜가 필요한 상황과 세 부담의 납부 시기를 조정하면 해결되는 상황을 구별할 수 있다."],"followupAnswer":"고용·사업 유지 조건이 실질적이고 위반 시 추징이 가능하다면 공제 정당성이 높아질 수 있다. 그러나 공제의 규모와 적용 대상에 대한 형평성 심사는 남는다."},{"id":123,"title":"광고 규제","page":152,"vol":2,"chapter":"기업·노동정책","question":"기업 광고 표현은 어디까지 규제해야 할까?","focus":"소비자 오인·상업적 표현·검증 가능성.","viewA":"허위·기만적 광고로 인한 정보 비대칭을 줄인다.","viewB":"모호한 규제로 정당한 기업 홍보가 위축된다.","followup":"풍자·과장 광고와 허위 사실의 경계는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["광고 규제는 소비자가 상품·서비스를 올바르게 비교할 수 있도록 정보 왜곡을 방지하는 제도다.","객관적으로 확인 가능한 효능·가격 주장과 주관적 수사·과장은 구분할 필요가 있다.","중요한 조건을 작게 숨기거나 소비자가 오해하기 쉽게 배치하는 것도 실질적 오인을 만들 수 있다.","과도한 규제는 정당한 경쟁과 표현을 위축하므로 피해 위험에 비례한 제재가 필요하다.","광고 주장에 대한 검증 가능성, 소비자 오인 가능성, 시정명령·환불 같은 대안을 고려한다."],"followupAnswer":"풍자와 명백한 과장은 평균적 소비자가 사실로 받아들일 가능성을 기준으로 구별할 수 있다. 객관적 효능을 사실처럼 표시한 경우에는 검증 책임을 더 무겁게 물을 수 있다."},{"id":124,"title":"다크패턴 마케팅","page":158,"vol":2,"chapter":"기업·노동정책","question":"구매를 유도하는 다크패턴은 어디까지 금지해야 할까?","focus":"소비자 자율성·설계의 기만성·선택비용.","viewA":"숨겨진 비용·어려운 해지를 막아 실질 선택권을 높인다.","viewB":"사용자 경험 설계 전반에 과도한 제재가 될 수 있다.","followup":"해지는 가입만큼 쉬워야 하는가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["다크패턴은 이용자의 주의를 흩뜨리거나 선택 절차를 조작해 원치 않는 결정을 유도하는 설계 방식이다.","사전에 선택된 유료 옵션, 지나치게 복잡한 해지, 비용의 후반 공개 등은 선택권을 형식적으로만 남길 수 있다.","모든 설득적 디자인을 금지하는 것은 광고·서비스 경쟁을 과도하게 제한할 위험이 있다.","핵심은 선택 정보의 투명성, 취소의 실질적 가능성, 기만 의도의 객관적 징표다.","시장 자율 규칙과 분명한 금지 유형을 병행하면 예측 가능성을 높일 수 있다."],"followupAnswer":"가입에 비해 해지를 부당하게 어렵게 만드는 설계는 규제 근거가 강하다. 다만 사기 방지·본인확인 등 정당한 추가 절차는 예외를 인정할 수 있다."},{"id":125,"title":"민영화","page":161,"vol":2,"chapter":"기업·노동정책","question":"공공서비스를 민영화하면 품질이 좋아질까?","focus":"경쟁 효율·보편적 접근·공공 책임.","viewA":"민간 투자와 혁신으로 효율이 개선될 수 있다.","viewB":"독점적 필수서비스는 가격 상승·접근성 악화 위험.","followup":"경쟁이 성립하지 않는 수도·철도는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["민영화는 서비스의 소유·운영·투자 책임을 공공에서 민간으로 옮기거나 경쟁을 도입하는 여러 방식을 포함한다.","경쟁이 가능한 분야에서는 혁신과 비용 절감이 기대되지만 필수서비스 독점에서는 이용자 권익이 약화될 수 있다.","요금 인상과 품질 저하를 막기 위한 공공 규제 및 보편서비스 의무가 필수적일 수 있다.","서비스 공급이 중단될 때 국가의 최종 책임을 어느 수준으로 유지할지 정해야 한다.","소유권 매각 외에도 성과계약·민간 위탁·독립 규제 등 다양한 중간 방안이 있다."],"followupAnswer":"수도·철도처럼 자연독점이나 필수성이 강한 분야에는 단순한 경쟁 논리가 적용되기 어렵다. 민간 운영을 허용하더라도 가격·품질·접근성에 대한 강한 공적 통제가 필요하다."},{"id":126,"title":"최저임금제","page":167,"vol":2,"chapter":"기업·노동정책","question":"최저임금 수준을 높이면 저소득층 삶이 나아질까?","focus":"생활임금·고용 효과·기업 부담·물가.","viewA":"근로빈곤 완화와 임금 하한 보장이 가능하다.","viewB":"영세사업장 고용·가격에 부담이 될 수 있다.","followup":"업종·지역별 차등 적용은 정당할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["최저임금은 일할 때 받는 보수의 하한을 정해 노동자의 기본 생활을 보호하려는 정책 수단이다.","인상 효과는 노동 수요·사업체 규모·지역 물가·가격 전가 능력에 따라 달라질 수 있다.","임금 인상이 근로빈곤을 줄일 수 있으나 노동시간 감소나 고용조정이 생길 가능성도 따져야 한다.","적용을 차등하면 현실적 부담을 반영할 수 있지만 동일 노동자의 법적 보호 수준 차이가 생긴다.","최저임금과 근로장려·사회보험·중소사업자 지원의 역할을 나눠 보면 대안 설계가 풍부해진다."],"followupAnswer":"업종·지역 차이를 반영할 여지는 있지만 동일한 근로 보호를 훼손할 위험이 있다. 충분한 근거와 명확한 기준이 있을 때 한정적으로 검토하고 최소 생활 보장의 목적을 지켜야 한다."},{"id":127,"title":"중대재해처벌법","page":173,"vol":2,"chapter":"기업·노동정책","question":"중대산업재해에 대해 경영책임자를 강하게 처벌해야 할까?","focus":"산업안전 예방·귀책·명확성·실효성.","viewA":"경영진에게 예방 투자 유인을 부여한다.","viewB":"추상적 의무와 결과 책임을 혼동하면 불명확해진다.","followup":"안전조치에 최선을 다했는데 사고가 났다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["중대재해 대응의 중심은 사고 후 제재뿐 아니라 경영 차원의 안전 투자와 위험 예방 체계를 만드는 것이다.","책임을 물으려면 안전보건 의무의 내용, 실제 위반 여부, 예방 가능성, 인과관계를 분리해 판단해야 한다.","사고라는 결과만으로 모든 경영자가 같은 수준의 고의·과실을 가진다고 볼 수 없다.","현장 근로자는 위험 정보를 보고하거나 거부할 수 있어야 하며 하청·원청의 통제력 차이도 중요하다.","예방 지침의 명확성, 감독 인력, 문서·자료 확보는 형벌 못지않게 중요하다."],"followupAnswer":"실질적인 안전 조치를 다했는데도 예측하기 어려운 사고가 났다면 형사책임을 기계적으로 인정해서는 안 된다. 다만 조치의 적정성은 독립적 자료로 검증할 필요가 있다."},{"id":128,"title":"리콜","page":177,"vol":2,"chapter":"소비자정책","question":"결함 제품의 리콜을 기업 자율에 맡겨도 될까?","focus":"소비자 안전·정보 비대칭·리콜 비용.","viewA":"기업의 조기 자진 신고와 신뢰 회복을 유도한다.","viewB":"기업이 피해 위험을 축소해 신고할 유인이 있다.","followup":"확실한 결함이 아니지만 위험이 의심된다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["리콜은 소비자 안전에 결함이 있는 제품을 회수·수리·교환하거나 위험을 알리는 조치다.","기업은 결함 정보를 먼저 보유하기 때문에 문제가 확인돼도 공개를 늦출 유인이 있을 수 있다.","소비자 피해의 심각성과 발생 확률을 모두 평가하고 불확실성이 큰 경우 예방 조치의 기준을 정해야 한다.","자진 신고를 장려하는 제도와 은폐에 대한 제재를 함께 두면 정보 공개 유인을 높일 수 있다.","리콜 외에 사용 중지 안내, 부품 교체, 추가 검사 등의 단계적 대안도 검토할 수 있다."],"followupAnswer":"결함이 확정되지 않았어도 예상되는 피해가 중대하고 회복 불가능하다면 잠정적인 사용중지·정보 공개가 필요할 수 있다. 확정 조사에 따라 조치를 조정하면 된다."},{"id":129,"title":"제조물 책임","page":184,"vol":2,"chapter":"소비자정책","question":"제품 결함 피해자는 어떤 사실까지 입증해야 할까?","focus":"기술적 원인·정보 편재·제조물 책임.","viewA":"제조사가 안전성 자료를 더 잘 보유한다.","viewB":"과도한 책임 추정은 혁신·보험비용에 영향을 준다.","followup":"복합 원인과 자료 부재를 어떻게 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["제조물 책임에서는 결함의 존재, 손해, 결함과 손해 사이의 인과관계를 분리해 검토해야 한다.","복잡한 제품은 제조사가 설계·시험 자료를 대부분 보유해 소비자가 기술적 원인을 입증하기 어렵다.","입증 부담 완화를 논할 때 모든 원인을 제조사 탓으로 돌리는 것과 자료 접근 불균형을 시정하는 것을 구분해야 한다.","피해자의 사용 방식, 외부 환경, 원재료와 제조 과정 등 복합 원인을 동시에 검토해야 한다.","자료제출, 감정, 사고 재현, 정황증거 평가 등을 조합해 사실 인정을 정교화할 수 있다."],"followupAnswer":"복합 원인은 실제로 여러 원인이 손해에 기여한 경우이고 자료 부재는 원인을 판단할 정보가 부족한 상황이다. 둘을 혼동하지 말고 자료 확보를 우선하며 불확실성이 누구의 지배 영역에서 생겼는지 살펴야 한다."},{"id":130,"title":"징벌적 손해배상","page":192,"vol":2,"chapter":"소비자정책","question":"실제 피해액보다 큰 손해배상을 허용해야 할까?","focus":"손해의 전보·예방 억제·비례성.","viewA":"고의적 불법행위의 이익을 제거할 수 있다.","viewB":"예측 가능성·과도한 제재 문제가 있다.","followup":"형사처벌과 중복 제재라면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["징벌적 손해배상은 실제 손해의 회복을 넘어 고의적·악의적 위반을 억제하려는 추가적 금전 책임이다.","소액 피해가 다수에게 발생하고 위반으로 얻는 이익이 큰 경우 일반 손해배상만으로 억지력이 약할 수 있다.","그러나 과도한 배상은 혁신과 정상적 위험 부담을 위축시키거나 책임 예측을 어렵게 한다.","고의성, 반복성, 은폐 정도, 피해액과 위반 이익을 정교한 기준으로 삼을 필요가 있다.","피해 구제의 목적과 공적 형벌의 목적이 어느 부분에서 중첩되는지 검토한다."],"followupAnswer":"형사처벌과 징벌배상이 함께 적용되면 전체 제재의 비례성을 살펴야 한다. 다만 서로의 목적과 대상이 다를 수 있으므로 일률적인 중복 금지도 적절하지 않다."},{"id":131,"title":"집단소송제","page":198,"vol":2,"chapter":"소비자정책","question":"소액 피해자가 집단으로 소송할 수 있게 해야 할까?","focus":"권리구제 접근성·사법 효율·남소 방지.","viewA":"개별 소송이 어려운 분산된 피해를 구제한다.","viewB":"소송 남발과 거액 합의 압박 우려가 있다.","followup":"판결 효력을 집단 전체에 미치게 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["집단소송은 개인당 손해가 작아 소송비용을 감당하기 어려운 다수 피해자에게 공동 구제 수단을 제공한다.","불법행위자에게 작은 피해를 반복해 얻는 이익이 있다면 개별 소송만으로는 억지력이 낮을 수 있다.","집단 범위, 대표자 적격, 피해자 통지, 화해·판결의 효력을 명확히 해야 한다.","거액 합의 압박이나 근거 없는 소송 남발을 막을 절차적 통제도 필요하다.","개별 피해 정도가 크게 다르면 공통 쟁점 판단과 개인별 손해 산정을 나누는 방식이 가능하다."],"followupAnswer":"일정한 공통 쟁점에 대해서는 집단적 효력을 인정할 수 있다. 다만 개인에게 불리한 결과가 예상되는 경우 통지·탈퇴·이의 절차를 충분히 보장해야 한다."},{"id":132,"title":"자연관","page":204,"vol":2,"chapter":"환경정책","question":"자연은 인간의 이익을 위해서만 보호할 가치가 있나?","focus":"인간중심주의·생태중심주의·세대 간 책임.","viewA":"인간의 삶과 건강 보호를 우선할 수 있다.","viewB":"생태계 자체의 고유한 가치도 고려할 수 있다.","followup":"인간에게 당장 이익이 없는 생태계를 보존할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["인간중심주의는 자연 보호의 근거를 인간의 건강·복리에 두고, 생태중심주의는 생태계 자체의 가치를 강조한다.","가까운 인간적 이익이 보이지 않는 종도 생태계의 복잡한 연결 속에서 중요한 기능을 가질 수 있다.","자연의 고유한 가치를 인정해도 사회가 감당할 보전 비용과 다른 권리와의 충돌을 고려해야 한다.","보전 불가역성, 대체 가능성, 세대 간 영향은 현재의 시장가격만으로 설명하기 어렵다.","보전 우선지역을 정할 때 과학적 불확실성과 미래 이용 가능성도 반영할 수 있다."],"followupAnswer":"당장 인간에게 이익이 확인되지 않아도 회복하기 어려운 생태계라면 보전의 근거가 있을 수 있다. 다만 다른 공익과 충돌하면 최소한의 훼손과 대체 방안을 검토해야 한다."},{"id":133,"title":"온실가스배출권 거래제도","page":210,"vol":2,"chapter":"환경정책","question":"온실가스 배출권을 사고파는 제도가 공정한가?","focus":"배출 총량·시장 가격 신호·배분 형평.","viewA":"감축 비용이 낮은 곳부터 줄여 효율적일 수 있다.","viewB":"무상할당과 가격 변동이 기업별 특혜를 만들 수 있다.","followup":"배출권 시장과 탄소세를 어떻게 비교할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["배출권 거래제는 온실가스 총배출량을 제한하고 기업이 할당된 배출권을 거래하도록 하는 정책이다.","배출 감축 비용이 낮은 기업이 먼저 줄이고 남는 배출권을 판매하면 전체 감축 비용이 내려갈 수 있다.","무상할당 기준이 불공평하거나 배출권 가격이 불안정하면 감축 유인이 왜곡될 수 있다.","상한의 강도, 시장 감시, 할당 방식, 배출량 측정의 신뢰성을 분리해 검토해야 한다.","탄소세는 가격을 직접 정하고 배출권제는 총량을 우선 정한다는 차이를 설명하면 비교가 쉬워진다."],"followupAnswer":"배출권거래제는 총배출량을 미리 제한하는 대신 시장가격이 변동하고, 탄소세는 탄소 가격을 정하지만 실제 감축량이 불확실할 수 있다. 산업구조, 가격 변동성, 행정 역량, 취약계층 부담을 비교해 선택하거나 결합할 수 있다."},{"id":134,"title":"환경문제의 해결방안","page":218,"vol":2,"chapter":"환경정책","question":"환경오염 문제는 규제와 시장 유인 중 무엇으로 풀까?","focus":"외부효과·예방원칙·감시·오염자 부담.","viewA":"명확한 기준·제재는 심각한 오염을 통제한다.","viewB":"경제적 유인은 저비용 감축과 혁신을 촉진한다.","followup":"오염 피해를 돈으로 환산할 수 없다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["환경정책은 오염을 제3자에게 떠넘기는 외부효과를 내부화하는 방법을 찾는 데서 출발한다.","직접 규제는 위험한 행위를 제한하기 쉽지만 기업별 감축 비용의 차이를 반영하기 어려울 수 있다.","세금·배출권 등 가격 유인은 비용이 낮은 곳부터 감축을 유도할 수 있지만 피해의 임계점을 놓칠 위험이 있다.","오염원 식별과 피해의 인과관계, 모니터링의 정확성이 낮으면 어떤 제도도 실효성이 떨어진다.","위험이 중대하고 회복이 어려운 경우 최소 안전기준을 두고 초과 감축에는 시장 유인을 활용할 수 있다."],"followupAnswer":"금전 환산이 어렵고 회복 불가능한 피해에는 엄격한 기준이나 금지가 필요할 수 있다. 측정 가능한 범위에서만 시장 유인으로 보완하는 것이 적절하다."},{"id":135,"title":"아마존 파괴와 해결방안","page":225,"vol":2,"chapter":"환경정책","question":"아마존 산림 파괴에 국제사회가 개입할 수 있을까?","focus":"생물다양성·기후 공공재·국가 주권.","viewA":"지구적 환경 편익에 따른 공동 책임이 있다.","viewB":"현지 주민의 개발권·주권이 간과될 수 있다.","followup":"선진국이 보전 비용을 보상해야 하는가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["아마존 산림은 특정 국가의 영토 안에 있지만 탄소흡수·생물다양성 등 국경을 넘는 가치를 가진다.","외부 국가가 보전을 요구한다면 현지 주민과 국가가 포기하는 개발 기회도 고려해야 한다.","원주민의 토지 이용과 전통지식이 보전 전략에서 배제되면 정책의 정당성과 실효성이 약해진다.","산림벌채의 원인이 농업·광업·인프라 등 복합적이므로 단순 비난보다 경제적 유인을 조정해야 한다.","국제기금·기술 지원·지속가능한 생산에 대한 보상을 결합하는 협력 모델이 가능하다."],"followupAnswer":"가능하다. 보전의 지구적 혜택을 얻는 국가들도 비용을 분담해야 한다. 다만 보상이 현지 주민에게 공정하게 전달되고 산림 보호 성과가 검증되어야 한다."},{"id":136,"title":"NDC 상향과 탄소국경세","page":230,"vol":2,"chapter":"환경정책","question":"국가의 탄소 감축목표를 높이고 수입품에 탄소 비용을 부과해야 할까?","focus":"기후책임·산업경쟁력·무역 공정성.","viewA":"탄소 누출을 막고 감축 유인을 강화한다.","viewB":"개도국과 에너지 다소비 산업에 부담이 집중된다.","followup":"상대국이 환경규제보다 무역장벽이라고 반발하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["국가 온실가스 감축목표(NDC)는 국제적으로 약속한 감축 의지와 국내 에너지·산업 전환 계획을 연결한다.","탄소국경세 성격의 수입품 조정은 탄소 비용이 낮은 지역으로 생산이 이전되는 문제를 완화하려는 취지다.","하지만 실제 탄소량 측정이 부정확하면 무역 장벽으로 작동하고 개도국에 불공평한 부담을 줄 수 있다.","국내외 생산자에게 같은 기준을 적용하는지, 탄소량 산정과 예외가 투명한지 검토해야 한다.","산업 보조·기술 전환 지원과 함께 시행해야 환경 목표와 경제적 충격을 조정할 수 있다."],"followupAnswer":"상대국의 무역장벽 우려는 일리가 있으므로 차별 없는 산정 기준과 이의제기 절차가 중요하다. 감축 목적의 실질성과 개도국 지원을 함께 제시해야 한다."},{"id":137,"title":"기후재난의 국가 책임","page":234,"vol":2,"chapter":"환경정책","question":"기후재난의 피해를 국가가 배상해야 할까?","focus":"예견 가능성·보호의무·인과관계·재량.","viewA":"예측된 위험을 방치한 행정의 책임을 물을 수 있다.","viewB":"모든 자연재해를 국가가 통제할 수는 없다.","followup":"예보가 불확실한 상황에서 조치하지 않았다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["기후재난 책임은 국가의 위험 예측·예방·경보·대피 의무와 개별 피해 사이 관계를 따진다.","강한 기후현상이 있었다는 사실만으로 국가가 모든 피해를 예방할 수 있었다고 보기는 어렵다.","반대로 반복 경고와 구체적 위험 정보를 무시했다면 재량의 한계를 문제 삼을 수 있다.","정책 선택의 재량과 개별 시설·대피 명령 등 구체적인 관리의무를 나눠 검토해야 한다.","인과관계 입증에서는 위험 자료, 의사결정 기록, 피해 발생 경로, 대체 조치의 가능성이 중요하다."],"followupAnswer":"예보가 불확실해도 예상 피해가 중대하고 저비용 예방 조치가 가능했다면 아무 조치도 하지 않은 판단은 정당화하기 어려울 수 있다. 다만 당시 합리적으로 알 수 있었던 정보 기준으로 평가해야 한다."},{"id":138,"title":"수도권 매립지 갈등","page":237,"vol":2,"chapter":"환경정책","question":"폐기물 처리시설 부담을 특정 지역에 집중해도 될까?","focus":"지역 형평·필수시설·주민 참여.","viewA":"광역적 효율을 위한 입지가 필요할 수 있다.","viewB":"환경·건강 부담이 특정 주민에게 집중된다.","followup":"주민 보상과 참여 절차로 수용성을 높일 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["폐기물 시설 입지는 사회 전체가 필요로 하는 서비스의 이익과 특정 지역에 집중되는 부담이 충돌한다.","주민이 반대한다는 사실만으로 시설이 불필요해지는 것은 아니지만 주민을 배제한 결정은 정당성이 약하다.","오염 위험 측정, 대안 부지 검토, 지역별 부담 분담과 환경 감시가 필요하다.","경제적 보상은 영향을 줄일 수 있어도 건강·안전 침해를 무조건 매수할 수 있는 수단은 아니다.","입지 단계의 참여권과 운영 중 주민 감시를 포함해야 장기적 신뢰가 생긴다."],"followupAnswer":"보상과 참여 절차는 수용성을 높일 수 있지만 근본적인 안전문제를 대신할 수 없다. 실제 위해를 줄이는 조치를 전제로 공정한 부담배분과 보상체계를 논의해야 한다."},{"id":139,"title":"국립공원 케이블카","page":242,"vol":2,"chapter":"환경정책","question":"국립공원에 케이블카를 설치해야 할까?","focus":"접근권·관광 경제·생태 보전.","viewA":"노약자·장애인의 자연 접근을 확대한다.","viewB":"보전 지역 훼손과 관광 과밀 위험이 있다.","followup":"보호구역 밖 대안 노선이 있다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["국립공원 케이블카는 자연 접근성·관광 수익과 보호구역의 생태적 연속성을 함께 평가해야 한다.","노약자·장애인의 접근권은 중요한 공익이지만 특정 시설 외에 다른 이동·관람 수단도 존재할 수 있다.","공사 시점과 운영 기간의 생태계 훼손, 방문객 집중, 폐기물·소음 증가를 구분해 평가해야 한다.","시설을 설치한 뒤 원상회복이 어렵다면 사전 환경영향 검토의 중요성이 더 커진다.","입지·노선·규모를 최소화하고 보전 비용을 이용 수익에 반영하는 조건부 대안도 가능하다."],"followupAnswer":"보호구역 밖 노선으로 접근성 목적을 달성할 수 있다면 덜 침해적인 대안이 된다. 핵심 보호지역의 손상이 불가역적이라면 설치를 제한하는 쪽이 설득력 있다."},{"id":140,"title":"토지 공개념","page":248,"vol":2,"chapter":"부동산정책","question":"토지 소유권에는 강한 공공적 제한을 둘 수 있는가?","focus":"토지의 사회성·재산권·공공복리.","viewA":"희소한 토지로 생긴 불로소득을 통제할 수 있다.","viewB":"예측 가능성과 정당한 소유권을 침해할 수 있다.","followup":"보상과 공익 기준을 어떻게 정할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["토지는 공급을 인위적으로 늘리기 어렵고 주변 공공 인프라·도시계획이 가치에 큰 영향을 주는 재산이다.","개인의 투자·관리 성과와 사회적 개발로 생긴 지대 상승을 어떤 기준으로 나눌지가 쟁점이다.","공공적 제한이 없으면 투기·난개발 우려가 있지만 지나치면 재산권과 예측 가능성을 침해할 수 있다.","계획의 공개성, 제한의 비례성, 필요 시 보상과 이의제기 절차가 중요하다.","소유권 자체의 부정보다 공적 가치 환수·이용 규제를 어떻게 설계할지가 실질적 논점이다."],"followupAnswer":"공익과 재산권의 균형을 위해 제한의 근거와 범위를 명확히 해야 한다. 소유자가 특별한 희생을 지는 경우 보상의 필요성을 별도로 검토할 수 있다."},{"id":141,"title":"초과이익환수제","page":255,"vol":2,"chapter":"부동산정책","question":"재건축 초과이익을 환수하는 제도는 정당한가?","focus":"개발이익의 귀속·공공기여·재산권.","viewA":"공적 인프라로 생긴 이익을 일부 사회에 환원한다.","viewB":"과도한 부담이 공급·정비사업을 지연시킬 수 있다.","followup":"시장가격 상승분과 개발이익을 어떻게 구분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["재건축 초과이익환수는 토지·건물 가치 상승 중 어떤 부분을 사회에 돌려야 하는지의 문제다.","사업자의 투자·위험 부담에 따른 정당한 수익과 공공 계획·기반시설에 따른 이익을 구별해야 한다.","환수 규모가 과도하면 사업 지연과 주거 공급 감소를 유발할 수 있다.","반대로 공적 조치로 발생한 이익을 모두 개인이 독점하면 토지·주택 자산 격차가 심화될 수 있다.","사업 전후의 가치 평가, 정상 이익 공제, 부담금 납부 시기를 명료하게 설계해야 한다."],"followupAnswer":"시장 전반의 상승과 특정 재건축으로 생긴 추가 이익을 구분하려면 비교 가능한 지역·기간 자료가 필요하다. 추정 불확실성이 크면 소유자에게 과도한 부담이 생기지 않도록 신중히 산정해야 한다."},{"id":142,"title":"종합부동산세","page":258,"vol":2,"chapter":"부동산정책","question":"고가 주택에 대한 보유세를 강화해야 할까?","focus":"자산 불평등·조세 중립·주거 안정.","viewA":"자산 보유 능력에 따른 부담과 투기 억제 목적이 있다.","viewB":"소득이 적은 실거주자에게 유동성 부담이 생긴다.","followup":"1주택 고령자와 다주택 투자자를 달리 취급할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["종합부동산세는 일정 자산 보유에 대한 추가적 조세 부담과 부동산 시장 안정 목적이 논의되는 제도다.","자산 가치는 높아도 현금 소득이 적은 고령 실거주자의 납세 부담은 별도 고려가 필요하다.","다주택자와 실거주 1주택자의 자산 운용 목적은 다를 수 있지만 가격만으로 전부 판단하기 어렵다.","세율·공제·납부 유예를 조합하면 정책 목적과 납세 능력 사이 조정이 가능하다.","보유세 인상이 주택가격에 미치는 효과와 다른 세목과의 상호작용을 분리해 검토해야 한다."],"followupAnswer":"1주택 고령자에게는 거주 지속성과 납세능력을 고려한 유예·분납 등을 검토할 수 있다. 다주택 투자자는 보유 규모와 수익 능력에 따라 차등화할 수 있지만 기준은 명확해야 한다."},{"id":143,"title":"토지공유제와 토지가치공유제","page":264,"vol":2,"chapter":"부동산정책","question":"토지를 개인 소유 대신 공동으로 보유하는 방식은 가능할까?","focus":"토지 가치 공유·사유재산·공공 활용.","viewA":"토지 지대의 사회적 귀속을 확대할 수 있다.","viewB":"관리 비효율과 투자·장기 관리 유인이 약해질 수 있다.","followup":"건물은 사유, 토지는 공공 소유인 모델은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["토지공유제와 토지가치공유제는 토지의 소유권 또는 지대·가치 상승의 수익을 공동체와 나누려는 접근이다.","토지와 건물을 분리하면 주거 접근성을 높일 여지가 있지만 장기 관리·투자 유인이 문제가 될 수 있다.","토지의 공공성이 곧 모든 토지를 국가가 직접 소유해야 한다는 뜻은 아니다.","장기 임대, 지분 공유, 개발이익 환수 등 다양한 제도 모델의 효과를 비교할 수 있다.","소유권 구조만이 아니라 갱신권, 임대료 조정, 주거 안정, 재정 부담을 함께 설계해야 한다."],"followupAnswer":"건물 사유·토지 공공 소유의 혼합 모델도 가능하다. 다만 임대기간과 갱신 조건, 건물 가치 보호가 불명확하면 투자와 거주 안정을 모두 해칠 수 있다."},{"id":144,"title":"부동산 대출 규제","page":271,"vol":2,"chapter":"부동산정책","question":"주택담보대출을 엄격히 제한하면 주거 문제가 해결될까?","focus":"가계부채 안정·주택 접근성·세대 형평.","viewA":"과도한 레버리지와 금융 불안을 억제한다.","viewB":"무주택 실수요자의 매수 기회도 줄어든다.","followup":"차주의 상환능력에 따라 차등 제한하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["부동산 대출 규제는 차주 과도한 부채와 금융시스템 불안을 예방하는 도구로 논의된다.","대출 규제가 강화되면 투기적 레버리지가 줄 수 있지만 현금이 적은 무주택자의 구입 기회도 제한된다.","주택 가격의 상승과 가계 부채 증가가 항상 같은 원인으로 발생하는 것은 아니다.","담보가치뿐 아니라 소득·금리 변화에 따른 상환능력과 차주의 위험을 함께 평가해야 한다.","전면 대출 제한 대신 실수요·고위험 대출 구분, 장기 상환관리 등을 비교할 수 있다."],"followupAnswer":"상환능력에 따른 차등 규제는 일률 제한의 부작용을 줄일 수 있다. 다만 위험을 과소평가하거나 특혜 심사로 변질되지 않도록 객관적 기준이 필요하다."},{"id":145,"title":"영리병원","page":277,"vol":2,"chapter":"의료·보건정책","question":"영리병원 설립을 허용해야 할까?","focus":"의료서비스 경쟁·의료 공공성·소득별 접근.","viewA":"투자·서비스 다양성·효율을 기대할 수 있다.","viewB":"수익성 중심 운영이 필수의료를 약화할 수 있다.","followup":"건강보험과 응급의료 의무를 유지한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["영리병원 논쟁은 의료기관 운영의 자본·이윤 추구와 의료의 공적 성격을 어떻게 조화시킬지의 문제다.","민간 자본은 시설·서비스 투자를 촉진할 수 있지만 수익성이 낮은 필수의료를 외면할 유인이 있다.","환자는 서비스 품질을 완전하게 판단하기 어려워 일반 시장과 다른 정보 비대칭이 존재한다.","의료 접근성을 소득에 따라 지나치게 차등화할 위험을 줄이기 위한 제도적 장치가 필요하다.","소유·운영 방식보다 필수의료 의무, 가격·품질 공개, 공적 감독의 실효성을 평가하는 접근이 가능하다."],"followupAnswer":"건강보험 적용과 응급의료 의무를 유지한다면 일부 위험을 낮출 수 있다. 그러나 실제 이윤 배분과 필수진료 기피를 감독할 수 있는지까지 검토해야 한다."},{"id":146,"title":"원격의료","page":282,"vol":2,"chapter":"의료·보건정책","question":"비대면 진료를 넓게 허용해야 할까?","focus":"의료 접근성·오진 위험·환자 안전.","viewA":"이동이 어려운 환자의 접근성을 개선한다.","viewB":"대면 진찰이 필요한 상황에서 진단의 정확성이 낮아질 수 있다.","followup":"초진·재진·의약품 처방을 구분할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["원격의료는 진단·상담·처방의 일부를 정보통신기술로 수행해 시간·거리의 장벽을 줄일 수 있다.","대면 촉진·검사가 필요한 질환을 화면과 문진만으로 판단하면 중요한 징후를 놓칠 위험이 있다.","재진·경과관리와 초진은 환자 정보의 축적 수준이 다르므로 동일한 조건으로 허용할 이유가 약할 수 있다.","응급상황에서 대면 진료 전환, 개인정보 보호, 책임 귀속, 기록 관리 체계가 중요하다.","원격 접근이 어려운 고령자·디지털 소외계층에 대한 대체 창구도 필요하다."],"followupAnswer":"초진과 고위험 처방에는 대면확인 등 엄격한 조건을 두고 안정적인 만성질환 관리에는 원격서비스를 확대할 수 있다. 안전성과 접근성의 실제 성과를 지속 평가해야 한다."},{"id":147,"title":"담배 규제","page":287,"vol":2,"chapter":"의료·보건정책","question":"흡연을 강하게 규제하는 것이 정당한가?","focus":"개인 자유·공중보건·간접흡연 피해.","viewA":"제3자 피해와 의료비 부담을 줄인다.","viewB":"성인의 자기결정까지 과도하게 제한할 우려.","followup":"실내 금연과 개인적 소지를 달리 취급할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["담배 규제는 흡연자 개인의 건강 선택과 간접흡연·의료비 등 제3자 영향이 함께 존재한다.","미성년자 보호와 실내 공공장소의 간접흡연 방지는 성인의 사적 흡연보다 규제 근거가 강하다.","가격 인상은 소비 억제에 도움이 될 수 있지만 저소득 흡연자의 부담을 가중할 수 있다.","중독성 때문에 선택이 충분히 자유로운지, 금연지원 서비스가 제공되는지 검토할 수 있다.","규제 목표를 건강 보호로 정했다면 금연율·간접피해 감소를 기준으로 성과를 확인해야 한다."],"followupAnswer":"공공장소 흡연은 타인의 건강에 직접 영향을 주므로 강한 제한이 가능하다. 반면 성인의 사적 공간에서의 행위는 제3자 피해가 없는지에 따라 제한 근거가 약해질 수 있다."},{"id":148,"title":"비의료인의 문신시술 금지","page":291,"vol":2,"chapter":"의료·보건정책","question":"의료인이 아닌 사람의 문신 시술을 금지해야 할까?","focus":"신체 자기결정·감염 관리·직업 자유.","viewA":"시술의 보건·감염 위험을 관리할 필요가 있다.","viewB":"의료 면허 독점이 과도하면 합법 시장이 줄어든다.","followup":"별도의 위생 자격·교육제도를 만들면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["문신 시술은 신체 표현의 자유와 감염·위생 관리를 동시에 고려하는 서비스다.","의료행위 여부를 법률적으로 분류하는 문제와 실제 위해를 줄일 최적의 관리 방식을 구별해야 한다.","일률적 의료면허 요구가 안전을 높이는지 또는 불법·음성적 시술을 늘리는지 평가할 필요가 있다.","자격 교육, 소독 의무, 감염 사고 보고, 책임보험 등이 중간적인 규제 수단이 될 수 있다.","시술의 종류와 위험에 따라 의료 전문가 협력이 필요한 경우를 다르게 정할 수 있다."],"followupAnswer":"위생 교육과 인증, 감독이 실효적으로 작동한다면 일부 시술에 별도 자격제도를 설계할 수 있다. 다만 고위험 시술과 합병증에는 의료적 대응이 보장돼야 한다."},{"id":149,"title":"의대 정원 확대","page":296,"vol":2,"chapter":"의료·보건정책","question":"의과대학 정원을 확대하면 지역·필수의료 부족이 해결될까?","focus":"의료인력 공급·지역 배치·수련·보상체계.","viewA":"장기적으로 의사 수를 늘릴 수 있다.","viewB":"전공·지역 편중과 교육 여건 문제가 남는다.","followup":"의사 수 확대 없이 필수의료 인력을 늘리는 방안은?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["의대 정원 확대는 의사 총량을 늘리는 정책이지만 실제 지역·전공별 인력 배치를 보장하지 않는다.","의사 수 증가의 효과는 수련시설·교수·교육의 질을 충분히 확보했는지에 따라 달라진다.","지역·필수의료 기피 원인이 보수·근무환경·법적 위험에 있다면 공급 확대만으로 해결하기 어렵다.","정원 조정과 별개로 전공별 유인, 공공 인프라, 의료전달체계 개선을 검토해야 한다.","보건의료 정책의 목표를 의사 수 자체보다 실제 서비스 접근성과 환자 안전에 두는 것이 중요하다."],"followupAnswer":"필수의료 보상과 근무환경 개선, 수련 지원으로 인력을 재배치할 수 있다. 다만 장기적인 총인력 수요도 따로 분석해 공급정책과 병행해야 한다."},{"id":150,"title":"보편교육","page":301,"vol":2,"chapter":"교육정책","question":"모든 교육을 동일한 수준으로 제공해야 할까?","focus":"교육 기회균등·능력 다양성·공교육 재원.","viewA":"공통 기초교육은 시민의 출발선을 보장한다.","viewB":"개별 능력과 적성에 맞는 교육이 부족해질 수 있다.","followup":"취약계층 집중 지원은 보편교육과 모순인가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["보편교육은 누구나 사회생활의 기초 능력과 민주적 시민 역량을 갖출 교육 기회를 보장하는 원칙이다.","동일한 교과를 제공하는 것만으로 장애·가정환경·지역 격차가 사라지지 않을 수 있다.","반대로 능력별 차이를 이유로 이른 시기에 교육기회를 고착시키면 계층 재생산 문제가 커진다.","공통적인 기초교육과 개별 맞춤 지원을 병행하는 모델을 검토할 수 있다.","학교 교육의 목표를 단순 시험 점수뿐 아니라 시민적 평등과 사회적 이동성으로 확장할 수 있다."],"followupAnswer":"취약계층에 더 많은 자원을 지원하는 것은 오히려 보편교육의 실질적 목표를 달성하는 방법일 수 있다. 다만 선별 지원이 낙인이나 분리를 초래하지 않도록 해야 한다."},{"id":151,"title":"기여입학제","page":307,"vol":2,"chapter":"교육정책","question":"대학이 기부·기여를 이유로 일부 학생을 선발해도 될까?","focus":"교육 기회 평등·대학 재원·사회적 신뢰.","viewA":"기부금이 전체 교육재원을 확충할 수 있다.","viewB":"입학 기회가 부와 배경에 따라 배분될 수 있다.","followup":"기부금의 전액 장학금 사용 조건이라면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["기여입학제 논쟁은 대학이 기부금을 받아 교육재원을 확보하는 이익과 입학 기회의 평등 사이에서 발생한다.","기부금이 장학금으로 사용되더라도 특정 학생에게 직접 입학 특혜를 주면 경쟁의 공정성이 흔들릴 수 있다.","대학의 재정 자율성을 존중하더라도 학위와 입학기회가 거래 대상이 되는 데에는 별도 문제가 있다.","입학 심사의 투명성, 기여금의 회계 공개, 소득계층별 접근성을 함께 평가해야 한다.","기부자에 대한 명예나 사업 참여의 인정과 입학 우대는 다른 방식으로 설계할 수 있다."],"followupAnswer":"기부금을 전액 장학금으로 사용해도 입학 자체를 특혜로 배분하는 문제는 남는다. 기부는 입학선발과 분리하고 일반적인 장학·발전기금으로 운영하는 방안을 우선 검토할 수 있다."},{"id":152,"title":"학교폭력 해결방안","page":311,"vol":2,"chapter":"교육정책","question":"학교폭력은 처벌 강화와 회복적 절차 중 무엇이 효과적일까?","focus":"피해자 보호·책임·예방·교육적 회복.","viewA":"적절한 제재는 심각성을 분명히 한다.","viewB":"낙인과 배제로 재발 위험을 높일 수 있다.","followup":"피해자가 화해 절차를 거부한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["학교폭력 대응에는 피해자의 현재 안전, 가해행위에 대한 책임, 재발 방지라는 세 목표가 동시에 존재한다.","제재가 너무 가벼우면 피해자가 학교에서 계속 불안할 수 있고, 지나치게 강하면 교육적 회복 가능성이 약화될 수 있다.","관계 회복 프로그램은 자발성과 권력관계의 균형이 없으면 피해자에게 화해를 강요하는 결과가 된다.","사실조사·보호조치·처분·회복 프로그램은 목적과 단계가 다르므로 각각 적절히 운영해야 한다.","사안의 반복성·위험성·연령·반성 정도에 따라 개입 수준을 조절할 수 있다."],"followupAnswer":"피해자가 화해를 원치 않는다면 회복적 절차를 강요해서는 안 된다. 안전 분리와 책임 있는 조치를 우선하고 회복은 피해자 의사와 충분한 조건이 있을 때 선택할 수 있다."},{"id":153,"title":"학생인권과 교권","page":315,"vol":2,"chapter":"교육정책","question":"학생 인권과 교사의 교육권이 충돌하면 어떻게 해결할까?","focus":"학습권·표현의 자유·교사의 직무상 권한.","viewA":"학생의 인권은 교육 환경에서도 보장되어야 한다.","viewB":"교육적 지도와 다른 학생의 학습권도 중요하다.","followup":"수업 방해에 대한 강제적 분리조치는 허용될까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["학생 인권과 교권은 서로의 적대적 권리라기보다 안전하고 질서 있는 교육을 이루는 조건이다.","학생의 표현·휴식·사생활을 존중하면서도 다른 학생의 학습권을 해치는 행동은 관리할 수 있다.","교사의 정당한 생활지도와 자의적인 체벌·차별을 동일한 것으로 취급해서는 안 된다.","징계·분리 조치에는 사유 고지, 기간 제한, 이의제기 등 절차적 보장이 필요하다.","학급의 규모·지원 인력·상담 서비스 같은 구조적 여건도 갈등 해결에 영향을 준다."],"followupAnswer":"지속적 수업 방해가 있으면 다른 학생의 학습권을 위해 한시적 분리 조치를 검토할 수 있다. 단 이유·기간·교육 접근권을 분명히 하고 체벌이나 부당한 낙인으로 이어지지 않게 해야 한다."},{"id":154,"title":"징병제와 모병제","page":321,"vol":2,"chapter":"국방·외교정책","question":"징병제를 모병제로 전환해야 할까?","focus":"국방력·직업 선택의 자유·비용·형평.","viewA":"직업군인의 전문성과 개인 자유를 높일 수 있다.","viewB":"충원·예산·사회계층 편중 문제가 생길 수 있다.","followup":"부분 모병제·혼합형으로 단계 전환한다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["징병제는 병력의 폭넓은 확보를, 모병제는 자발적 직업군인의 전문성과 선택 자유를 중심으로 비교할 수 있다.","모병제 전환의 가능성은 군사기술·필요 병력·예산·복무 여건에 크게 좌우된다.","징병제는 강제 복무의 기회비용과 형평성 문제가 있지만 일정한 인력을 안정적으로 확보할 수 있다.","모병제는 인력 확보를 위해 충분한 보수·주거·복지·경력 지원이 필요하며 특정 계층 편중 우려도 있다.","현역·예비전력·첨단 전력의 조합과 안보 환경을 함께 평가해야 제도 선택이 구체적이 된다."],"followupAnswer":"완전 전환이 부담스럽다면 전문성이 높은 직무부터 모병 비중을 늘리는 혼합 접근을 검토할 수 있다. 다만 비용과 충원 전망, 기존 징병 대상자의 형평을 공개적으로 설명해야 한다."},{"id":155,"title":"여성징병","page":326,"vol":2,"chapter":"국방·외교정책","question":"여성에게도 병역의무를 확대해야 할까?","focus":"성평등·국방 수요·임신·돌봄·신체 차이.","viewA":"성별에 따른 의무 불균형을 줄일 수 있다.","viewB":"병력 구조와 현실적 지원 여건을 검토해야 한다.","followup":"군 복무 대신 다른 공적 의무를 선택하게 하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["여성징병 논쟁은 동일한 시민적 의무와 실질적인 군사 인력 수요 및 복무 여건이 충돌하는 문제다.","현행의 성별 분류 방식이 정당한지 논할 때 신체 능력은 직무에 따라 다른 기준을 적용할 수 있다는 점도 고려한다.","모든 국민에게 똑같은 복무를 요구하는 것이 곧 실질적 평등을 보장하는 것은 아니다.","여성의 임신·출산 관련 현실과 군 시설·안전·인사 관리의 준비 여부를 함께 살펴야 한다.","병역의 형평은 병역 외 공적 의무·보상·기회비용의 배분과도 연결된다."],"followupAnswer":"다양한 형태의 공적 복무 선택을 열면 형평 문제를 일부 완화할 수 있다. 다만 대체 의무의 내용과 강도가 불합리하게 차이나지 않도록 설계하고 국방에 필요한 인력을 먼저 분석해야 한다."},{"id":156,"title":"대북전단","page":331,"vol":2,"chapter":"국방·외교정책","question":"북한으로 보내는 전단 살포를 제한할 수 있을까?","focus":"표현의 자유·안전·남북관계.","viewA":"군사적 긴장과 접경 주민 위험을 줄일 수 있다.","viewB":"정치적 표현을 정부가 차단한다는 우려.","followup":"구체적 안전 위험이 입증된 장소만 제한하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["대북전단은 정치적 표현의 일환일 수 있으나 접경 지역의 안전과 남북관계에 실제 영향을 줄 수 있다.","국가가 표현 내용이 마음에 들지 않는다는 이유만으로 제한하면 표현의 자유를 침해한다.","반대로 구체적 충돌·군사적 위험이 높다면 장소·시기·수단에 대한 제한을 논의할 수 있다.","위험의 객관적 근거와 주민 피해, 다른 전달 방식의 가능성을 구분해 살펴야 한다.","규제가 특정 관점만 겨냥하지 않고 안전 목적에 맞게 한정되어 있는지 확인해야 한다."],"followupAnswer":"위험이 입증된 장소·시기에 제한을 두는 방식은 전면 금지보다 비례적일 수 있다. 다만 정치적 견해에 따른 차별 없이 명확한 기준과 불복 절차를 보장해야 한다."},{"id":157,"title":"법원의 독립","page":337,"vol":2,"chapter":"사법정책","question":"법원의 독립은 민주적 통제보다 우선해야 할까?","focus":"권력분립·재판 독립·책임성.","viewA":"정치적 압력을 배제해 권리를 보호한다.","viewB":"폐쇄적 조직에 대한 시민 통제가 부족할 수 있다.","followup":"독립을 해치지 않는 감시·평가제도는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법원의 독립은 정부·국회·경제적 권력자가 개별 사건의 결론에 부당하게 영향력을 행사하지 못하게 한다.","법관의 독립과 법원 조직 전체가 국민으로부터 아무런 책임을 지지 않는다는 주장은 구별해야 한다.","사법부도 행정 운영·예산·징계에서 공정하고 투명한 절차가 필요하다.","판결 내용 자체에 대한 정치적 보복과 부패·비위에 대한 적법한 책임 추궁을 구분해야 한다.","공개된 재판 절차·이유 제시·상급심 심사와 외부 감사의 역할을 분담할 수 있다."],"followupAnswer":"민주적 통제도 필요하지만 특정 판결을 바꾸기 위한 압력이어서는 안 된다. 법관 인사·예산·윤리감독의 공정한 절차를 통해 책임성을 보완할 수 있다."},{"id":158,"title":"법관의 재판상 독립","page":343,"vol":2,"chapter":"사법정책","question":"개별 법관의 판단에 외부가 개입하지 못하게 해야 할까?","focus":"재판상 독립과 법적 통일성·상급심 통제.","viewA":"당사자 사건에 대한 독립된 판단을 보장한다.","viewB":"독단적 판단이나 편차를 견제할 장치도 필요하다.","followup":"법원장·상급심의 지도가 간섭이 되는 경계는?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["재판상 독립은 법관이 개별 사건의 사실과 법률을 양심에 따라 판단할 수 있도록 하는 원칙이다.","동일한 법률을 비슷한 사건에 다르게 적용하면 법적 예측 가능성이 약화될 수 있다.","그러나 법원 조직의 윗사람이 구체적 결론을 지시하면 권력분립과 공정한 재판이 흔들린다.","상급심의 판결·법률 해석과 사전적 사건 개입은 구별해 논증해야 한다.","판결 이유의 공개와 공식적 불복 절차로 통일성을 높이는 것이 비공식적인 지시보다 적절하다."],"followupAnswer":"일반적인 교육·법률정보 공유는 가능하지만 특정 사건의 판결 방향을 지시하는 행위는 문제가 된다. 기준은 개별 재판의 결론에 부당한 영향력을 행사하는지다."},{"id":159,"title":"법관의 신분 보장과 탄핵","page":349,"vol":2,"chapter":"사법정책","question":"법관의 신분을 강하게 보장해야 할까?","focus":"사법부 독립·징계 책임·탄핵의 요건.","viewA":"정치보복을 막아 독립적 재판을 촉진한다.","viewB":"중대한 비위의 책임 추궁이 어려워질 수 있다.","followup":"일반 직업공무원보다 높은 보호가 정당한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법관 신분 보장은 불리한 판결을 했다는 이유로 해임·전보되는 일을 막아 재판의 독립을 보호한다.","강한 신분 보호가 중대한 비위에 대한 면책으로 바뀌면 사법 신뢰가 약해질 수 있다.","책임 추궁의 기준이 모호하면 권력자가 징계제도를 이용해 판결을 압박할 위험이 있다.","징계·탄핵의 사유를 명확히 하고 독립적 심사와 소명 기회를 보장해야 한다.","사건의 판결 내용에 대한 불복은 상급심을 통해 다루고 직무상 위법·비위는 별도 절차에서 다루는 것이 좋다."],"followupAnswer":"법관은 정치적 보복 위험이 크므로 일반 공무원과 다른 신분 보호의 이유가 있다. 다만 비위에 대한 실효적이고 공정한 책임 추궁 절차는 유지해야 한다."},{"id":160,"title":"법 왜곡죄","page":354,"vol":2,"chapter":"사법정책","question":"법왜곡행위를 별도 범죄로 처벌해야 할까?","focus":"사법 신뢰·명확성·재판 독립.","viewA":"고의적인 권력 남용의 책임을 물을 수 있다.","viewB":"판결 해석 차이를 형사처벌로 위축시킬 수 있다.","followup":"고의적 증거 조작과 법률 해석 오류를 구별할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법왜곡죄 논쟁은 법조인의 고의적인 법 왜곡에 형사 책임을 물을 것인지에 관한 문제다.","법률 해석에는 합리적인 의견 차이가 가능하므로 단지 판결이 뒤집혔다는 이유로 범죄로 취급해서는 안 된다.","허위 사실 조작, 증거 은폐, 청탁 수수 등 고의적 비위는 법률 해석의 자유와 구별된다.","구성요건이 모호하면 법관·검사·변호인이 위축되어 독립적 판단을 내리기 어렵다.","기존 비위 처벌과 감찰·징계 장치로 충분한지 검토한 뒤 별도 범죄의 필요성을 판단해야 한다."],"followupAnswer":"고의적 증거 조작은 객관적 행위와 피해를 비교적 구체화할 수 있지만 법 해석 오류는 논쟁적이다. 형사처벌 대상을 고의적 위법·조작행위에 좁히는 것이 중요하다."},{"id":161,"title":"상급심의 하급심 구속력","page":358,"vol":2,"chapter":"사법정책","question":"상급심 판결이 하급심 판단을 반드시 구속해야 하나?","focus":"법적 안정성·통일성과 개별 사건의 독립.","viewA":"유사 사건 결과의 일관성을 높인다.","viewB":"새로운 사실·사회 변화에 따른 법 발전을 막을 수 있다.","followup":"파기환송 후 다른 증거가 나타났다면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["상급심의 판단은 법 해석의 통일성과 법적 안정성에 중요한 역할을 하지만 사건마다 사실관계가 다를 수 있다.","이미 확정된 사실·법률 판단과 환송 후 새롭게 확인된 사실의 효력을 구분해 봐야 한다.","하급심이 상급심의 모든 의견을 무조건 따르지 않으면 사건 처리가 지연되고 예측 가능성이 줄 수 있다.","반대로 새로운 증거나 법령 변경이 있어도 기계적으로 구속하면 실질적 정의가 침해될 수 있다.","어떤 쟁점이 구속력을 갖는지의 범위를 분명히 하는 접근이 중요하다."],"followupAnswer":"새 증거가 법률 판단의 전제를 실질적으로 바꿨다면 하급심이 그 변화를 평가할 필요가 있다. 다만 이미 판단된 쟁점은 정해진 절차에 따라 존중해야 법적 안정성이 유지된다."},{"id":162,"title":"피의자와 피고인의 권리","page":364,"vol":2,"chapter":"사법정책","question":"피의자 보호를 강화하면 범죄 수사가 어려워질까?","focus":"무죄추정·방어권·증거 확보의 적법성.","viewA":"권리 보장은 오판과 강압 수사를 막는다.","viewB":"수사 지연·증거 인멸의 우려가 존재한다.","followup":"중대 범죄 혐의가 있어도 같은 절차를 보장할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["피의자·피고인의 권리에는 무죄추정, 변호인의 조력, 진술거부권, 적법한 절차에 따른 신체 자유 보호가 포함된다.","형사절차의 목적은 범죄자를 발견하는 데 그치지 않고 무고한 사람을 잘못 처벌하지 않는 데도 있다.","강압 수사는 겉으로는 자백을 얻을 수 있어도 진실 발견과 재판의 신뢰를 오히려 해칠 수 있다.","증거 수집의 적법성, 방어권 보장, 피해자 보호를 동시에 달성할 수 있는 절차를 고민해야 한다.","피의자에게 권리가 있다는 사실을 범죄행위에 대한 면책으로 오해하지 않도록 구별한다."],"followupAnswer":"중대한 범죄 혐의라도 절차적 권리의 기본은 유지되어야 한다. 위험에 맞는 합법적 강제수사를 허용하되 영장·변호인·불복 절차를 통해 남용을 통제해야 한다."},{"id":163,"title":"변호인의 비밀 유지 의무","page":373,"vol":2,"chapter":"사법정책","question":"변호사는 의뢰인의 불법행위 정보를 외부에 공개해야 할까?","focus":"비밀유지·변론권·제3자 피해 예방.","viewA":"의뢰인과의 신뢰가 실질적 방어권을 보장한다.","viewB":"중대한 미래 피해를 예방할 필요가 있는 상황이 있다.","followup":"이미 일어난 범죄와 예정된 위해를 다르게 다룰까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["변호사의 비밀유지 의무는 의뢰인이 불리한 사실도 숨기지 않고 상담할 수 있게 하여 실질적인 변론권을 보장한다.","비밀 보호가 약해지면 의뢰인은 법적 위험을 충분히 설명하지 못해 오히려 문제 해결이 어려워질 수 있다.","반면 구체적인 장래 위해나 제3자의 중대한 피해가 임박한 경우 예외를 검토할 이유가 있다.","이미 발생한 위법 사실과 앞으로 계획된 중대한 위해를 구분하면 예외의 근거를 더 명확히 할 수 있다.","개인적 도덕 판단으로 비밀을 공개하기보다 법이 정한 예외와 전문직 윤리 절차를 따라야 한다."],"followupAnswer":"과거 사실의 상담 내용은 강하게 보호할 이유가 있다. 반면 장래의 중대한 위해가 구체적이고 임박한 경우에는 법이 허용하는 좁은 예외를 검토할 수 있다."},{"id":164,"title":"법조비리 해결방안","page":378,"vol":2,"chapter":"사법정책","question":"법조계의 부적절한 전관 영향력을 어떻게 줄일까?","focus":"전관예우·이해충돌·재판 공정성.","viewA":"수임 제한·투명한 배당·정보 공개로 신뢰를 높인다.","viewB":"직업 선택과 의뢰인의 변호인 선택권을 제한한다.","followup":"강제적 수임 제한 대신 절차 공개를 강화하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["법조비리 해결은 전관예우와 이해충돌, 비공식 접촉, 사건 배당의 불투명성을 줄이는 문제다.","재판 결과에 대한 불신이 생기는 이유는 실제 부패뿐 아니라 이해관계가 드러나지 않는 구조에 있다.","무조건적 전관 취업·수임 금지는 직업 선택권과 의뢰인의 변호인 선택권에 영향을 준다.","사건 배당의 객관화, 접촉 기록 공개, 이해충돌 신고, 독립적인 감찰이 대안이 될 수 있다.","제재를 강화하는 것과 비리의 탐지·입증 가능성을 높이는 것을 함께 고려해야 한다."],"followupAnswer":"절차 공개와 이해충돌 관리가 실효적이면 광범위한 수임 금지의 필요성은 줄 수 있다. 그러나 회전문 인사가 부당한 영향력을 행사하는 구체적 분야에는 제한을 검토할 수 있다."},{"id":165,"title":"AI 판사","page":383,"vol":2,"chapter":"사법정책","question":"AI가 판결의 일부 또는 전부를 맡아도 될까?","focus":"공정성·설명 가능성·재판 받을 권리.","viewA":"유사사건의 일관성과 사건 처리 효율을 높인다.","viewB":"데이터 편향·책임 소재·개별 사정 누락 우려.","followup":"AI를 법관의 보조수단으로만 허용하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["AI 판사는 유사사건 분석·문서 정리·판례 검색의 보조 역할과 최종 법적 판단의 권한을 구별해 평가해야 한다.","같은 데이터에서 반복되는 편향이 자동화되면 외형상 일관성은 높아도 실질적 공정성은 나빠질 수 있다.","판결에는 당사자의 말과 개별 사정, 법규범의 의미에 대한 공개적 정당화가 필요하다.","AI를 활용한다면 판단 과정의 설명, 이의제기, 인간에 의한 재심사와 책임 귀속이 중요하다.","효율성만으로 재판을 받을 권리와 법관의 독립을 대체할 수 있는지 신중히 검토해야 한다."],"followupAnswer":"보조수단으로의 활용은 사건 처리와 정보 접근을 개선할 수 있다. 다만 결론의 책임은 인간 법관이 지고 당사자가 AI 사용 사실과 오류 가능성을 다툴 수 있어야 한다."},{"id":166,"title":"변호사의 성공보수","page":390,"vol":2,"chapter":"사법정책","question":"변호사가 승소 결과에 따라 보수를 받는 계약은 정당한가?","focus":"접근성·이해충돌·소송 왜곡 위험.","viewA":"소송 비용이 부족한 사람의 접근성을 높일 수 있다.","viewB":"변호사에게 부적절한 승소 유인이 생길 수 있다.","followup":"사건 유형별로 성공보수를 달리 규율하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["성공보수는 결과에 연동된 보수로 법률 서비스 접근성과 변호사의 이해관계에 동시에 영향을 준다.","선임료가 부담스러운 사람에게 분쟁 해결 기회를 넓힐 수 있지만 변호인이 과도한 위험을 감수하거나 합의를 왜곡할 유인이 생길 수 있다.","사건의 결과를 금전 가치로 측정하기 어려운 형사·가사 분야에서는 다른 문제가 나타난다.","계약의 명확성, 정보 제공, 보수 상한, 이해충돌 예방 장치를 검토할 수 있다.","보수의 정당성을 의뢰인 보호와 변호사 직업윤리, 사법접근성으로 나눠 판단한다."],"followupAnswer":"사건별 피해·관계 구조가 다르므로 유형별 규율이 가능하다. 특히 의뢰인의 자기결정을 해칠 위험이 큰 분야에는 더 엄격한 정보제공·보수 제한이 필요할 수 있다."},{"id":167,"title":"변호사 강제주의","page":394,"vol":2,"chapter":"사법정책","question":"재판에서 반드시 변호사를 선임하도록 해야 할까?","focus":"실효적 방어권·소송의 효율·비용 부담.","viewA":"전문적 주장·증거 제출로 재판의 질을 높인다.","viewB":"저소득층의 사법 접근성을 떨어뜨릴 수 있다.","followup":"국선지원과 함께 도입하면 문제가 완화되나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["변호사강제주의는 일정한 재판에서 법률 전문가의 참여를 필수로 하여 소송의 질과 효율을 높이려는 구상이다.","전문적 주장 능력이 부족한 당사자는 중요한 증거와 법리를 놓칠 수 있지만 선임 비용의 부담도 크다.","의무화가 법률서비스 공급 부족을 심화시키면 오히려 재판 접근성이 낮아질 수 있다.","국선변호·법률구조·간이절차·온라인 정보 제공 등이 비용 문제를 완화할 수 있다.","사건 금액·복잡성·심급별로 의무화 범위를 달리 설계할 수 있다."],"followupAnswer":"국선지원과 함께 도입하면 접근성 문제가 줄지만 충분한 변호사 공급·품질이 보장돼야 한다. 복잡한 사건과 단순한 사건을 구별한 단계적 도입도 가능하다."},{"id":168,"title":"개 식용 금지와 동물원 폐지","page":398,"vol":2,"chapter":"시사이슈","question":"개 식용 금지와 동물원 폐지는 같은 원칙에서 나오는가?","focus":"동물의 고통·전통·교육·보전 목적.","viewA":"동물의 불필요한 고통과 착취를 줄인다.","viewB":"문화적 다양성과 적정한 관리시설의 가치를 고려한다.","followup":"동물복지를 충족한 보호·교육시설도 금지해야 하나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["개 식용 금지와 동물원 폐지는 모두 동물의 고통을 논하지만 인간의 소비와 교육·보전 목적은 성격이 다르다.","불필요한 고통을 줄이는 목적이 같아도 시설 유형과 사육 환경에 따라 구체적 규율이 달라질 수 있다.","동물원의 보전·구조 기능과 오락 목적의 감금은 동일하게 취급하기 어렵다.","역사·문화적 관행은 고려할 수 있지만 학대나 불필요한 고통의 독립적 정당화가 되지는 않는다.","권리 선언보다 먹이·공간·의료·이동 같은 복지 기준을 엄격하게 설정하는 방법이 가능하다."],"followupAnswer":"동물을 보호·치료하거나 보전하는 실질적 시설이라면 일반적인 오락 목적 시설과 구분할 필요가 있다. 보호 목적을 주장하더라도 복지·공공성에 대한 검증은 요구해야 한다."},{"id":169,"title":"GMO","page":404,"vol":2,"chapter":"시사이슈","question":"유전자변형식품의 생산·판매를 규제해야 할까?","focus":"식량 생산·안전성 평가·생태계 위험·표시.","viewA":"생산성·기후 적응·영양 개선 가능성이 있다.","viewB":"장기 생태 영향과 소비자 선택을 고려해야 한다.","followup":"검증된 GMO에도 별도 경고표시가 필요한가?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["GMO 논쟁에서는 특정 유전자 변형기술의 위험과 각각의 식품·작물의 안전성 평가를 구분한다.","생산성 향상과 기후 적응에 도움이 될 수 있으나 생태계 확산이나 종자시장 집중 문제도 검토할 필요가 있다.","‘유전자 변형’이라는 분류만으로 모든 제품이 위험하거나 안전하다고 단정하면 오류가 생긴다.","개별 성분의 안전성, 환경 영향, 추적 관리, 소비자 정보 제공을 기준으로 평가해야 한다.","표시제의 목적이 건강 경고인지 단순한 선택 정보인지에 따라 기준을 달리 정할 수 있다."],"followupAnswer":"안전성이 충분히 검증된 식품이라면 위험 경고로 오인될 표시는 신중해야 한다. 다만 소비자 선택을 돕는 정확하고 비차별적인 정보 제공은 별도로 논의할 수 있다."},{"id":170,"title":"보호입원제와 사법입원제","page":408,"vol":2,"chapter":"시사이슈","question":"강제 입원의 결정을 의료진과 법원 중 누가 내려야 할까?","focus":"자유권·치료 필요성·독립된 심사.","viewA":"긴급 치료가 필요한 상황에 신속히 대응한다.","viewB":"강제 입원은 신체 자유를 크게 제한하므로 통제가 필요하다.","followup":"응급입원과 장기입원의 심사 주체를 나눌까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["보호입원·사법입원 논쟁은 정신건강 치료 필요성과 신체의 자유를 제한하는 강제조치의 절차를 다룬다.","환자의 판단능력과 현재 위험이 제한적인데 가족·의료기관의 편의만으로 입원시키면 중대한 권리침해가 된다.","반대로 급박한 자해·타해 위험이 있다면 심사 지연이 생명·건강에 직접적인 위험을 만들 수 있다.","입원 결정의 근거, 독립적 심사, 치료계획, 계속 입원 필요성에 대한 주기적 재평가가 중요하다.","치료를 거부하는 성인의 권리를 존중하면서도 위험의 구체성과 덜 침해적 대안의 가능성을 구별한다."],"followupAnswer":"긴급하고 중대한 위험에는 우선적 보호조치를 허용할 수 있지만 장기 입원은 독립된 심사와 이의제기 절차를 강화할 필요가 있다. 퇴원 후 지역사회 지원도 중요하다."},{"id":171,"title":"사법적 개혁과 입법적 개혁","page":414,"vol":2,"chapter":"시사이슈","question":"사회적 문제는 법원의 판결과 국회의 입법 중 무엇으로 해결해야 할까?","focus":"사법적 개혁·민주적 정당성·권리 보호.","viewA":"재판은 개별 권리침해를 신속히 교정할 수 있다.","viewB":"포괄적 제도개선은 입법·예산의 영역이다.","followup":"입법부가 장기간 움직이지 않으면 법원이 개입할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["사법적 개혁은 법원의 판결을 통해 권리를 구제하는 경로이고 입법적 개혁은 일반적인 규칙과 예산을 바꾸는 경로다.","재판은 구체적 사건의 피해를 바로잡기 유리하지만 모든 사회문제를 한 번에 해결하지는 못한다.","입법은 민주적 정당성과 보편성을 확보할 수 있지만 정치적 교착으로 늦어질 수 있다.","기본권 침해가 긴급한지, 법률에 빈틈이 있는지, 새로운 재정 지출이 필요한지 구별해 적합한 수단을 찾는다.","개별 사건의 구제와 제도 전반의 수정이 상호 보완적일 수 있다는 점을 강조한다."],"followupAnswer":"입법 지연이 중대한 권리침해를 방치한다면 법원은 주어진 법과 권한 범위에서 구제를 검토할 수 있다. 다만 새로운 제도 설계와 재원 배분의 최종 책임은 입법부의 영역임을 고려해야 한다."},{"id":172,"title":"부채와 불평등","page":419,"vol":2,"chapter":"시사이슈","question":"가계·국가 부채 증가는 불평등을 심화시킬까?","focus":"부채의 사용목적·금리·세대별 분배효과.","viewA":"생산적인 차입은 기회를 확대할 수 있다.","viewB":"취약층의 이자 부담과 자산 격차가 확대될 수 있다.","followup":"대출이 교육·주거 자산 형성에 쓰이면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["부채는 미래 소득을 앞당겨 투자할 수 있는 수단이지만 상환능력이 부족하면 불평등을 확대할 수 있다.","동일한 대출이라도 교육·생산적 창업과 소비성 채무의 장기 효과는 다를 수 있다.","자산가격이 오를 때 부유층은 담보를 활용하기 쉽고 저소득층은 높은 이자 부담을 지기 쉽다.","금리·만기·소득 안정성·담보 자산 등 채무 구조를 함께 살펴야 한다.","부채 문제의 해법은 단순히 빚을 금지하는 것이 아니라 금융 접근성과 채무조정을 균형 있게 설계하는 것이다."],"followupAnswer":"교육·주거 자산 형성에 쓰이는 건전한 차입은 기회를 넓힐 수 있다. 다만 시장이 급변해 상환능력을 넘어서지 않도록 금리·부채 비율과 소비자 보호를 관리해야 한다."},{"id":173,"title":"이기심과 이타심","page":423,"vol":2,"chapter":"시사이슈","question":"사람은 이기심을 바탕으로도 공동선을 만들 수 있을까?","focus":"개인 유인·협력·제도 설계.","viewA":"개인의 이익 추구가 교환과 혁신을 촉진한다.","viewB":"외부효과·무임승차로 공동재가 훼손될 수 있다.","followup":"자발적 협력만으로 공공재를 공급할 수 있나?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["개인의 이익 추구는 교환·경쟁·혁신의 동기가 되지만 시장의 결과가 항상 공동선을 의미하지는 않는다.","타인에게 피해를 떠넘기는 외부효과와 모두가 이익을 얻으려는 공공재의 무임승차 문제가 나타날 수 있다.","자발적 협력은 신뢰와 반복 관계가 있을 때 작동하기 쉽지만 대규모·익명 사회에서는 한계가 있다.","법·세금·보조금·평판·협동조합은 개인 유인을 공동의 목표와 연결하는 서로 다른 장치다.","어떤 제도를 선택할지는 당사자 수, 정보의 공개성, 피해의 범위와 집행비용에 달려 있다."],"followupAnswer":"자발적 협력만으로 공공재가 충분히 공급되지 않을 수 있다. 부담을 분담하는 규칙과 투명한 집행, 협력을 유도하는 제도를 결합해야 한다."},{"id":174,"title":"고령운전자 면허 반납","page":428,"vol":2,"chapter":"시사이슈","question":"고령운전자에게 면허 반납을 권고하거나 강제해야 할까?","focus":"교통안전·이동권·개별 능력 평가.","viewA":"인지·신체 기능 저하와 사고 위험을 줄일 수 있다.","viewB":"연령만 기준으로 삼으면 차별과 고립을 초래한다.","followup":"나이 대신 정기적 기능검사로 대체하면?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["고령운전자 면허 반납은 사고 예방이라는 공익과 이동의 자유·지역사회 참여를 함께 고려한다.","나이는 위험을 가늠하는 하나의 지표지만 개인의 실제 운전능력을 완전히 설명하지는 못한다.","면허를 잃으면 대중교통이 부족한 지역의 고령자가 의료·생활시설에 접근하기 어려울 수 있다.","인지·시력·반응 능력의 주기적 평가, 조건부 면허, 대체 교통지원 등을 비교할 수 있다.","안전 효과뿐 아니라 연령 차별과 사회적 고립이라는 부작용까지 정책평가에 포함해야 한다."],"followupAnswer":"나이 대신 객관적 기능검사를 활용하면 차별을 줄일 수 있다. 다만 검사 비용과 주기, 위험이 확인된 사람에 대한 대체 이동수단 보장까지 설계해야 한다."},{"id":175,"title":"민족","page":432,"vol":2,"chapter":"시사이슈","question":"민족 정체성은 국가의 정책 기준이 되어야 할까?","focus":"공동체 정체성·시민적 평등·다문화.","viewA":"공통 역사·문화가 사회적 연대를 강화한다.","viewB":"배타적 민족 기준은 시민의 동등한 지위를 침해한다.","followup":"국적·시민권과 민족적 정체성을 분리해야 할까?","source":"교재 목차에 실린 주제명과 원문 시작 쪽수를 확인했습니다. 핵심·심화 해설과 꼬리질문 답은 AI가 독립적으로 작성한 학습 보충자료이며 저자의 모범답안이 아닙니다.","deep":["민족은 역사·문화·언어·공동체 의식과 관련되지만 국가의 법적 구성원인 시민권과 언제나 일치하지는 않는다.","공통 정체성은 연대를 강화할 수 있지만 특정 혈통·문화만 정당한 국민의 기준으로 삼으면 배제가 발생한다.","문화적 유산을 보호하는 정책과 개인의 동등한 법적 지위를 제한하는 정책은 구별해야 한다.","이주·다문화 사회에서는 시민적 충성·법 준수와 출신 배경을 분리할 필요가 커진다.","국가의 상징과 전통을 존중하면서도 모든 시민의 기본권과 정치참여를 평등하게 보장하는 모델을 논의할 수 있다."],"followupAnswer":"법적 권리·의무는 국적과 시민적 지위를 중심으로 정하고 민족적 정체성은 개인이 자유롭게 가질 수 있는 문화적 소속으로 보호하는 것이 바람직하다. 배타적 혈통 기준은 경계해야 한다."}];

<script>
(() => {
  'use strict';
  const TOPICS = window.LAW_TOPICS || [];
  const STORAGE_KEY = 'lawschool175-sprint-2026-v1'; // 이전 버전과 동일한 키: 같은 출처라면 진도 호환
  const $ = id => document.getElementById(id);
  const svg = name => `<svg class="ico" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const pad = n => String(n).padStart(3, '0');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const newState = () => ({items:{},history:[],lastId:1,theme:'dark'});
  const validId = n => Number.isInteger(n) && n >= 1 && n <= 175;
  function getState() {
    try {
      const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!v || typeof v !== 'object') return newState();
      return {...newState(),...v,items:(v.items && typeof v.items==='object' && !Array.isArray(v.items))?v.items:{},history:Array.isArray(v.history)?v.history:[]};
    } catch(e){ return newState(); }
  }
  let state = getState();
  let currentId = validId(+state.lastId) ? +state.lastId : 1;
  let currentView = 'study', mode = 'all', indexFilter = 'all', railFilter = 'all';
  let indexQuery = '', railQuery = '', revealed = false, deepOpen = false, followOpen = false;
  let randomMode = false, animating = false, modalType = null;
  let clockSeconds = 70, clockRunning = false, lastSuppressedClick = 0;
  let toastTimeout = 0, slideTimer = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chapterLabel = t => `${t.vol}권 · ${t.chapter}`;
  const item = id => (state.items && state.items[id]) || {};
  const hasGrade = d => [0,1,2].includes(d.grade);

      <p>정해진 정답을 외우기보다, 내 기준을 한두 문장으로 남겨 보세요. 입력 내용은 자동 저장됩니다.</p>
      <label class="note-label" for="myStance">나의 한 줄 결론</label><input class="note-field" id="myStance" maxlength="350" placeholder="예: 원칙적으로 허용하되 일정한 조건은 필요하다" value="${esc(d.stance||'')}">
      <label class="note-label" for="myMemo">판단기준 / 반론 / 떠오른 사례</label><textarea class="note-field textarea" id="myMemo" placeholder="자유롭게 적어 보세요. 말로 설명할 핵심을 한두 줄로 정리해도 좋아요.">${esc(d.memo||'')}</textarea>
      <div class="note-actions"><button data-modal="close">닫기</button><button class="save-note" data-modal="saveNote">${svg('check')} 저장</button></div>`;
    $('myStance').focus({preventScroll:true});
  }
  function saveNoteIfOpen(){
    const stance=$('myStance'),memo=$('myMemo');
    if(!stance||!memo||modalType!=='note')return;
    const d=item(currentId);
    if(stance.value!==String(d.stance||'')||memo.value!==String(d.memo||''))patch(currentId,{stance:stance.value,memo:memo.value});
  }
  function exportBackup(){
    const content={app:'lawschool175-sprint',version:1,savedAt:new Date().toISOString(),records:state};
    const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`law175-backup-${localDate()}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);notify('JSON 파일로 백업했어요.');
  }
  async function importBackup(file){
    if(!file)return;
    try {
      const raw=JSON.parse(await file.text());const v=raw.app==='lawschool175-sprint'?raw.records:raw;
      if(!v||typeof v.items!=='object'||Array.isArray(v.items))throw Error('invalid items');
      if(!window.confirm('현재 학습 기록을 백업 파일로 교체할까요?'))return;
      const clean=newState();clean.lastId=validId(+v.lastId)?+v.lastId:1;
      for (const [key,val] of Object.entries(v.items)){
        const id=+key; if(!validId(id)||!val||typeof val!=='object')continue;
        clean.items[id]={grade:[0,1,2].includes(val.grade)?val.grade:undefined,star:!!val.star,
          stance:typeof val.stance==='string'?val.stance.slice(0,5000):'',memo:typeof val.memo==='string'?val.memo.slice(0,50000):'',
          reps:Number.isFinite(+val.reps)?Math.max(0,+val.reps):0,reviewAt:typeof val.reviewAt==='string'?val.reviewAt:undefined,updatedAt:typeof val.updatedAt==='string'?val.updatedAt:undefined};
      }
      clean.history=Array.isArray(v.history)?v.history.filter(h=>h&&validId(+h.id)&&['string'].includes(typeof h.day)).slice(-3000):[];
      state=clean;save();currentId=state.lastId;mode='all';resetCard();closeModal();renderStudy();notify('학습 기록을 불러왔어요.');
    } catch(e){notify('지원되는 LAW 175 JSON 백업 파일이 아닙니다.');}finally{$('backupFile').value='';}
  }
  function resetAll(){
    if(!window.confirm('학습 기록과 메모를 전부 초기화할까요? 복구하려면 기존 백업 파일이 필요합니다.'))return;
    state=newState();save();currentId=1;mode='all';resetCard();closeModal();renderStudy();notify('학습 기록을 초기화했어요.');
  }
  function toggleAccordion(which){
    if(which==='deep')deepOpen=!deepOpen;else followOpen=!followOpen;
    renderExtra();
    const next=$(`[data-extra="${which}"]`); if(next)next.focus({preventScroll:true});
  }
  function activateNav(which){
    switch(which){
      case 'learn':mode='all';closeIndex();if(currentView==='study')renderStudy();else showStudy();renderNav();break;
      case 'index':openIndex();break;
      case 'review':startMode('weak');break;
      case 'stats':closeIndex();renderDashboard();window.scrollTo({top:0,behavior:'smooth'});break;
    }
  }
  // ====== Input controls ======
  $('studyFlashcard').addEventListener('click', e => {
    const action=e.target.closest('[data-card-action]');if(!action||Date.now()-lastSuppressedClick<420)return;
    if(action.dataset.cardAction==='reveal')showAnswer();else if(action.dataset.cardAction==='question')hideAnswer();
  });
  $('studyDock').addEventListener('click', e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.grade!==undefined){rate(+b.dataset.grade);return;}
    switch(b.dataset.control){case 'prev':nextTopic(-1);break;case 'next':nextTopic(1);break;case 'reveal':showAnswer();break;}
  });
  $('extraArea').addEventListener('click',e=>{
    const b=e.target.closest('[data-extra],#memoBtn');if(!b)return;
    if(b.id==='memoBtn')openModal('note');else toggleAccordion(b.dataset.extra);
  });
  $('bookmarkBtn').addEventListener('click',toggleBookmark);
  $('settingsBtn').addEventListener('click',()=>openModal('settings'));
  $('railSettings').addEventListener('click',()=>openModal('settings'));
  $('clockBtn').addEventListener('click',toggleClock);
  $('railSearch').addEventListener('input',e=>{railQuery=e.target.value.trim();renderRail();});
  document.querySelector('.rail-chips').addEventListener('click',e=>{const b=e.target.closest('[data-rail-filter]');if(!b)return;railFilter=b.dataset.railFilter;renderRail();});
  $('railList').addEventListener('click',e=>{const b=e.target.closest('[data-rail-goto]');if(!b)return;mode='all';navigateTo(+b.dataset.railGoto,1,currentView==='study');});
  $('indexResults').addEventListener('click',e=>{const b=e.target.closest('[data-index-goto]');if(!b)return;mode=indexFilter;const id=+b.dataset.indexGoto;closeIndex();navigateTo(id,id<currentId?-1:1,currentView==='study');});
  $('indexFilters').addEventListener('click',e=>{const b=e.target.closest('[data-index-filter]');if(!b)return;indexFilter=b.dataset.indexFilter;renderIndex();});
  $('indexSearch').addEventListener('input',e=>{indexQuery=e.target.value.trim();renderIndex();});
  $('closeIndex').addEventListener('click',closeIndex);$('drawerScrim').addEventListener('click',closeIndex);
  document.querySelector('.mobile-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)activateNav(b.dataset.nav);});
  $('dashboardPage').addEventListener('click',e=>{
    const b=e.target.closest('[data-dash],[data-chapter-id]');if(!b)return;
    if(b.dataset.chapterId){mode='all';navigateTo(+b.dataset.chapterId,1,false);return;}
    if(b.dataset.dash==='continue'){mode='all';showStudy();}
    else if(b.dataset.dash==='weak')startMode('weak');
    else if(b.dataset.dash==='unseen')startMode('unseen');
  });
  $('utilityModal').addEventListener('click',e=>{
    const b=e.target.closest('[data-modal]');if(!b)return;
    switch(b.dataset.modal){
      case 'close':closeModal();break;
      case 'saveNote':saveNoteIfOpen();closeModal();notify('메모를 저장했어요.');break;
      case 'export':exportBackup();break;
      case 'import':$('backupFile').click();break;
      case 'index':closeModal();openIndex();break;
      case 'shuffle':randomMode=!randomMode;renderSettings();notify(randomMode?'무작위 학습 켜짐':'목차 순서 학습 켜짐');break;
      case 'reset':resetAll();break;
    }
  });
  $('utilityModal').addEventListener('input',e=>{if(e.target.matches('#myStance,#myMemo'))saveNoteIfOpen();});
  $('modalScrim').addEventListener('click',closeModal);
  $('backupFile').addEventListener('change',e=>importBackup(e.target.files[0]));
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(modalType){e.preventDefault();closeModal();return;}
      if(!$('indexSheet').hidden){e.preventDefault();closeIndex();return;}
      if(currentView==='dashboard'){showStudy();return;}
    }
    const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||modalType||!$('indexSheet').hidden)return;
    if(e.key==='ArrowRight'){e.preventDefault();nextTopic(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();nextTopic(-1);}
    else if(e.code==='Space'&&currentView==='study'){e.preventDefault();revealed?hideAnswer():showAnswer();}
    else if(currentView==='study'&&revealed&&['1','2','3'].includes(e.key)){rate(+e.key-1);}
    else if(currentView==='study'&&e.key.toLowerCase()==='b'){toggleBookmark();}
  });
  // ====== Horizontal swipe (Safari/iOS Pointer Events); vertical reading scroll remains native ======
  const shell=$('gestureShell');
  let drag=null;
  shell.addEventListener('pointerdown',e=>{
    if(animating||currentView!=='study'||modalType||!$('indexSheet').hidden)return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button:not(.flash-front)'))return;
    drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,startTime:performance.now(),horizontal:false,vertical:false};
  },{passive:true});
  shell.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId)return;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    drag.lastX=e.clientX;drag.lastY=e.clientY;
    if(drag.vertical)return;
    if(!drag.horizontal){
      if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)*1.1){drag.vertical=true;return;}
      if(Math.abs(dx)>11&&Math.abs(dx)>Math.abs(dy)*1.1)drag.horizontal=true;
    }
    if(drag.horizontal){
      shell.classList.add('dragging');
      shell.style.transform=`translate3d(${Math.max(-115,Math.min(115,dx))}px,0,0) rotate(${Math.max(-4,Math.min(4,dx/25))}deg)`;
      shell.style.opacity=String(Math.max(.65,1-Math.abs(dx)/550));
      if(e.cancelable)e.preventDefault();
    }
  },{passive:false});
  function endGesture(e,wasCanceled=false){
    if(!drag||drag.id!==e.pointerId)return;
    const d=drag;drag=null;
    const dx=d.lastX-d.startX,dy=d.lastY-d.startY,duration=performance.now()-d.startTime;
    if(d.horizontal){
      lastSuppressedClick=Date.now();
      shell.classList.remove('dragging');shell.style.transition='transform .18s ease,opacity .18s ease';shell.style.transform='';shell.style.opacity='';
      const enough=Math.abs(dx)>=62||(Math.abs(dx)>=38&&duration<260&&Math.abs(dx)>Math.abs(dy)*1.25);
      if(!wasCanceled&&enough){nextTopic(dx<0?1:-1);}
      else setTimeout(()=>{shell.style.transition='';},200);
    }
  }
  shell.addEventListener('pointerup',e=>endGesture(e));shell.addEventListener('pointercancel',e=>endGesture(e,true));
  window.addEventListener('pagehide',()=>{if(modalType==='note')saveNoteIfOpen();save();});
  setInterval(()=>{if(!clockRunning)return;if(clockSeconds>0)clockSeconds--;if(clockSeconds===0){clockRunning=false;notify('70초가 지났어요. 핵심을 확인해 보세요.');}renderClock();},1000);
  // Once deployed to GitHub Pages, serve offline; hosted updates use network-first for index.
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
  }
  if(TOPICS.length!==175||TOPICS.some((t,i)=>t.id!==i+1||!t.focus||!t.followupAnswer||t.deep.length!==5)){
    $('studyFlashcard').textContent='학습 데이터가 올바르지 않습니다. 페이지를 다시 업로드해 주세요.';
    return;
  }
  resetCard();renderStudy();
})();

</script>
</body>
</html>
